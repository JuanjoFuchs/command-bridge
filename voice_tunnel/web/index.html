      // and spectrally subtracts, and AGC ramps its gain over the first second or two, which
      // is very likely why the FIRST utterance of a session transcribes worst and later ones
      // are fine. Dictation tools that outperform us here (Handy) read the raw device.
      //
      // So: NS and AGC off by default. Echo cancellation stays ON — the reply plays out of
      // the speakers into this same microphone, and without EC the agent transcribes itself.
      // Override per-session with ?ns=1&agc=1&ec=0 to A/B it.
      const q = new URLSearchParams(location.search);
      const flag = (name, dflt) => q.has(name) ? q.get(name) === "1" : dflt;
      const constraints = {
        channelCount: 1,
        echoCancellation: flag("ec", true),
        noiseSuppression: flag("ns", false),
        autoGainControl:  flag("agc", false),
      };
      // ?device=<substring> picks a specific microphone by label instead of the system default.
      // Needed so an automated harness can point the page at a virtual audio cable without
      // changing the machine's default recording device, and useful on its own when the
      // default is the wrong mic. Labels are only populated once permission is granted, so
      // this takes two getUserMedia calls on the first run.
      const remembered = localStorage.getItem("voice-tunnel.micId");
      if (remembered && !q.get("device")) {
        constraints.deviceId = { exact: remembered };
      }
      const want = q.get("device");
      if (want) {
        try {
          const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
          probe.getTracks().forEach((t) => t.stop());
          const devices = await navigator.mediaDevices.enumerateDevices();
          const match = devices.find(
            (d) => d.kind === "audioinput" &&
                   d.label.toLowerCase().includes(want.toLowerCase())
          );
          if (match) constraints.deviceId = { exact: match.deviceId };
          else diag.errors.push("no audio input matching " + want);
        } catch (e) {
          diag.errors.push("device select: " + e.message);
        }
      }

      diag.constraints = constraints;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: constraints });
      } catch (err) {
        // A remembered microphone can be unplugged between sessions. Falling back to the
        // default beats refusing to start and looking broken.
        if (constraints.deviceId) {
          diag.errors.push("preferred mic unavailable, using default");
          delete constraints.deviceId;
          localStorage.removeItem("voice-tunnel.micId");
          micStream = await navigator.mediaDevices.getUserMedia({ audio: constraints });
        } else { throw err; }
      }
      diag.settings = micStream.getAudioTracks()[0].getSettings();
      diag.deviceLabel = micStream.getAudioTracks()[0].label;
      // The microphone has been granted at least once on this page. Never cleared — it is what
      // lets the orb say "Off" rather than "Tap to start" after `closeChannel` ends the tracks.
      everStarted = true;
      // Permission has landed, so device labels are populated for the first time. There is no
      // AudioContext yet, so this builds the lists and nothing more; the route is applied by the
      // second call below, once there is something to route.
      await refreshDevices("permission");
    } catch (e) {
      // On a LAN IP navigator.mediaDevices is undefined and this is a TypeError. That is not
      // a bug to fix here — it is the secure-context rule. See ai-docs/reference/browser.md.
      const msg = (navigator.mediaDevices ? e.message : "insecure origin — needs HTTPS or localhost");
      diag.errors.push("getUserMedia: " + msg);
      phase = "denied";
      applyOrb();
      setError("microphone unavailable: " + msg);
      return;
    }

    // Created inside the click handler so the autoplay policy unlocks playback too.
    ctx = new AC();
    if (ctx.state === "suspended") await ctx.resume();
    // A NEW CONTEXT OPENS ON THE BROWSER'S DEFAULT OUTPUT, whatever he chose last time. Put it
    // back before anything can play through it — a reply that arrives during setup would
    // otherwise come out of the wrong speaker and be gone before the route caught up.
    await refreshDevices("start");

    // The page already connected on load, so re-announce the REAL sample rate rather than
    // opening a second socket. `hello` is idempotent server-side — it just updates the rate the
    // resampler uses — and a stale 48000 here would silently resample every frame wrongly.
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "hello", sample_rate: ctx.sampleRate }));
    } else {
      await openSocket(ctx.sampleRate);
    }

    source = ctx.createMediaStreamSource(micStream);
    // ScriptProcessorNode is deprecated but universally present, including headless Chrome.
    // For one local user at 4096 frames the main-thread cost is irrelevant, and it removes a
    // whole class of AudioWorklet module-loading failure from the critical path.
    // AudioWorklet, NOT ScriptProcessorNode.
    //
    // ScriptProcessorNode runs its callback on the MAIN THREAD, and Chrome throttles main-thread
    // timers in a backgrounded tab. Measured 2026-07-29: switching to another window produced
    // 14 seconds of EXACT digital zero in the server's capture — not a quiet room, no audio at
    // all — and every word spoken in that window was lost. Since the whole point is to talk
    // while doing something else, that is fatal.
    //
    // AudioWorklet runs on the audio rendering thread and keeps delivering while the tab is
    // backgrounded. ScriptProcessor remains as a fallback for browsers without it.
    // The worklet is handed a 128-sample block per render quantum — ~375 per second at 48 kHz.
    // Posting each one individually would mean 375 WebSocket messages a second, nearly all
    // header overhead. Batch into ~40 ms chunks first: same audio, ~15 messages/sec.
    const batchSize = Math.round(ctx.sampleRate * 0.04);
    const workletSrc = `
      class Cap extends AudioWorkletProcessor {
        constructor(o) {
          super();
          this.size = (o.processorOptions && o.processorOptions.batchSize) || 1920;
          this.buf = new Float32Array(this.size);
          this.n = 0;
        }
        process(inputs) {
          const ch = inputs[0] && inputs[0][0];
          if (ch && ch.length) {
            for (let i = 0; i < ch.length; i++) {
              this.buf[this.n++] = ch[i];
              if (this.n === this.size) {
                this.port.postMessage(this.buf.slice(0));
                this.n = 0;
              }
            }
          }
          return true;   // keep running even when the input is momentarily silent
        }
      }
      registerProcessor('cap', Cap);
    `;
    const onChunk = (ch) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      // Mute is enforced HERE, by not sending. Not on the server, and not by stopping the audio
      // graph: a mute that still ships audio to something promising to ignore it is not a mute
      // anyone should have to trust, and tearing down the graph would cost a re-permission
      // prompt to come back. The level ring goes still too, which is the visible proof.
      if (muted) { levelTarget = 0; return; }
      // A closed channel sends nothing. The graph keeps running so reopening costs no permission
      // prompt, but no audio leaves the page.
      if (!channelOpen) { levelTarget = 0; return; }
      let sum = 0;
      for (let i = 0; i < ch.length; i++) sum += ch[i] * ch[i];
      const r = Math.sqrt(sum / ch.length);
      if (r > diag.peakRms) diag.peakRms = r;
      // Normalise against a typical speaking level (~0.15 RMS) so the ring uses its full
      // range on ordinary speech instead of only reacting to shouting.
      levelTarget = Math.min(1, r / 0.15);
      reportSpeaking(r);
      ws.send(floatToPCM16(ch).buffer);
      diag.framesSent++;
    };

    let usedWorklet = false;
    if (ctx.audioWorklet) {
      try {
        const url = URL.createObjectURL(new Blob([workletSrc], { type: "text/javascript" }));
        await ctx.audioWorklet.addModule(url);
        URL.revokeObjectURL(url);
        node = new AudioWorkletNode(ctx, "cap", {
          numberOfOutputs: 0,
          processorOptions: { batchSize },
        });
        node.port.onmessage = (e) => onChunk(e.data);
        source.connect(node);
        usedWorklet = true;
      } catch (e) {
        diag.errors.push("audioWorklet: " + e.message);
      }
    }
    if (!usedWorklet) {
      node = ctx.createScriptProcessor(4096, 1, 1);
      node.onaudioprocess = (ev) => onChunk(ev.inputBuffer.getChannelData(0));
      source.connect(node);
      const sink = ctx.createGain(); sink.gain.value = 0;  // pull the graph, stay silent
      node.connect(sink); sink.connect(ctx.destination);
    }
    diag.capture = usedWorklet ? "audioworklet" : "scriptprocessor";

    running = true;
    // Tell the server the microphone is actually live. A connected socket is not a listening
    // one, and the agent cannot tell those apart without being told.
    tellServer("capturing", true);
    // The first tap is BOTH "grant the microphone" and "go live" — one gesture, because that is
    // what a tap means to him. Every tap after this one is only the channel.
    channelOpen = true;
    tellServer("channel", true);
    // Anything said while the page sat un-tapped has been waiting for an AudioContext. It exists
    // now, so let it out.
    drainClips();
    await acquireWakeLock();

    // Do NOT claim to be listening until audio is actually arriving. Between tapping and the
    // first frames there is socket setup plus the mic's own warm-up, and a page that says
    // "Listening" during that window invites you to start talking into a gap — which is very
    // likely why the owner's first utterance after a reload came back garbled.
    phase = "warming";
    applyOrb();
    const framesAtStart = diag.framesSent;
    await new Promise((res) => {
      const t0 = Date.now();
      (function check() {
        if (diag.framesSent > framesAtStart + 2 || Date.now() - t0 > 4000) return res();
        setTimeout(check, 60);
      })();
    });

    $orb.classList.add("live");
    phase = "live";
    // Through the one painter rather than hard-coding "Listening": a mute persisted from the
    // last session is restored before `running` is true, so the visual it wanted was skipped,
    // and the orb would read "Listening" over a muted microphone.
    applyOrb();
  }

  // `keepSocket` is what turns this from "end the session" into "release the microphone". A device
  // change wants the whole thing rebuilt; the orb switching off wants the tab, the socket, the
  // transcript and the URL left exactly where they are — see `closeChannel`.
  async function stop({ keepSocket = false } = {}) {
    running = false;
    channelOpen = false;
    tellServer("capturing", false);
    tellServer("channel", false);
    try { if (node) node.disconnect(); } catch {}
    try { if (source) source.disconnect(); } catch {}
    try { if (micStream) micStream.getTracks().forEach(t => t.stop()); } catch {}
    // NULLED, not merely stopped. An ended track still answers `getSettings()` with the device it
    // used to be on, and `refreshDevices` paints the input picker from exactly that call — so a
    // released microphone would keep naming a device it is no longer holding, which is the "shows
    // what was requested" failure this file spent 2026-08-15 removing. It matters more now that
    // the released state is somewhere he SITS rather than a moment between two starts.
    node = null; source = null; micStream = null;
    if (!keepSocket) { try { if (ws) ws.close(); } catch {} }
    try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {}
    // CLOSE THE CONTEXT, and null it so nothing reaches a closed one. `start()` builds a fresh
    // AudioContext every time and this used to abandon the old one still holding its output
    // stream open — so every microphone change leaked a context, and a leaked context holds a
    // route. Two contexts pointing at two different sinks is a fight the picker cannot describe,
    // let alone win. Browsers also cap how many a page may have, so the leak ends in a `start()`
    // that throws outside the handler that reports microphone failures: the orb sticks on
    // "Starting" and says nothing.
    //
    // Stop the live source FIRST. `src.stop()` fires `onended`, which is what unwinds `drainClips`
    // cleanly; `ctx.close()` alone is not required to fire it (see the guard in playClip). The
    // QUEUE is deliberately left alone — this is a device change, not "stop talking to me", so
    // those replies are still wanted and `start()` drains them into the new context.
    try { if (playingSource) playingSource.stop(); } catch {}
    playingSource = null;
    try { if (ctx) await ctx.close(); } catch {}
    ctx = null;
    phase = "idle";
    // THE AGENT'S STATE IS THE SERVER'S FACT, so forget it only when we stop listening to the
    // server. With `keepSocket` the socket is still open and the agent is still working — it keeps
    // pushing `agent_state` — so clearing it here would tell him, the moment he taps back on, that
    // the work he switched away from had finished. It had not; we had merely stopped watching.
    if (!keepSocket) agentState = "idle";
    playing = false;
    $orb.classList.remove("live", "speaking");
    applyOrb();
  }

  function openSocket(sampleRate) {
    return new Promise((resolve) => {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(token)}`);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        diag.connected = true;
        ws.send(JSON.stringify({ type:"hello", sample_rate: sampleRate }));
        // Re-assert both toggles on every connect. The server holds them in memory, so a
        // restart or a dropped socket would otherwise leave the page showing "Verbose" while
        // the agent reads false — a disagreement neither side can see.
        // Mute is a fact about THIS device's microphone, so the client still asserts it — and so
        // is whether the microphone is running at all, which must be re-asserted on every
        // reconnect or a resumed session looks unstarted.
        // Verbose is NOT pushed — the server owns it and sends it on the ready frame, because a
        // preference about the agent must not be reverted by whichever page connected last.
        tellServer("muted", muted);
        tellServer("capturing", running);
        // The channel is a fact about this device too, and re-asserting it is what releases
        // anything queued while the socket was down. Without it a reconnect leaves the server
        // believing the channel is shut and the queue never drains.
        tellServer("channel", channelOpen);
        // Never resume a stale "he is talking". A socket that dropped mid-sentence would
        // otherwise leave the server holding every reply until the 15 s bound expired.
        speakingSignal = false;
        tellServer("speaking", false);
        resolve();
      };
      ws.onclose = () => {
        diag.connected = false;
        if (running) scheduleReconnect();
      };
      ws.onerror = () => { diag.errors.push("websocket error"); resolve(); };
      ws.onmessage = onMessage;
    });
  }

  // --- staying connected ----------------------------------------------------
  // Android suspends a backgrounded tab, so the socket dies whenever the phone locks or the owner
  // switches apps. The MICROPHONE genuinely cannot record in the background — that is a platform
  // rule, not something to work around — but needing a manual page refresh to get the session
  // back is entirely self-inflicted. Live, 2026-08-01: "whenever I switch screens or lock my
  // phone for just up to a minute, it disconnects and I have to refresh."
  let reconnectTimer = null, reconnectDelay = 0, reconnecting = false;
  const RECONNECT_MIN = 500, RECONNECT_MAX = 8000;

  function scheduleReconnect(immediate) {
    if (reconnecting) return;
    // Deliberately NOT gated on `running`. The page connects on load now, so the socket can drop
    // before the first tap — and when this was gated, that drop produced silence: no reconnect
    // attempt and no message. Live, 2026-08-01: "the server or the UI did not show me when it
    // was disconnected. And I tried speaking and the transcription didn't work."
    //
    // A retry loop that hides the disconnection is worse than no retry loop, because at least a
    // visible "disconnected" tells you to reload.
    clearTimeout(reconnectTimer);
    // Backoff, so a server that is genuinely down is not hammered — but a hidden tab waits for
    // the return to foreground instead of burning retries it cannot succeed at anyway.
    const delay = immediate ? 0 : (reconnectDelay = Math.min(
      RECONNECT_MAX, reconnectDelay ? reconnectDelay * 2 : RECONNECT_MIN
    ));
    // Say it plainly, and keep saying it. Every failed attempt repaints this, so the page can
    // never sit looking connected while it is not.
    setError(reconnectDelay >= RECONNECT_MAX
      ? "disconnected — still retrying"
      : "disconnected — reconnecting…");
    $orb.classList.remove("live");
    reconnectTimer = setTimeout(reconnect, delay);
  }

  async function reconnect() {
    if (reconnecting) return;
    if (ws && ws.readyState === WebSocket.OPEN) return;
    reconnecting = true;
    try {
      // The AudioContext is suspended along with the tab; without resuming it the socket comes
      // back and no audio ever flows, which looks exactly like a broken microphone — and is
      // precisely the "I tried speaking and the transcription didn't work" symptom.
      if (ctx && ctx.state === "suspended") { try { await ctx.resume(); } catch (e) {} }
      await openSocket(ctx ? ctx.sampleRate : 48000);
      if (ws && ws.readyState === WebSocket.OPEN) {
        reconnectDelay = 0;
        diag.reconnects = (diag.reconnects || 0) + 1;
        setError("");
        if (running) $orb.classList.add("live");
        applyOrb();
        // RE-READ THE DEVICES AND RE-APPLY THE ROUTE. A socket that dropped means the server
        // restarted or the tab was suspended, and in both cases time passed with this page not
        // looking: earbuds can have disconnected and come back, and the audio stack can have
        // re-resolved the output underneath us. Everything else on this path is re-asserted
        // already — mute, capturing, channel, speaking — because the same reasoning applies to
        // each of them. The route was the one fact left assuming it had survived.
        await refreshDevices("reconnect");
      } else {
        scheduleReconnect();
      }
    } catch (e) {
      diag.errors.push("reconnect: " + e.message);
      scheduleReconnect();
    } finally {
      reconnecting = false;
    }
  }

  async function onMessage(ev) {
    if (typeof ev.data === "string") {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === "turn") {
        diag.turns.push(msg);
        if ($partial) { $partial.remove(); $partial = null; }   // the final supersedes it
        addRow(msg.addressed ? "you" : "heard", msg.text,
               msg.addressed ? "addressed" : "", msg.id);
        placeDivider();
      } else if (msg.type === "audio_header") {
        pendingClip = msg;                       // the bytes follow in the next frame
      } else if (msg.type === "ready") {
        // Adopt the server's verbose, do not assert our own — it is one preference he holds,
        // not one per browser.
        if (msg.verbose !== undefined) paintVerbose(msg.verbose);
        if (msg.wake) wakeName = msg.wake;
        applyOrb();
      } else if (msg.type === "verbose") {
        // Someone flipped it elsewhere — another device, or the agent via `voice-tunnel verbose on`.
        paintVerbose(msg.value);
      } else if (msg.type === "stop_playback") {
        // He started talking over the reply and the voiceprint confirmed it was him. Stop now.
        // `src.stop()` fires onended, so the queue drains and the orb returns to its real state
        // through the existing path rather than needing its own unwind.
        try { if (playingSource) playingSource.stop(); } catch {}
        playingSource = null;
        clipQueue.length = 0;          // anything still waiting was part of the same interruption
        diag.barges = (diag.barges || 0) + 1;
      } else if (msg.type === "channel") {
        // Another device (or a reconnect echo) changed it. Adopt without echoing back, same rule
        // as verbose: a client that replies to a broadcast makes a loop.
        channelOpen = Boolean(msg.value);
        // Same reason as `closeChannel`: a close has to silence what is already playing here, or
        // "off" means "off after this sentence".
        //
        // IT DOES NOT RELEASE THE MICROPHONE, and the asymmetry is deliberate. Releasing capture
        // is answering HIS tap on THIS device; a broadcast is something another page or a
        // reconnect echo did, and letting a message tear down a live capture would mean the mic
        // could drop mid-sentence for a reason nobody at this device can see.
        if (!channelOpen) silencePlayback();
        applyOrb();
      } else if (msg.type === "wake") {
        // The agent renamed itself mid-session (`voice-tunnel wake --name codex`). Nothing on
        // screen prints the phrase any more, so this is recorded rather than painted — the
        // harness still asserts the page learned it.
        wakeName = msg.name || wakeName;
        diag.wake = wakeName;
      } else if (msg.type === "agent_state") {
        // Silence is ambiguous. Naming the state is what separates "it did not hear me" from
        // "it heard me and is working" from "it is holding back so as not to cut me off".
        // Name the operation, do not soften it. "Hearing you" was a friendlier word for
        // transcribing and it cost precision — Live: "it's not clear, hearing you, we should
        // say transcribing." He is watching a machine work; the label should say which machine.
        // The names themselves live in ORB_LABELS, next to the reducer that uses them.
        //
        // THIS HANDLER SETS ONE VARIABLE. Everything visible follows from applyOrb, including
        // whether the elapsed-seconds counter runs — which is what stops a future handler from
        //half-updating the orb and leaving it saying "Thinking" with no clock.
        diag.states.push(msg.state);
        agentState = msg.state;
        applyOrb();
      } else if (msg.type === "partial") {
        // Live preview of the utterance still being spoken. Replaced in place, then removed
        // when the final turn lands — so it reads as one sentence firming up rather than a
        // pile of near-duplicate rows.
        diag.partial = msg.text;
        diag.partials.push(msg.text);
        if (!$partial) {
          $partial = document.createElement("div");
          $partial.className = "row partial";
          const s = document.createElement("span");
          s.className = "tag"; s.textContent = "…";
          $partial.appendChild(s);
          $partial.appendChild(document.createElement("span"));
          $log.appendChild($partial);
        }
        $partial.lastChild.textContent = msg.text;
        // Same reason as addRow: the live preview grows a line at a time as you keep talking,
        // and measuring before the reflow leaves the newest words below the fold.
        revealRow($partial);
      } else if (msg.type === "consumed") {
        diag.consumed = msg.cursor;
        diag.pending = msg.pending;
        placeDivider();
      }
      return;
    }
    // Pair the bytes with the header that announced them and QUEUE it — never play inline.
    // Awaiting playback here blocked this handler for the length of the clip while the browser
    // happily dispatched the next message into a second concurrent invocation, which is how two
    // replies ended up audible at the same time.
    if (pendingClip) { clipQueue.push({ header: pendingClip, buf: ev.data }); pendingClip = null; drainClips(); }
  }

  async function drainClips() {
    // No AudioContext yet means the page has loaded but nobody has tapped the orb — and since
    // the socket now connects on load, a reply can genuinely arrive first. Leave the clips
    // QUEUED rather than throwing on ctx.createBuffer: they play the moment he taps start, so
    // "I answered while you weren't ready" costs a delay instead of the answer.
    // (The autoplay policy means we could not play them now even if we built a context here.)
    if (!ctx) return;
    // One drainer at a time. The guard is what serializes playback; without it every arriving
    // clip would start its own drain loop and we would be back to overlapping audio.
    if (draining) return;
    draining = true;
    try {
      // `ctx` in the condition, not just at the top: `stop()` closes and nulls it mid-drain when
      // he changes microphone, and every remaining clip would then be shifted off the queue only
      // to throw on `createBuffer`. Leaving them queued costs a pause; consuming them costs the
      // reply. `start()` drains again as soon as the new context exists.
      while (clipQueue.length && ctx) {
        const { header, buf } = clipQueue.shift();
        await playClip(header, buf);
      }
    } finally {
      draining = false;
    }
  }

  async function playClip(header, buf) {
    try {
      // The last moment the page can still put the sound in the right place. Costs a string
      // compare when the route is already correct, which is every clip but the first after a
      // drift — and a drift that happens without a reconnect or a `devicechange` has no other
      // hook to catch it.
      await applySink("clip");
      const pcm = new Int16Array(buf);
      const f32 = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) f32[i] = pcm[i] / 32768;
      const audio = ctx.createBuffer(1, f32.length, header.sample_rate);
      audio.getChannelData(0).set(f32);
      const src = ctx.createBufferSource();
      src.buffer = audio; src.connect(ctx.destination);
      // Held at module scope so a barge-in can stop it. A BufferSource is fire-and-forget once
      // started, so without a handle there is no way to interrupt a reply that is already playing.
      playingSource = src;
      // A cue is punctuation, not an utterance: no transcript row, no "Speaking" state, and
      // tracked separately so it never masquerades as a spoken reply.
      const isCue = Boolean(header.cue);
      if (!isCue) {
        playing = true;       // the client owns this: it knows when audio actually starts
        applyOrb();
        addRow("claude", header.text || "", "claude");
      }
      await new Promise((res) => {
        let guard = 0;
        const finish = () => { if (guard) clearInterval(guard); guard = 0; res(); };
        src.onended = finish;
        // A context CLOSED underneath a playing source is not guaranteed to fire `onended`, and
        // this promise is the one `drainClips` holds its serializing flag on — so an unfired event
        // wedges playback permanently instead of costing one clip. The context's own state is the
        // floor under the event. It only runs while a clip is genuinely in flight.
        guard = setInterval(() => { if (!ctx || ctx.state === "closed") finish(); }, 200);
        src.start();
      });
      if (playingSource === src) playingSource = null;
      if (!isCue) {
        // Clearing the flag returns the orb to whatever the model actually says — muted, closed,
        // still thinking. Hard-coding "Listening" here is what used to un-label the mute after
        // every reply. Live, 2026-08-03: "whenever I mute, it says muted. But if you speak
        // after that, it goes back to listening."
        playing = false;
        applyOrb();
      }
      (isCue ? diag.cues : diag.played).push(header.id);
      if (!isCue && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type:"played", id: header.id }));
      }
    } catch (e) {
      diag.errors.push("playback: " + e.message);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type:"client_error", message:"playback: " + e.message }));
      }
    }
  }

  // --- device pickers: what is heard, and where replies come out ------------------------------
  //
  // TWO REPORTS, ONE SECTION. The 2026-08-15 one below is about a picker that told the truth
  // about the wrong thing; the 2026-08-16 one is about there being two pickers at all —
  // "the microphone and speaker should be just one dropdown that controls both as a group
  // together". The second is answered by `pairDevices`/`paintGroup` further down, and it is
  // downstream of everything here: a control that sets both routes can only be honest if each
  // route is individually readable back, which is what the first report bought.
  //
  // REPORTED LIVE 2026-08-15: "whenever you restart the server, the client is still up. For some
  // reason, it stops using my Bluetooth device and starts outputting through the earpiece. And
  // however, the drop-down didn't change. It still says Bluetooth."
  //
  // TWO SYMPTOMS, AND THE CODE OWNED ONLY ONE OF THEM.
  //
  // The audio moving is the platform. Android does not let a page choose an output device — that
  // is `HTMLMediaElement.setSinkId`'s documented Android limitation, not an oversight here — and
  // an active capture with `echoCancellation` pulls the whole audio session into Android's
  // communication mode, whose fallback output when no headset route is up is the EARPIECE. That
  // is why it is the earpiece specifically and not the loudspeaker. Nothing in this file asked
  // for that and nothing in this file can override it.
  //
  // The picker was ours, and it was worse. There was no output picker at all — playback has
  // always gone to `ctx.destination`, wherever the OS puts that — so the drop-down he was reading
  // is the MICROPHONE. It "still said Bluetooth" because the microphone had not moved and it was
  // telling the truth about the only thing it has ever controlled. Two compounding reasons it
  // read as broken instead of irrelevant: a pill showing a bare device name makes no claim about
  // direction, and re-selecting the option already selected fires no `change` event at all — so
  // the one gesture a person makes to repair a stale control is the one gesture that does
  // nothing. Both are fixed here: the glyphs say which way each pill points, and neither list
  // waits to be corrected.
  //
  // THE RULE THAT FALLS OUT OF IT, and the reason this is one section rather than two:
  // A PICKER SHOWS WHAT IS IN USE, NEVER WHAT WAS REQUESTED. A request is right until the moment
  // it matters, and then stays confidently wrong because nothing ever contradicts it. So the
  // input list is painted from the live track's own settings, and the output list from the sink
  // the AudioContext reports back — not from `sinkWanted`, and not from `diag.settings`, which is
  // a snapshot taken at start() and therefore can never report a device that moved.

  const AC = window.AudioContext || window.webkitAudioContext;
  // "" and "default" are one device said two ways: `setSinkId("")` selects the browser default and
  // `AudioContext.sinkId` reports it back as "", while `enumerateDevices` lists that same device
  // with the id "default". Compared raw, every check disagrees with itself and the route is
  // re-applied on every clip forever.
  const normSink = (v) => (!v || v === "default" ? "" : v);
  const currentSink = () => (ctx && typeof ctx.sinkId === "string" ? ctx.sinkId : "");

  // THE ONE DOOR to the output route. Everything that could move audio calls this and nothing
  // calls `ctx.setSinkId` directly, because the failure being fixed is a route that changed
  // without the UI hearing about it — and a second call site is a second way for that to happen.
  // Free to call on any path: it compares two strings and returns when they already agree.
  async function applySink(reason) {
    if (!ctx || !sinkSupported) return;
    if (normSink(currentSink()) === normSink(sinkWanted)) return;
    try {
      await ctx.setSinkId(sinkWanted);        // "" means the browser's own default
      diag.sink.applied++;
      diag.sink.why = reason;
    } catch (e) {
      // TWO VERY DIFFERENT FAILURES WEAR THE SAME SHAPE HERE, and treating them alike is how a
      // dead control survives on screen. NotSupportedError means this PLATFORM cannot route audio
      // per page — Android owns routing, which is the whole story above — so the honest response
      // is to stop offering the choice. Anything else means THIS DEVICE went away: unpaired
      // earbuds, an unplugged dock, a sink that existed when the page loaded and does not now.
      if (e && e.name === "NotSupportedError") {
        sinkRefused = true;
        sinkSupported = false;
        diag.sink.why = "unsupported: " + e.message;
      } else {
        diag.errors.push("setSinkId: " + e.message);
        diag.sink.why = "unavailable: " + e.message;
        sinkWanted = "";
        localStorage.removeItem("voice-tunnel.sinkId");
        // SAY IT OUT LOUD. He chose a speaker and is not getting it; reverting to the default in
        // silence is the exact move that let the interface and the audio disagree in the first
        // place. This clears itself on the next successful reconnect, like every other error here.
        setError("speaker unavailable — playing through the system default");
        try { await ctx.setSinkId(""); } catch {}
      }
    }
    paintSink();
    // The grouped pill stands for BOTH routes, so a sink that fell back has to move it too —
    // otherwise the one control he was given is the one control that can be wrong about half of
    // what it claims, which is a worse version of the defect that produced it.
    paintGroup();
  }

  // Paint the output picker from the CONTEXT, never from `sinkWanted`. This is the whole answer to
  // "the drop-down didn't change": the selection is a readout of the routing rather than a memory
  // of an instruction, so if the route falls back the control falls back with it, visibly, and he
  // learns from the picker instead of from the sound.
  function paintSink() {
    // Hidden while the grouped pill is on screen — one physical device, one control. It is still
    // painted below, because `grouped` can flip back on the next enumeration and a picker that
    // only updates while visible would return stale.
    $spkpick.hidden = !sinkSupported || grouped;
    diag.sink.supported = sinkSupported;
    diag.sink.wanted = sinkWanted;
    if (!sinkSupported) { diag.sink.inUse = null; diag.sink.shown = null; return; }
    const have = normSink(currentSink());
    diag.sink.inUse = have;
    const opts = Array.from($spk.options);
    const match = opts.find((o) => normSink(o.value) === have)
               || opts.find((o) => normSink(o.value) === "");
    if (match) match.selected = true;
    else {
      // Playing through a device the enumeration does not list. Left alone, the browser displays
      // option zero — a specific, confident, wrong answer, which is the failure mode this whole
      // section exists to remove. Name the gap instead.
      const o = document.createElement("option");
      o.value = have; o.textContent = "current output";
      o.selected = true;
      $spk.appendChild(o);
    }
    diag.sink.shown = $spk.value;
  }

  // Chrome lists the same physical device up to three times: once for real, and once each as the
  // `default` and `communications` pseudo-devices, all sharing a groupId. The real entry is the
  // one worth naming and the one worth selecting, so the aliases are only ever tie-breakers.
  const ALIAS_IDS = new Set(["default", "communications"]);
  // "Default - Headset (WH-1000XM4)" is Chrome labelling the alias, not the device. Kept off the
  // grouped pill because the pill already means "the device", and a name that says which alias it
  // came from is noise in a control whose whole job is to name one object.
  const cleanLabel = (s) => (s || "").replace(/^(Default|Communications)\s+-\s+/i, "").trim();

  // GROUP BY `groupId`, WHICH IS ALREADY ON EVERY ENUMERATED DEVICE — so this is a rewrite of how
  // the lists are rendered, not new capability. Returns only the groups with BOTH halves present,
  // because a group with one half cannot be driven by a control that claims to set both.
  function pairDevices(ins, outs) {
    const map = new Map();
    const side = (kind) => (d) => {
      if (!d.groupId) return;
      let g = map.get(d.groupId);
      if (!g) { g = { in:null, out:null, label:"" }; map.set(d.groupId, g); }
      // Prefer the REAL entry over Chrome's aliases, for the id and for the label alike. First
      // writer wins otherwise, and the aliases usually sort first.
      //
      // BETWEEN THE TWO HALVES, first writer wins and that is deliberate — inputs are offered
      // first, so a group is named after its microphone. No rule picks the "better" name, because
      // there isn't one: on the device he actually reported, a Bluetooth headset, both halves
      // carry the same product name, and on a built-in card neither half names the card. Identity
      // here is the `groupId`; the label is only how he recognises it. A rule that reached into
      // label text to choose would be the same guesswork this function exists to avoid.
      const better = g[kind] === null || (ALIAS_IDS.has(g[kind]) && !ALIAS_IDS.has(d.deviceId));
      if (better) g[kind] = d.deviceId;
      const label = cleanLabel(d.label);
      if (label && (!g.label || (!ALIAS_IDS.has(d.deviceId) && g.labelFromAlias))) {
        g.label = label;
        g.labelFromAlias = ALIAS_IDS.has(d.deviceId);
      }
    };
    ins.forEach(side("in"));
    outs.forEach(side("out"));
    return new Map([...map].filter(([, g]) => g.in !== null && g.out !== null));
  }

  // Paint the grouped pill from the LIVE track and the LIVE sink — never from the last selection.
  // Same rule as `paintSink`, and it bites harder here: one control standing for two routes has
  // two ways to become a lie, so it has to be able to say "these are not the same device".
  function paintGroup() {
    $devpick.hidden = !grouped;
    // THE CLUSTER WIDTH FOLLOWS THE LAYOUT, and this is the only place that decides it — every
    // path that can change which pills are on screen ends here. Keyed on what is ACTUALLY VISIBLE
    // rather than on `grouped`, because the one-pill fallback (an input list with no selectable
    // output, i.e. Android) fits the narrow cluster perfectly well; only two pills need the room.
    $controls.classList.toggle("split", !$micpick.hidden && !$spkpick.hidden);
    diag.group.supported = grouped;
    diag.group.count = deviceGroups.size;
    for (const stale of Array.from($dev.querySelectorAll("option[data-synthetic]"))) stale.remove();
    if (!grouped) { diag.group.inUse = null; diag.group.shown = null; return; }
    const track = micStream && micStream.getAudioTracks()[0];
    const liveIn = track ? track.getSettings().deviceId : undefined;
    // `currentSink()` reports the browser default as "", while `enumerateDevices` lists that same
    // device as "default" — the pair `normSink` exists for. Look the alias up, not the blank.
    const groupIn = groupOfDevice.get(liveIn) || null;
    const groupOut = groupOfDevice.get(normSink(currentSink()) || "default") || null;
    const match = groupIn && groupIn === groupOut
      ? Array.from($dev.options).find((o) => o.value === groupIn) : null;
    if (match) {
      match.selected = true;
      diag.group.inUse = groupIn;
      diag.group.why = "grouped";
    } else {
      // Option zero would otherwise be displayed: a specific, confident, wrong answer, which is
      // the failure this whole section exists to remove. Name the gap instead — and name WHICH
      // gap, because "not enumerated yet" and "your ears and your mouth are on different devices"
      // call for completely different responses.
      const split = Boolean(groupIn && groupOut);
      const o = document.createElement("option");
      o.value = ""; o.dataset.synthetic = "1"; o.selected = true;
      o.textContent = split ? "mic and speaker on different devices" : "current devices";
      $dev.appendChild(o);
      diag.group.inUse = null;
      diag.group.why = split ? "split across two devices" : "in use but not enumerated";
    }
    diag.group.shown = $dev.value;
  }

  // Rebuilt on every event that can change what is attached or where audio goes: the permission
  // grant, the context opening, a RECONNECT, and the browser's own `devicechange`. It used to run
  // exactly once, inside start() — so a list built at the first tap was still on screen hours
  // later, whatever had been plugged in or paired since.
  async function refreshDevices(reason) {
    if (!navigator.mediaDevices?.enumerateDevices) return;
    let devices;
    try { devices = await navigator.mediaDevices.enumerateDevices(); }
    catch (e) { diag.errors.push("enumerate: " + e.message); return; }

    const ins = devices.filter((d) => d.kind === "audioinput");
    const outs = devices.filter((d) => d.kind === "audiooutput");

    // --- output capability ---------------------------------------------------
    // BOTH halves are feature-detected, and which half is missing is recorded, because that is the
    // question a live phone session can answer and no test here can: Android is expected to fail
    // the first check, the second, or both, and "it came out of the earpiece" is not evidence of
    // which. Guessing at this is what produced a suspected mechanism that turned out to be wrong.
    // Decided BEFORE the grouping below, because a platform that cannot move output cannot honour
    // a control that claims to move both halves either.
    diag.sink.devices = outs.length;
    if (sinkRefused) sinkSupported = false;
    else if (!AC || !("setSinkId" in AC.prototype)) { sinkSupported = false; diag.sink.why = "no setSinkId on this platform"; }
    else if (!outs.length) { sinkSupported = false; diag.sink.why = "no audiooutput devices enumerated"; }
    else { sinkSupported = true; diag.sink.why = "selectable"; }

    // --- can the two halves be paired? ---------------------------------------
    // ALL-OR-NOTHING, and deliberately strict. Every input and every output must belong to a group
    // that has both halves; one ungrouped device and the combined pill silently cannot reach it,
    // which is the dead-switch defect wearing a tidier layout. Falling back costs him a second
    // dropdown he has seen before. Getting it wrong costs him a device he cannot select at all.
    deviceGroups = pairDevices(ins, outs);
    groupOfDevice = new Map();
    for (const d of devices) {
      if (d.groupId && deviceGroups.has(d.groupId)) groupOfDevice.set(d.deviceId, d.groupId);
    }
    const covered = (list) => list.every((d) => d.groupId && deviceGroups.has(d.groupId));
    grouped = Boolean(sinkSupported && ins.length && outs.length
                      && covered(ins) && covered(outs));
    if (!grouped) {
      diag.group.why = !sinkSupported ? "output not selectable on this platform"
        : !ins.length || !outs.length ? "nothing enumerated on one side"
        : "some devices report no usable groupId";
    }

    // --- input ---------------------------------------------------------------
    // The device actually feeding the graph, read LIVE off the track every time. Labels are empty
    // until permission is granted, so the pill stays hidden until there is something real to show.
    const track = micStream && micStream.getAudioTracks()[0];
    const live = track ? track.getSettings().deviceId : undefined;
    if (ins.length) {
      $mic.innerHTML = "";
      for (const d of ins) {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || "microphone";
        if (d.deviceId === live) o.selected = true;
        $mic.appendChild(o);
      }
      diag.micInUse = live === undefined ? null : live;
      diag.micShown = $mic.value;
    }
    // The two single-purpose pills stay BUILT even while hidden: `grouped` is recomputed on every
    // enumeration, so an unpaired headset can put them back on screen at any moment, and a list
    // that only populates while visible would arrive empty at exactly that moment.
    $micpick.hidden = grouped || !ins.length;

    // --- output --------------------------------------------------------------
    if (sinkSupported) {
      $spk.innerHTML = "";
      for (const d of outs) {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || (normSink(d.deviceId) === "" ? "system default" : "speaker");
        $spk.appendChild(o);
      }
    }

    // --- the grouped pill ----------------------------------------------------
    if (grouped) {
      $dev.innerHTML = "";
      for (const [id, g] of deviceGroups) {
        const o = document.createElement("option");
        o.value = id;
        o.textContent = g.label || "audio device";
        $dev.appendChild(o);
      }
    }

    // RE-APPLY. On the reconnect path this is the line whose absence is the bug: a socket coming
    // back is exactly the moment the page can no longer assume anything it set up before the drop
    // is still in force.
    await applySink(reason);
    paintSink();
    paintGroup();
  }

  // The set of attached devices changed under us — earbuds paired, a dock unplugged, a headset
  // that went away and came back. This is the ONLY event that can tell the page a sink has
  // returned, so it is also the only chance to put audio back on it without him touching
  // anything. Which is the point: he should not have to notice, and if he does notice, the
  // picker should already agree with him.
  if (navigator.mediaDevices && "ondevicechange" in navigator.mediaDevices) {
    navigator.mediaDevices.addEventListener("devicechange", () => { refreshDevices("devicechange"); });
  }

  $mic.addEventListener("change", async () => {
    localStorage.setItem("voice-tunnel.micId", $mic.value);
    // Full stop/start rather than surgery on a live audio graph: swapping the source node
    // mid-stream is where subtle capture bugs breed, and the turn log lives on the server so
    // a reconnect costs nothing.

    await stop();
    await start();
  });

  // No stop/start here, unlike the microphone above, and the asymmetry is real rather than an
  // oversight: `setSinkId` re-routes a LIVE context, so the session, the socket, the permission
  // grant and anything mid-playback all survive the change. Tearing the capture down to move a
  // speaker would drop his turn to fix his ears.
  //
  // Persisted, because a server restart already costs him the thread of the conversation; making
  // it cost the speaker choice on top is a second annoyance stacked on the first, and he would
  // have to notice it to fix it.
  $spk.addEventListener("change", async () => {
    sinkWanted = $spk.value;
    localStorage.setItem("voice-tunnel.sinkId", sinkWanted);
    await applySink("picked");
  });

  // ONE GESTURE, BOTH HALVES — AND THE ORDER IS THE WHOLE DESIGN.
  //
  // The two handlers above are deliberately asymmetric: the microphone tears the capture down and
  // rebuilds it, because swapping the source on a live audio graph is where subtle capture bugs
  // breed; the speaker does not, because `setSinkId` re-routes a live context and tearing capture
  // down to move a speaker "would drop his turn to fix his ears". A combined control has to do
  // both, so it inherits both reasons — which means the SINK GOES FIRST.
  //
  // Sink first is instant and non-destructive: his ears are fixed before anything is torn down, so
  // a reply already playing survives the change, and if the restart below fails (a mic unplugged
  // between enumeration and this tap) he is still left better off than he started. Capture first
  // would make every device change cost a dropped turn — paying the microphone's price for a
  // gesture that is usually about the speaker.
  //
  // Both halves are written to the SAME localStorage keys the single pickers use, so persistence,
  // the `start()` restore path and the fallback layout all keep working unchanged. A third stored
  // preference would be a third thing to go stale.
  $dev.addEventListener("change", async () => {
    const group = deviceGroups.get($dev.value);
    // The synthetic "current devices" option has an empty value and names a state, not a choice.
    // Selecting it is not a request for anything, so it must not move audio anywhere.
    if (!group) { paintGroup(); return; }

    sinkWanted = group.out;
    localStorage.setItem("voice-tunnel.sinkId", sinkWanted);
    await applySink("picked");

    localStorage.setItem("voice-tunnel.micId", group.in);
    await stop();
    await start();
  });

  // Sync the readout at load so `diag.sink` describes the page from its first moment rather than
  // from the first enumeration. Hides the output pill, which the markup already does — the value
  // is that a harness reading `diag` before anyone taps gets the restored preference, not a blank.
  paintSink();
  paintGroup();

  $orb.addEventListener("click", orbTapped);

  // Connect on load, before any tap. The socket needs no permission and no gesture — only the
  // microphone does — so making the page arrive already connected costs nothing and is what the owner
  // already believed was happening. It also means the transcript, cues and replies work the
  // moment the page opens, and the first tap has one job instead of three.
  (async () => {
    try { await openSocket(48000); } catch (e) { diag.errors.push("initial connect: " + e.message); }
  })();
  if (!token) setError("no token in URL — append ?token=…");
})();
</script>
</body>
</html>
