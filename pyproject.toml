[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "command-bridge"
version = "0.1.0"
description = "A local command bridge: talk to your coding agent from a phone browser, no app"
authors = [{ name = "JuanjoFuchs" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["voice", "speech", "asr", "tts", "cli", "coding-agents", "agents", "tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    # No "License :: OSI Approved :: MIT License" classifier: PEP 639 supersedes it with the
    # SPDX `license` field above, and setuptools now rejects a build that carries both.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

# The floor, not the good experience. These three carry a working tunnel — the WebSocket, the
# audio buffers, and an ASR that needs nothing downloaded beyond its own model. Everything that
# makes it GOOD (a neural voice, Parakeet, the voiceprint) is an extra, because each one drags in
# a large native runtime and a first install that pulls onnxruntime twice over for features the
# user has not asked for yet is a worse introduction than one that works and can be upgraded.
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.24",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
# A neural voice instead of the robotic system one. `piper-tts` is the Python API, not the
# executable — the model is held in-process, which is 7-26x faster than spawning per reply.
piper = ["piper-tts>=1.6"]
# Kokoro: warmer than piper and measurably less harsh — `bm_daniel` and `bm_lewis` each score
# ~0.65 acum lower on DIN 45692 sharpness than en_GB-alan-medium, a larger move than any de-esser
# setting achieves. One model plus one pack of all 54 voices: `command-bridge download kokoro`.
#
# SHIPPED UNDECLARED, exactly like `turn` before 0.2.1. `command_bridge.tts` has imported
# `kokoro_onnx` since the backend landed and no extra named it, so `COMMAND_BRIDGE_TTS=kokoro` was
# unreachable from any clean install — it worked only in a checkout whose venv happened to carry
# the package already. That is the same defect twice; the guard is that a backend and its extra
# land in one commit.
#
kokoro = ["kokoro-onnx>=0.4"]
# NVIDIA Parakeet TDT via sherpa-onnx: RTF 0.077 against whisper small.en's 0.88 on the same
# utterance, from a more accurate model. Also carries the speaker embeddings the voiceprint uses.
parakeet = ["sherpa-onnx>=1.10"]
# Smart-turn: end a turn when the sentence SOUNDS finished instead of on a silence timer. Needs
# `onnxruntime` to run the 8 MB model and `transformers` for its log-mel feature extractor (numpy
# only — no torch).
#
# THIS EXTRA DID NOT EXIST UNTIL 0.2.1 AND THE FEATURE COULD NOT WORK WITHOUT IT. Neither package
# was declared anywhere, so turn detection was unreachable from any clean install of 0.2.0 —
# while `doctor` cheerfully advised `pip install command-bridge[parakeet]`, which installs neither.
# Found by handing a fresh agent nothing but `command-bridge describe`: it followed that remedy
# verbatim, checked the installed metadata, and reported that the fix could not possibly work.
# It had never worked outside a checkout that happened to carry both packages already.
turn = ["onnxruntime>=1.17", "transformers>=4.40"]
# `all` means all — the RUNTIMES, not the checkpoints. Leaving kokoro-onnx out would recreate the
# turn bug in a new place: someone who has already run `pip install command-bridge[all]` and is then
# told `pip install command-bridge[kokoro]` has no way to know the first command was supposed to
# have covered it. The 325 MB model is a separate decision and stays where it belongs, behind an
# explicit `command-bridge download kokoro`.
all = ["piper-tts>=1.6", "kokoro-onnx>=0.4", "sherpa-onnx>=1.10", "onnxruntime>=1.17", "transformers>=4.40"]
dev = [
    "build>=1.0.0",
    "playwright>=1.40",
    "pytest>=8.0",
    # Reads .github/workflows/release.yml, so the gate keeping a red suite off PyPI is asserted
    # rather than trusted. Without this the test skips, and a skipped gate is not a gate.
    "pyyaml>=6.0",
    "ruff>=0.1.0",
    "twine>=4.0.0",
]

[project.scripts]
command-bridge = "command_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/JuanjoFuchs/command-bridge"
Repository = "https://github.com/JuanjoFuchs/command-bridge.git"
Issues = "https://github.com/JuanjoFuchs/command-bridge/issues"
Documentation = "https://github.com/JuanjoFuchs/command-bridge#readme"

[tool.setuptools.packages.find]
include = ["command_bridge*"]

# The client page is DATA and must ship inside the wheel. It lives at command_bridge/web/ rather
# than beside the package for exactly this reason: an installed copy has no repo root to find it
# in, and the failure mode is the entire user interface returning 500 while every test on a
# developer's machine passes.
[tool.setuptools.package-data]
command_bridge = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
