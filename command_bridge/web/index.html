  // background tab is never quietly live.
  let channelOpen = false, speakingSignal = false, speakingSince = 0, speakingRunStart = 0;
  // HAS THE MICROPHONE EVER BEEN GRANTED ON THIS PAGE? It is what separates a cold page from one
  // he switched off, now that switching off RELEASES capture and therefore clears `running`.
  // Without it the orb would drop from "Off" back to "Tap to start" the moment the tracks end,
  // which reads as the session having died rather than as the switch he just pressed.
  let everStarted = false;
  let playingSource = null;
  // The assistant's name comes from the SERVER, so the page can never show a name the wake gate
  // no longer accepts. Nothing renders it since the status line went, but it is still recorded:
  // it is how a harness proves a mid-session rename reached this client.
  let wakeName = "";
  // WHERE REPLIES COME OUT. `sinkWanted` is what he ASKED FOR and is the only half persisted;
  // what is actually in use is read back off the AudioContext every time it is needed and never
  // cached, because a cached "in use" is precisely the lie this section exists to stop telling.
  // `sinkRefused` is sticky: a platform that answered NotSupportedError once will answer it
  // again, and re-showing the control after every enumeration would resurrect a dead switch.
  let sinkWanted = localStorage.getItem("command-bridge.sinkId") || "";
  let sinkSupported = false, sinkRefused = false;
  // ONE DEVICE, TWO HALVES. `deviceGroups` is groupId -> {in, out, label} for the physical devices
  // whose input and output were BOTH enumerated; `groupOfDevice` is the reverse index, deviceId ->
  // groupId, and it is what lets the pill be painted from the live track and the live sink rather
  // than from whatever was last clicked. `grouped` is recomputed on every enumeration and never
  // sticky, because a headset unpairing is exactly the moment one control stops being able to
  // reach both halves.
  let deviceGroups = new Map(), groupOfDevice = new Map(), grouped = false;
  // THE LAST ENUMERATION, kept verbatim. Which pills exist is a pure function of these two lists
  // (spec 009 FR4), and the things that can change the answer are not all enumeration events: a
  // sink that refused, a context that opened or closed, a route that fell back. Caching what the
  // browser last said is what lets the decision be recomputed on any of those without asking again
  // — and asking again is asynchronous, which would put a second answer in flight behind the
  // first. `refreshDevices` is the only writer.
  let lastIns = [], lastOuts = [];

  // Exposed so the e2e harness can assert on real state rather than scraping the DOM.
  // `peakRms` is not decoration: without it, "the mic is delivering silence" and "the server
  // dropped my audio" look identical from outside, and that ambiguity costs hours.
  // `states` and `partials` are recorded, not just rendered, so an automated harness can assert
  // that the UI actually SHOWED a stage rather than merely that the server sent it.
  const diag = window.__voiceTunnel = {
    connected:false, framesSent:0, peakRms:0, liveLevel:0,
    turns:[], played:[], cues:[], states:[], partials:[], errors:[],
    // Lets a harness drive the channel, mute and speaking signals WITHOUT a microphone. All
    // three normally require `running`, which requires a real `getUserMedia` grant that a
    // headless run cannot produce — so without this the states that matter most are the ones no
    // automated check can reach. Assigned below to the same `tellServer` the UI itself calls, so
    // a harness exercises the real path instead of a parallel one that can drift from it.
    signal: null,
    // AND THE AUDIO THAT HAS TO ACCOMPANY THAT SIGNAL. Since spec 005 the server publishes
    // `user_speaking` and `speech_active` as FALSE once no audio frame has arrived for
    // END_OF_UTTERANCE_MS, because in production "he is speaking" and "frames are arriving" are
    // the same fact — a page asserting the first while the second has stopped is a page that has
    // frozen, and under a speaking-gated wait that lie hangs the tunnel.
    //
    // So a harness sending only the flag was asserting a state that cannot occur, and its "a
    // reply is HELD while he is speaking" check had quietly become vacuous: it measured
    // SPEAK_GRACE_S either way. This pushes real PCM through the real socket, so the harness
    // reproduces the pairing instead of an idealised half of it — the same lesson as the
    // air-conditioner bug, where every synthetic test passed because they all fed digital zeros
    // as "silence".
    pushAudio: null,
    // The pure orb reducer. A harness calls this directly to sweep the whole state matrix —
    // every combination of running/phase/channel/mute/playing/agentState — in milliseconds,
    // without a microphone and without waiting on real transitions. The transition tests then
    // only have to prove the model is WIRED correctly, not that the rules are right.
    orbView: null,
    orb: null,
    // The pure LANE reducer, exposed for the same reason `orbView` is: a harness sweeps every
    // combination of lane count, live lane, waiting depth and per-agent state in milliseconds,
    // with no microphone, no socket and no server. The DOM checks then only have to prove the
    // model is wired to the painter, not that the rules are right.
    lanesView: null,
    lanes: null,
    // WHAT A STALLED CLIP SHOULD DO, as a pure function of the context's state and how long it
    // has been that way. Exposed for the same reason as the reducers above: the guard it drives
    // runs on a 200 ms interval inside a promise that nothing can await from a test, so the only
    // way to sweep its rules is to lift them out of the timer. The bug it exists to prevent was
    // exactly a missing case in that predicate — `suspended` was neither "closed" nor handled —
    // so the predicate is the thing worth a truth table.
    clipStallAction: null,
    // Feeds one server frame into the REAL `onMessage`, so a harness can drive the lane strip
    // without a socket, a microphone or a running tunnel. Same argument as `signal` above: the
    // alternative is a harness that pokes the model directly and therefore stops testing the
    // handler that production actually runs — which is how a page ends up passing its own suite
    // while the wiring between a message and the paint is broken.
    deliver: null,
    // THE PILL MODEL AND ITS PURE REDUCER, the same pairing as `orb`/`orbView` above and for the
    // same reason. `pills` is what the page decided last — how many DISTINCT devices there are on
    // each side after Chrome's `default`/`communications` aliases are collapsed, whether the two
    // halves paired, which pills are on screen, why each hidden one is hidden, and the route text
    // if it is knowable. `pillsView` is the function that decided it, exposed so a harness can
    // sweep every enumeration shape in milliseconds without a device, a permission or a phone.
    //
    // `show` is what the DOM is painted FROM, not a second description of it — a harness that
    // finds these two disagreeing has found a defect, which is the whole reason the model is
    // published rather than inferred by scraping.
    pills: null,
    pillsView: null,
    collapsed: false,
    // The audio ROUTE, recorded rather than merely acted on — same reason as `peakRms`. When he
    // says "it came out of the earpiece", the only useful next question is which of three things
    // was true: the platform never offered a choice (`supported:false`, `why` says which half was
    // missing), the choice was made and held (`inUse` equals `wanted`), or it was made and lost
    // (`inUse` differs, `why` names the failure). Without this, all three look identical from the
    // outside and the debugging is guesswork — which is how one live report turned into a
    // suspected mechanism that was wrong.
    sink: { supported:false, wanted:"", inUse:null, shown:null, applied:0, devices:0, why:"" },
    // WHETHER THE TWO HALVES COULD BE PAIRED AT ALL, recorded for the same reason as `sink`: from
    // outside, "this platform groups badly", "nothing enumerated" and "the mic and the speaker are
    // genuinely on different devices" all look like "he still sees two dropdowns". `why` names
    // which, and `count` says how many physical devices the page believes exist.
    group: { supported:false, count:0, inUse:null, shown:null, why:"" },
    micInUse: null, micShown: null,
    // IS THE MICROPHONE ACTUALLY HELD RIGHT NOW — read off the tracks, not a flag this code sets.
    // The whole point of the 2026-08-16 change is that "the orb is off" and "the microphone is
    // released" had drifted apart while every status the page published said they had not, so a
    // boolean written by the same function that does the releasing would be the same lie one layer
    // down. `[]` means nothing is held; `["live"]` means it is. Same discipline as `diag.sink`.
    micState: () => (micStream ? micStream.getAudioTracks().map((t) => t.readyState) : []),

  // Errors only. Anything that is merely "what is happening" belongs on the orb, which says it
  // in one word without reserving three lines of a phone screen to do so.
  const setError = (t) => {
    $err.textContent = t || "";
    $err.hidden = !t;
    if (t) diag.errors.push(t);
  };

  // WHO A ROW IS FROM OR TO (spec 013 FR3/FR4) — a PURE function, painted in exactly one place,
  // the same discipline as `orbView` and `lanesView`. A harness can assert what the transcript
  // says without a browser, which is the only reason the old literal tag went unnoticed.
  //
  // JJ, 2026-08-24, running three agents: *"in the transcript, I don't know who's talking to me.
  // And I want to know on the UI who I am addressing."* / *"In the transcript everybody shows as
  // Claude."* Both halves are one gap: nothing on the page said WHICH agent.
  //
  // ⚠ **Silent below two lanes, deliberately** — but silent about the ROUTE, not about the
  // SPEAKER. With one agent "you → magnus" on every row conveys nothing, because there is nowhere
  // else a turn could have gone. Who is speaking is a different question, and it has an answer at
  // every lane count.
  //
  // 🔴 **THE LITERAL "claude" LIVED HERE, and it is the same class of bug as the runtime incident:
  // this tool holds no model and cannot know what is driving it.** The solo branch returned the
  // string "claude" no matter who was on the other end. Caught 2026-08-25 by JJ, one lane, named

  // `many` test was doing two jobs — suppressing the arrow AND choosing the speaker's name — and
  // only the first of those depends on the lane count.
  function tagView(m) {
    const many = (m.lanes || []).length >= 2;
    if (m.from === "agent") {
      // The clip's OWN lane, never the live one: a reply can arrive after he has moved on to
      // somebody else, and it is still that agent speaking. `fallback` is the default lane —
      // the name this server was started under, which is the right answer for a clip that
      // predates lanes. "agent" is the last resort, and it is deliberately not a model name.
      return m.lane || m.fallback || "agent";
    }
    if (!m.addressed) return "heard";
    if (!many) return "you";
    // `lane: null` is NOT the same as absent. Absent means the default lane, the rule the turn log
    // already keeps. Null means the wake gate refused to resolve one, so the turn reached nobody —
    // and showing a name there would claim a delivery that did not happen.
    if ("lane" in m && m.lane === null) return "you → nobody";
    const to = ("lane" in m) ? m.lane : (m.fallback || null);

  // WHICH LANE A ROW BELONGS TO, for its hue (spec 014 FR8). His reason for wanting the colours

  // in the transcript as well."*
  //
  // ⚠ **Only above two lanes**, same rule as everything else here: with one agent every row would
  // be tinted to distinguish it from nobody. And HIS rows keep the warm — colour identifies the

  function rowHue(lane) {
    if (!lane || lanes.length < 2) return null;

  function addRow(tag, text, cls, id, lane) {
    const d = document.createElement("div");

    // from a second place in JS deciding what colour a row is.

    const ARROW = " → ";

    if (at < 0) {

      const mk = (cls, txt) => {

               mk("lane", tag.slice(at + ARROW.length)));
    }

    // which is a two-column grid — a third child lands in an implicit cell of its own rather than
    // trailing the words, so the tick was both misplaced and, being outside `.row.addressed`'s
    // flow, never read as part of the line it belonged to.
    t.className = "text";
    t.textContent = text;

    // by MOVING THE BOUNDARY DOWN TO THE REPLY, never by moving the reply up to the boundary.

    // that. I have noticed that they show below that."
    //
    // It used to insert the reply above `$divider`, which was correct only while the consumed
    // cursor was current at the instant of speaking. Once the agent began draining CONCURRENTLY
    // with its own work (2026-08-14, because draining first cost ~14s of dead air before any
    // thinking started), the cursor lags by the last turn or two — so the divider sits a few rows
    // up and every reply landed ABOVE the newest things he said. JJ, same day: "that turn in text
    // came above the two previous turns that you have spoken and above what I had spoken as
    // well. I think the order in how it's displaying in the UI is broken."
    //

    // the original promise, because speaking IS the proof — it does not depend on a cursor
    // having caught up first.
    $log.appendChild(d);
    revealRow(d);
  }

  // ALWAYS SCROLL TO THE TRUE END OF THE LOG, whatever was just inserted and wherever it went.
  //
  // This used to target the specific row that had arrived, which was right for rows and wrong for
  // everything else — most visibly the read-boundary divider, which `placeDivider` inserts AFTER
  // the row that was already scrolled to, i.e. permanently one line below the fold. The owner,
  // 2026-08-07: "the text that says claude has read to here is not always displayed... it's below
  // the scroll and I need to scroll to see it. I would like the scroll to happen automatically
  // and always take me to the bottom of the transcript."
  //
  // The original bug this replaces is still handled: `scrollTop = scrollHeight` used to run
  // BEFORE the browser had wrapped the new text, so it scrolled to the height the log had a
  // moment ago and a long reply lost its final lines. TWO frames, not one — the first lets layout
  // settle after the insert, the second measures the settled height. One frame is enough on a
  // desktop and demonstrably is not on a phone mid-animation.
  function scrollToEnd() {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      $log.scrollTop = $log.scrollHeight;
    }));
  }

  // Kept as a name because three call sites read better with it, but there is only one policy
  // now: whatever changed, show the end.
  const revealRow = () => scrollToEnd();

  // The read boundary lives INSIDE the log, sitting after the last turn claude has consumed —
  // so anything below the line is visibly still unread. Same idea as mc view's
  // "agent consumed through #N" divider: a position in the transcript says more than a count
  // floating above it, because you can see WHICH turns are still waiting.
  // WHAT HAPPENED TO ONE TURN (spec 013 FR7) — a PURE function, asserted without a browser.
  //
  // JJ, 2026-08-24: *"once it's sent, it's one check. Once it arrives to the destination, it's two
  // checks. And once the recipient has read the message, the two checks turn blue. I would like
  // something similar, but respecting this design."*
  //
  // ⚠ **"Delivered" and "read" are the same event in this tool** — a `watch` hands a turn over AND
  // moves the cursor — so mapping them naively would make two ticks and blue ticks rise together
  // and one of the three states would never be seen. The honest third state is ANSWERING: the
  // cursor proves an agent was given it, a clip spoken afterwards proves something was done with
  // it. That is the difference he actually wants to see, and the only one this tool can prove.
  function receiptView(m) {
    if (m.id === undefined || m.id === null) return { state: "", ticks: "" };
    if (m.consumed !== undefined && m.consumed !== null && m.id <= m.consumed) {
      return { state: "read", ticks: "✓", aria: "read" };
    }
    return { state: "sent", ticks: "✓", aria: "sent" };
  }

  // Paint a receipt onto every one of HIS rows. Agent rows carry none — a receipt is about
  // whether the other side got it, and he knows what he heard.
  // 🔴 A RECEIPT IS ABOUT ONE LANE, so it is read against THAT lane's cursor (spec 015 FR1).
  //
  // It used to use the session-wide `consumed`, which is a single integer overwritten by whichever
  // lane's watch reported last — so Atlas reading turn 2510 painted Claude's earlier turns blue,
  // turns Claude was never given. JJ caught it on the page: *"whenever one lane reads, I think
  // we're marking everything as read."*
  //
  // ⚠ **A turn with no lane falls back to the session cursor**, which is exactly right for the
  // thousands of turns that predate lanes: there was one reader then, and the session-wide number
  // is that reader's cursor.
  function consumedFor(lane) {
    if (lane && laneConsumed[lane] !== undefined) return laneConsumed[lane];
    if (lane && lanes.length >= 2) return -1;   // a lane we have no cursor for has read nothing
    return diag.consumed;
  }

  function paintReceipts() {
    $log.querySelectorAll(".row.addressed").forEach((row) => {
      const id = Number(row.dataset.id);
      if (!Number.isFinite(id)) return;
      const v = receiptView({ id, consumed: consumedFor(row.dataset.lane) });
      const cell = row.querySelector(".text") || row;
      let tick = row.querySelector(".tick");
      if (!v.ticks) { if (tick) tick.remove(); return; }
      if (!tick) {
        tick = document.createElement("span");
        tick.className = "tick";
        cell.appendChild(tick);
      }
      tick.textContent = v.ticks;
      tick.dataset.state = v.state;
      tick.setAttribute("aria-label", v.aria);
    });
  }

  // 🔴 **THE READ-BOUNDARY DIVIDER IS GONE**, and the per-turn tick replaced it outright.
  //
  // JJ, 2026-08-24: *"I think we should remove the red to here line as well. That's redundant
  // now."* He is right — the divider marked ONE position for ONE reader, which stopped being a
  // coherent thing to draw the moment three agents shared the log. A tick per turn says the same
  // thing per turn, and says it for whichever lane the turn belongs to.
  //
  // The name is kept because three call sites read better with it; all it does now is repaint.
  function placeDivider() {
    paintReceipts();
    scrollToEnd();
  }

  // --- the two toggles -------------------------------------------------------
  // Both persist in localStorage. Losing your mute on a reload means the room gets streamed
  // again without anyone deciding to; losing verbose means being asked to re-toggle a
  // preference, which is the friction it exists to remove.

  function tellServer(type, value) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type, value }));
  }
  diag.signal = tellServer;

  // Synthetic capture for a headless harness: `ms` of speech-shaped audio down the SAME socket
  // the microphone uses, so the server's ingest, segmenter and frame-recency guard all see
  // exactly what they would see from a real page. Speech-SHAPED, not a constant tone: the noise
  // floor is a rolling percentile, so a steady hiss raises the floor to its own level and is
  // then correctly classified as background — which is the design that beat a real air
  // conditioner, and which makes a naive fixture silently test nothing.
  diag.pushAudio = (ms) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return 0;
    // Announce the rate these frames are actually at. With no AudioContext the page announced
    // 48000 on load (`openSocket(ctx ? ctx.sampleRate : 48000)`), so without this the server
    // would resample synthetic 16 kHz audio as though it were 48 kHz — three times too fast,
    // and a fixture that is quietly the wrong length. `hello` is idempotent server-side.
    ws.send(JSON.stringify({ type: "hello", sample_rate: 16000 }));
    const n = Math.round((ms || 200) * 16000 / 1000);
    const f32 = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const env = Math.pow(Math.sin(2 * Math.PI * 4 * i / 16000), 4);   // ~4 syllables/s
      f32[i] = 0.3 * env * (Math.random() * 2 - 1);
    }
    ws.send(floatToPCM16(f32).buffer);
    diag.framesSent++;
    return n;
  };

  // Tell the server he is TALKING, from the microphone level, before any of that audio has
  // crossed the network. Live, 2026-08-06, immediately after being interrupted: "the client
  // needs to send a signal back to the server whenever it's detecting me speaking so that you
  // don't interrupt me... the responses get queued up until I shut up."
  //
  // The server already infers this from its own segmenter, and that inference is what allowed the
  // interruption: it is derived from audio that has already been buffered, sent and segmented, so
  // it trails the actual sound. This leads it.
  //
  // A HANGOVER rather than an instant drop, because speech is full of gaps — the pause between
  // words is silent, and a signal that tracks the waveform exactly would clear a dozen times per
  // sentence and invite a reply into each one. It only clears after a stretch of quiet long
  // enough to be a real ending. Deliberately shorter than END_OF_UTTERANCE_MS: this decides
  // whether to hold a clip, not whether he has finished a thought.
  const SPEAKING_RMS = 0.045;        // above the room, below a whisper
  const SPEAKING_HANGOVER_MS = 700;
  const SPEAKING_MIN_RUN_MS = 120;
  // A MINIMUM RUN before the signal asserts, borrowed from huggingface/speech-to-speech, whose
  // VAD refuses to hold fragments under 100 ms "so sub-threshold bursts cannot sum past
  // min_speech_ms and fire a false barge-in".
  //
  // Without it a cough, a keyboard knock or a door closing crosses the level for a single buffer
  // and holds the agent's reply for the whole 700 ms hangover. That is the same failure as being
  // interrupted, inverted: instead of the agent talking over him, the room silences the agent.
  // 120 ms is shorter than any syllable, so real speech never waits on it.
  function reportSpeaking(rms) {
    const now = performance.now();
    if (rms >= SPEAKING_RMS) {
      if (!speakingRunStart) speakingRunStart = now;
      speakingSince = now;
      if (!speakingSignal && now - speakingRunStart >= SPEAKING_MIN_RUN_MS) {
        speakingSignal = true;
        tellServer("speaking", true);
      }
      return;
    }
    // Below the level: a run that never reached the minimum was noise, so forget it rather
    // than let the next burst continue it and sum past the threshold.
    speakingRunStart = 0;
    if (speakingSignal && now - speakingSince > SPEAKING_HANGOVER_MS) {
      speakingSignal = false;
      tellServer("speaking", false);
    }
  }

  function setMuted(next) {
    muted = Boolean(next);
    // sessionStorage, NOT localStorage — mute is SESSION state, not a device preference.
    // Reported 2026-08-11. It survives a reload, which matters because he refreshes constantly
    // mid-conversation and re-muting every time would be its own annoyance; it does NOT survive
    // closing the tab. He shut the laptop on a Saturday and opened it Monday still muted, on a
    // page that otherwise looked live — deaf, with no event to explain why.
    //
    // The distinction that decides it: a PREFERENCE describes how you always want the tool
    // (verbose, speech rate, voice) and should outlive everything. STATE describes what is true
    // right now (muted, channel open) and outliving its moment is what makes it a trap.
    sessionStorage.setItem("command-bridge.muted", muted ? "1" : "0");
    // The server is told so `command-bridge status` can say "he has himself muted" — otherwise a silent
    // tunnel and a muted one look identical from the agent's side, and the agent goes hunting
    // for a broken microphone that is working perfectly.
    tellServer("muted", muted);
    $mute.setAttribute("aria-checked", String(muted));
    if (muted) { levelTarget = 0; tellServer("speaking", false); }
    applyOrb();
  }

  // The orb, as a PURE FUNCTION of the model. No DOM, no globals, no side effects — which is
  // the whole point: this is the part that kept breaking, and a function with inputs and a
  // return value is the part that can be unit-tested exhaustively. Exposed on `diag` so the
  // harness can drive the entire state matrix in milliseconds without a microphone.
  //
  // Precedence, outermost first, and each layer is answering a different question:
  //   not running  -> there is no session yet; nothing else is meaningful
  //   warming      -> the mic is open but no audio has arrived; claiming "Listening" here invites
  //                   him to talk into a gap, which is very likely why a first utterance garbles
  //   channel off  -> he shut the conversation; the agent's state is not his concern right now
  //   playing      -> the CLIENT knows when audio starts and stops; the server only knows when it
  //                   finished sending, and letting both write the label made them race
  //   otherwise    -> whatever the agent is doing, with MUTED replacing only the idle label
  //
  // Mute changes exactly one thing and never anything else. It is not a colour, not a glow, and
  // not a state of its own — the mute button carries that. Reported 2026-08-07.
  const ORB_LABELS = {
    idle: "Listening", transcribing: "Transcribing", thinking: "Thinking",
    synthesizing: "Synthesizing", waiting: "Waiting", speaking: "Speaking",
  };
  const TIMED_STATES = ["transcribing", "thinking", "synthesizing", "waiting"];

  function orbView(m) {
    // A REFUSED MICROPHONE SAYS SO ON THE ORB, not only on the error line. A tap that silently
    // returns the orb to "Tap to start" is indistinguishable from a tap that never registered,
    // and that ambiguity cost a live session on 2026-08-07 ("tap to start does not work"). The
    // orb is where he is already looking; the failure belongs there.
    if (m.phase === "denied") return { label: "No mic", timer: null };
    // OFF AND NEVER-STARTED LOOK THE SAME TO `running` AND ARE NOT THE SAME THING. Since
    // 2026-08-16 the orb releases the microphone when he switches it off, so `running` is false in
    // both cases; `everStarted` is the only fact that separates "he turned it off" from "this page
    // has never been live". Absent (an old harness sweeping the model) reads as never-started,
    // which is the previous behaviour exactly.
    if (!m.running) {
      const label = m.phase === "starting" ? "Starting" : m.everStarted ? "Off" : "Tap to start";
      return { label, timer: null };
    }
    if (m.phase === "warming") return { label: "Warming up", timer: null };
    if (!m.channelOpen) return { label: "Off", timer: null };
    if (m.playing) return { label: "Speaking", timer: null };
    const state = m.agentState || "idle";
    const label = state === "idle" ? (m.muted ? "Muted" : "Listening")
                                   : (ORB_LABELS[state] || "Listening");
    return { label, timer: TIMED_STATES.includes(state) ? state : null };
  }

  // ---------------------------------------------------------------- lanes (spec 012)
  //
  // Several agents, one microphone, one transcript. The same discipline as the orb, for the same
  // reason: a PURE reducer plus exactly one painter. The orb once read "Thinking" with no clock
  // because four handlers painted it independently and nothing in the suite could see that; a
  // strip with one row per agent has more ways to go quietly wrong, not fewer.
  let lanes = [];            // registered agent lanes, in registration order
  let liveLane = null;       // who he is talking to
  let laneWaiting = {};      // lane -> how many clips it is holding
  let laneStates = {};       // lane -> idle | transcribing | thinking | synthesizing | speaking
  let broadcastLane = "everyone";
  // The lane a turn with NO `lane` key belongs to — the name the server was started as. Thousands
  // of turns predate lanes, and rendering them as addressed to nobody would rewrite the history
  // he scrolls back through.
  let defaultLane = null;
  // Per lane, the highest turn id it had in hand when it last spoke — the blue tick (013 FR7).
  let laneReadThrough = {};
  // How far EACH lane has read — the receipt's cursor, per reader (spec 015 FR1).
  let laneConsumed = {};
  // Which lanes are sitting in a `watch` right now — the server's own answer, not a guess.
  let watchingLanes = [];

  const LANE_BUSY = ["transcribing", "thinking", "synthesizing", "speaking"];

  function lanesView(m) {
    const names = (m.lanes || []).slice();
    const broadcast = m.broadcast || "everyone";
    // BELOW TWO AGENTS THERE IS NO CHOICE TO OFFER. One agent plus "everyone" is the same
    // destination twice, so the row would be decoration occupying a line of a phone screen —
    // the exact rule the device pickers already follow, and the reason a single-agent session
    // looks precisely as it did before lanes existed.
    const shown = names.length >= 2;
    const rows = names.map((name) => {
      const state = m.states && m.states[name] ? m.states[name] : "idle";
      const waiting = (m.waiting && m.waiting[name]) || 0;
      const live = name === m.live;
      return {
        name,
        live,
        waiting,
        state,
        busy: LANE_BUSY.includes(state),
        // The label is built HERE, not in the painter, so a harness can assert what the row says
        // without a browser. Same argument as `orbView` returning its own label.
        label: name,
        // WHAT THIS AGENT IS DOING, IN WORDS (spec 013 FR5). The dot already carried `busy`, and
        // a dot that is either on or off cannot answer the question he actually asked:
        // *"I should know if an agent is listening or thinking or something else."* A binary
        // indicator collapses four distinct states into one, so the state has to be said.
        //
        // ⚠ **`waiting` outranks the state**, because a held clip is the one thing he can act on:
        // *"I need a way to know that an agent is trying to talk to me so that I can divert my
        // attention to that agent."* An agent that is thinking wants nothing from him; an agent
        // holding speech does.
        stateLabel: waiting ? "wants you" : (state && state !== "idle" ? state : ""),
        // What a screen reader is told, which has to carry everything the colour carries.
        aria: name + (live ? ", live" : "")
              + (waiting ? ", " + waiting + " waiting to be heard" : "")
              + (state && state !== "idle" ? ", " + state : ""),
      };
    });
    // The broadcast lane is a DESTINATION, never a participant: it has no state of its own and
    // can hold nothing, because anything said to everyone is said to the live lane too.
    rows.push({
      name: broadcast, live: m.live === broadcast, waiting: 0, state: "", busy: false,
      label: "everyone", broadcast: true,
      aria: "everyone" + (m.live === broadcast ? ", live" : ""),
    });
    return { shown, rows };
  }

  // ONE painter, and the ONLY thing allowed to touch the strip.
  function applyLanes() {
    const view = lanesView({ lanes, live: liveLane, waiting: laneWaiting, states: laneStates,
                             broadcast: broadcastLane });
    $lanes.hidden = !view.shown;
    diag.lanes = view;
    if (!view.shown) { $lanes.replaceChildren(); return; }
    $lanes.replaceChildren(...view.rows.map((row) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.lane = row.name;
      b.classList.toggle("live", row.live);
      b.classList.toggle("waiting", row.waiting > 0);
      b.setAttribute("aria-pressed", String(row.live));
      b.setAttribute("aria-label", row.aria);
      const dot = document.createElement("span");
      dot.className = "dot" + (row.busy ? " busy" : "");
      b.append(dot, document.createTextNode(row.label));
      if (row.stateLabel) {
        const st = document.createElement("span");
        st.className = "st";
        st.textContent = row.stateLabel;
        b.append(st);
      }
      if (row.waiting > 0) {
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = String(row.waiting);
        b.append(n);
      }
      return b;
    }));
  }

  // A TAP IS THE OTHER HALF OF THE SWITCH, never a replacement for it. He refused being REQUIRED
  // to tap, not the tap itself, so this exists for when his hands are free and the voice path
  // stays the one that works when they are not.
  $lanes.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-lane]");
    if (!btn) return;
    const name = btn.dataset.lane;
    if (name === liveLane) return;      // tapping where you already are is not a switch
    // Optimistic, then corrected by the server's own broadcast. The alternative — waiting for the
    // round trip to repaint — makes his own tap feel like it did not register, which is the
    // ambiguity the orb's "No mic" label exists to kill.
    liveLane = name;
    applyLanes(); applyLaneOrbs();
    fetch("/lane" + location.search, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "switch", name }),
    }).catch(() => {});
  });

  // ================= spec 014: ONE ORB PER AGENT ==================================
  //
  // JJ, 2026-08-24, after an hour with three agents: *"now that we have multiple lanes and I can
  // talk to multiple agents, I think having a single orb in the middle makes no sense… gives each
  // lane its own orb with the same functionality and same behaviors that the current middle orb
  // has."* Chosen against a clickable preview (`scripts/uipreview.py`, arrangement C) rather than
  // a description, and the reason it wins is not the pixels: with one centre orb, "which agent is
  // this" is a label on a shape that means something else. With one orb each it cannot be asked.

  // COLOUR IS IDENTITY, NEVER STATUS (FR5) — his ruling: *"we shouldn't make the colors represent
  // the statuses, because the statuses are represented within the orb."*
  //
  // Deterministic by POSITION so two devices watching one session agree without the server holding
  // a preference. ⚠ TC3: these differ in lightness as well as hue, so they survive the common
  // colour blindnesses and hold 4.5:1 on the page's light ground. TC4: the list repeats rather than
  // running out, and name plus position still separate lanes past its length.
  // 🔴 EVERY ORB COUNTS ITS OWN SECONDS. Reported live 2026-08-24, minutes after the row shipped:
  // *"I no longer see the seconds counter, the timer, whenever you're doing something. I think
  // that should display… whenever they're doing something."*
  //
  // The timer was a child of the single orb, so replacing that orb silently took it away — a
  // regression no harness caught, because `orbView` still returns its `timer` and the golden still
  // matches. **The model was intact and the thing that showed it was gone.**
  //
  // ⚠ **Per lane, not just the live one**, which is what he asked for and is also the only version
  // that means anything now: a background agent thinking for ninety seconds is exactly the thing
  // the number exists to make visible, and it is the one the old single orb could never show.
  // Timed client-side from the state change, because the server reports what a lane IS doing and
  // not when it started.
  const laneBusySince = {};
  const laneBusyState = {};
  const LANE_BUSY_STATES = ["transcribing", "thinking", "synthesizing", "speaking"];
  // 🔴 THE CLOCK RESTARTS ON EVERY STATE, not once per busy spell.
  //
  // JJ, 2026-08-25: *"sometimes the timers are not resetting because I was just seeing an agent
  // finishing the synthesizing of its turn and it started speaking, but the timer kept going."*
  //
  // It only started the clock `if (!laneBusySince[name])`, so a lane that went thinking →
  // synthesizing → speaking kept one running total across all three. That number answers "how
  // long has this agent been busy", which is not the question the digit sits next to: the word
  // above it names ONE stage, so the seconds beneath it have to be that stage's.
  function noteLaneBusy(name, state) {
    if (LANE_BUSY_STATES.includes(state)) {
      if (!laneBusySince[name] || laneBusyState[name] !== state) {
        laneBusySince[name] = Date.now();
        laneBusyState[name] = state;
      }
    } else {
      delete laneBusySince[name];
      delete laneBusyState[name];
    }
  }
  // 🔴 THE DECIMAL IS BACK. *"the seconds counter inside of the orbs — you have removed the
  // decimals. I think we should re-add the decimals."* (2026-08-25)
  //
  // ⚠ **One decimal, not two or three**, and the reason is the repaint rather than the arithmetic:
  // a digit that never changes is worse than no digit, so every place shown has to be redrawn at
  // its own rate. One decimal means ten repaints a second, which is the same budget the orb's
  // level ring already spends. Two would mean a hundred and three a thousand, for digits nobody
  // can read as they pass.
  //
  // Past a minute the tenths are dropped: at that scale the number is answering "is this stuck",
  // not "how fast was that", and `1m07` reads faster than `1m07.4`.
  function laneElapsed(name) {
    const since = laneBusySince[name];
    if (!since) return "";
    const ms = Date.now() - since;
    if (ms < 100) return "";
    const s = ms / 1000;
    if (s < 60) return s.toFixed(1) + "s";
    const whole = Math.floor(s);
    return Math.floor(whole / 60) + "m" + String(whole % 60).padStart(2, "0");
  }

  const LANE_HUES = ["#3559bd", "#0f7a63", "#8a3fa8", "#a8501f", "#1f6f8a", "#7a2f4f"];
  function laneHue(names, name) {
    const i = (names || []).indexOf(name);
    return i < 0 ? "var(--faint)" : LANE_HUES[i % LANE_HUES.length];
  }

  // The pure half, swept by scripts/lanestrip.py without a browser — same discipline as `orbView`
  // and `lanesView`, and the reason a literal tag went unnoticed the one time it was skipped.
  function laneOrbsView(m) {
    const names = (m.lanes || []).slice();
    // BELOW TWO AGENTS THE PAGE IS UNCHANGED (NFR1). One orb in a row of one is the orb this page
    // has always had, and rebuilding it as a lane would cost the solo session its whole look for
    // no information gained — the same rule the lane strip and the device pickers already follow.
    const shown = names.length >= 2;
    return {
      shown,
      rows: names.map((name) => {
        // 🔴 "IDLE" WAS A LIE FOR EVERY AGENT THAT WAS ACTUALLY WORKING. JJ, 2026-08-24:
        // *"the agents say idle, but in reality, you are not idle, right? Whenever you're not
        // listening and whenever you're doing something, you're thinking."*
        //
        // The cause: `lane_states` only ever holds what an agent REPORTED. The tunnel's own stages
        // fire for the live lane; a background agent heads-down in a long task reports nothing, so
        // it read exactly like one sitting doing nothing.
        //
        // 🔴 **AND THE FIRST FIX STILL OVERCLAIMED, IN THE OTHER DIRECTION.** It separated
        // "working" from "idle" by whether the lane had ever read anything — which is history, not
        // state, and it left "idle" meaning an agent we simply could not see.
        //
        // JJ, 2026-08-25, correcting it: *"an agent that is not listening is an agent that is
        // thinking, right? We don't have a way to determine if an agent is idle or not, so we
        // shouldn't claim it. The only reason we show idle is if an agent is listening... but it's
        // not the agent I am focused on. That means that it's waiting for me. That means that it's
        // idle."*
        //
        // 🎯 **His rule needs no history at all — two facts the server already publishes:**
        //
        //     in a watch  AND live      -> listening   (it is hearing him right now)
        //     in a watch  AND not live  -> idle        (it is waiting for him, which IS idle)
        //     not in a watch            -> thinking    (it is doing something; we cannot see what)
        //
        // **"Idle" is now the ONE state we can actually observe** — a lane parked in a wait that he
        // is not talking to — rather than the label for everything unknown. And an agent that has
        // gone quiet without a watch is called thinking, because from out here that is the only
        // honest reading: it is between calls, and being between calls is work.
        let state = (m.states && m.states[name]) || "";
        if (!state || state === "idle") {
          const watching = (m.watching || []).includes(name);
          state = watching ? (name === m.live ? "listening" : "idle") : "thinking";
        }
        const live = name === m.live;
        // 🔴 THE HAND MEANS "STILL UNHEARD", ON EVERY LANE (spec 029 FR2).
        //
        // ⚠ **This USED to force zero on the live lane, and that was his rule too:** *"the hand
        // with the turns should only show whenever the lane is not focused."* (2026-08-25) He
        // asked for the opposite on 2026-08-27 — *"The hand number should decrease gradually as
        // the [queued] turns get played"* — and the two are reconcilable rather than contradictory.
        //
        // The old rule objects to a hand that ASKS FOR ATTENTION HE IS ALREADY GIVING. The new one
        // wants a COUNTDOWN OF WHAT IS STILL TO PLAY. Counting only the unheard satisfies both: on
        // a lane he is not on it is the held backlog, and on the lane he is on it is the queue
        // draining to zero by itself. The number never asks for anything — it reports.
        const waiting = (m.waiting && m.waiting[name]) || 0;
        return {
          name, live, waiting, state,
          hue: laneHue(names, name),
          // The status word lives INSIDE the orb (FR6), and it is always the LANE's own state.
          //
          // ⚠ It used to read "off" on every orb while the session was down, which was wrong on
          // two counts: the session being off is already said by the power button and by the whole
          // row going grey, so repeating it N times adds nothing — and it DESTROYED the per-lane
          // information at exactly the moment it is most useful. An agent that has been thinking
          // for two minutes while he had the orb closed is the thing he most wants to see on
          // coming back, and the old rule painted it as "off".
          status: state,
          aria: name + (live ? ", live" : "")
                + (waiting ? ", " + waiting + " waiting to be heard" : "")
                + (state && state !== "idle" ? ", " + state : ""),
        };
      }),
    };
  }

  // HOW MANY REPLIES EACH LANE STILL HAS UNHEARD — a pure function, and that is the point.
  //
  // THE SERVER'S BACKLOG PLUS THIS PAGE'S. The two never overlap: the server broadcasts
  // `waiting: 0` for a lane at the instant it hands the whole queue over, and from then on the
  // remainder is local. Summing them is what makes the hand count DOWN as each clip plays instead
  // of vanishing on the first one.
  //
  // 🔴 **EXTRACTED FROM THE PAINTER BECAUSE IT COULD NOT BE TESTED THERE (spec 029).** The tally
  // lived inside `applyLaneOrbs`, so the only way to exercise it was to make the page actually
  // play audio — which a headless run cannot do, because `drainClips` returns early with no
  // AudioContext and never repaints. **Two mutation checks passed against the live bug for that
  // reason**: nothing rendered a hand either way, so the assertion was measuring silence.
  //
  // ⚠ Cues are excluded on both halves (FR1). A cue header carries no `lane` — it is the one kind
  // of audio outside the lane system — so the `|| defaultLane` fallback banked every
  // acknowledgement sound against the default lane and flashed a hand there. JJ, 2026-08-27:
  // *"I saw a hand quickly appear and disappear on the Magnus lane."*
  // WHICH LANE A CLIP BELONGS TO, or null when the answer is nobody (spec 029 FR1/TC1).
  //
  // A cue is the one kind of audio outside the lane system, so it has no owner to be waiting for.
  // Tested by its own `cue` field rather than by the ABSENCE of a lane, because a genuinely
  // lane-less REPLY should still fall back to the default — that fallback is what spec 013 left
  // in place for clips that predate lanes, and it is correct for replies and wrong for cues.
  //
  // Pure and exposed for the same reason as `waitingCounts`: the caller lives in `drainClips`,
  // which a headless harness cannot reach without an AudioContext.
  function clipOwner(header, defaultLane) {
    if (!header || header.cue) return null;
    return header.lane || defaultLane;
  }

  function waitingCounts({ lanes, laneWaiting, clipQueue, playingLane, defaultLane }) {
    const out = {};
    (lanes || []).forEach((n) => {
      const local = (clipQueue || []).filter(
        (c) => c && c.header && !c.header.cue
               && (c.header.lane || defaultLane) === n).length
        + (playingLane === n ? 1 : 0);
      const total = ((laneWaiting || {})[n] || 0) + local;
      if (total) out[n] = total;
    });
    return out;
  }

  // ONE painter, and the ONLY thing allowed to touch the orb row.
  function applyLaneOrbs() {
    // Stamp the busy clocks BEFORE building the view, so a state that just changed is timed from
    // the moment it changed rather than from the next repaint.
    lanes.forEach((n) => noteLaneBusy(n, laneStates[n] || "idle"));
    const waiting = waitingCounts({ lanes, laneWaiting, clipQueue, playingLane, defaultLane });
    const view = laneOrbsView({
      lanes, live: liveLane, waiting, states: laneStates,
      // The two facts that separate "listening" from "working" from "never started".
      watching: watchingLanes, consumed: laneConsumed,
      sessionOff: !(running && channelOpen),
    });
    view.sessionOff = !(running && channelOpen);
    diag.laneOrbs = view;
    if ($orbs) {
      $orbs.hidden = !view.shown;
      // HOW MANY ORBS SHARE THE ROW — the CSS sizes each disc off its actual share of the width,
      // so two lanes get a bigger orb than three. Published rather than inferred, the same rule
      // the rest of this file follows: a stylesheet cannot count its own elements.
      $orbs.style.setProperty("--n", String(view.rows.length || 1));
      // The step-back above only makes sense when there is something to step back FROM. Said once
      // on the row rather than by each orb deciding, the same rule `data-off` already follows.
      $orbs.dataset.multi = String(view.rows.length > 1);
      $orbs.replaceChildren(...(view.shown ? view.rows.map((row) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "laneorb" + (row.live ? " live" : "") + (row.waiting ? " waiting" : "");
        b.dataset.lane = row.name;
        b.style.setProperty("--lane-c", row.hue);
        b.setAttribute("aria-pressed", String(row.live));
        b.setAttribute("aria-label", row.aria);

        const disc = document.createElement("span");
        disc.className = "disc";
        if (row.waiting) {
          // A RAISED HAND WITH A COUNT (FR7), replacing the words "wants you". His words:
          // "instead of codex wants you, I would like to have a count or a raised hand, with the
          // count of messages that are waiting for me." The count is what the label never carried.
          const hand = document.createElement("span");
          hand.className = "hand";
          hand.textContent = "✋" + row.waiting;
          disc.append(hand);
        }
        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = row.name;
        // NAME then STATUS+SECONDS, both BELOW the disc (JJ, 2026-09-02, matching the wireframe:
        // "the name of the agent is always sitting below it, and the status with the seconds also
        // sit below the name, not inside it"). The disc is now the pure colour orb.
        const st = document.createElement("span");
        st.className = "stat";
        st.textContent = row.status;
        // The seconds, appended to the status line. ⚠ ALWAYS APPENDED, even when empty, so the
        // tick can write into it without rebuilding the row (the rebuild is what broke tapping).
        const t = document.createElement("span");
        t.className = "lanetimer";
        t.textContent = laneElapsed(row.name);
        st.append(t);
        b.append(disc, nm, st);
        return b;
      }) : []));
    }
    // The single orb and the row are alternatives, never both: one of them is always the whole
    // answer to "who am I talking to".
    if ($orbwrap) $orbwrap.hidden = view.shown;
    // The chip strip said exactly what the orbs now say, in less space and with less meaning.
    // Two controls for one fact is how a page starts disagreeing with itself.
    if ($lanes) $lanes.hidden = view.shown || lanes.length < 2;
    // BORDER THE SHARED CANVAS IN THE LIVE AGENT'S COLOUR (JJ, 2026-09-02) — the #sharecanvas rule
    // reads --canvas-c, so a glance says whose screen is on the canvas.
    document.documentElement.style.setProperty("--canvas-c", laneHue(lanes, liveLane) || "transparent");
  }

  // A TAP SWITCHES THE LANE AND NOTHING ELSE (FR9). The session moved to the power button, so an
  // orb no longer has a second meaning to be ambiguous about.
  function tapLaneOrb(ev) {
    const btn = ev.target.closest("button[data-lane]");
    if (!btn) return;
    const name = btn.dataset.lane;
    if (name === liveLane) return;
    liveLane = name;
    applyLaneOrbs();
    applyLanes();
    fetch("/lane" + location.search, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "switch", name }),
    }).catch(() => {});
  }

  // ONE painter, and it is the ONLY thing allowed to touch the orb. Every handler updates the
  // model and calls this; none of them writes a label or a class directly.
  function applyOrb() {
    const view = orbView({ running, phase, channelOpen, muted, playing, agentState, everStarted });
    $orblabel.textContent = view.label;
    // The dimmed "closed" look now has to survive capture being released, or switching the orb off
    // would return it to the bright never-started styling — the visual saying "start me" over a
    // conversation he deliberately ended.
    $orb.classList.toggle("closed", !channelOpen && (running || everStarted));
    $orb.classList.toggle("thinking", Boolean(view.timer));
    $orb.classList.toggle("speaking", view.label === "Speaking");
    setBusyTimer(view.timer);
    // The power button reflects the SESSION, which is the one thing it owns (spec 014 FR2). It is
    // painted from the same view as the orb so the two can never disagree about whether the
    // conversation is live — a second source of truth for one boolean is how the picker came to
    // read "Bluetooth" while the earpiece was playing.
    if ($power) {
      const on = Boolean(running && channelOpen);
      $power.setAttribute("aria-pressed", String(on));
      $power.setAttribute("aria-label", on ? "Stop the conversation" : "Start the conversation");
      // The orb row states the SESSION once, rather than each orb inventing a state for it.
      if ($orbs) $orbs.dataset.off = String(!on);
      // And the WHOLE ROOM dims when the channel is off, so "off" is unmistakable at a glance and the
      // power button is the one lit thing to turn it back on (JJ, 2026-09-02: "the style of the whole
      // UI to be more obvious when the power button is off").
      document.documentElement.dataset.off = String(!on);
    }
    // The lane orbs' status word reads "off" while the session is down, so they repaint with the
    // orb and not only when the lane set changes — otherwise the row would keep claiming
    // "listening" over a released microphone.
    applyLaneOrbs();
    diag.orb = view;
  }

  // How long the orb has been in ITS CURRENT STATE, reddening as it climbs.
  //
  // ONE CLOCK PER STAGE, restarting at every transition. This shipped as a single clock across
  // the whole chain and the owner corrected it the moment he saw it: "I meant counts per stage. Each
  // state gets its own count." He is right and the reason is what the number is FOR — a total
  // says the wait was long, which he already knows from waiting; a per-stage count says WHICH
  // stage was long, which is the only version that tells him anything he can act on.
  //
  // Speaking is deliberately excluded ("maybe we shouldn't put the count on speaking"): the
  // audio itself already tells him how long it is taking, and a clock on it would measure his
  // own patience rather than the machine's.
  const TIMER_FULL_RED_S = 60;     // measured: the agent stage runs 15-30 s and has reached 60
  let busySince = 0;
  let busyState = "";
  let busyFrame = 0;

  function paintBusyTimer() {
    const s = (performance.now() - busySince) / 1000;
    // THREE DECIMALS, and they are not decoration. Reported 2026-08-07: "we should add decimal points
    // to that second counter because it looks a bit dull." A whole-second counter is motionless
    // for a full second at a time, which reads as FROZEN — the exact thing he is watching the
    // orb to rule out. Moving milliseconds say "still running" without him having to wonder.
    $orbtimer.textContent = s.toFixed(3) + " sec";
    // Interpolate cool -> red. Saturation and lightness climb with hue so late seconds read as
    // urgent on a phone in daylight, where hue alone is the first thing the screen loses.
    const k = Math.min(1, s / TIMER_FULL_RED_S);
    $orbtimer.style.setProperty(
      "--orb-timer",
      `hsl(${Math.round(210 - 210 * k)} ${Math.round(45 + 55 * k)}% ${Math.round(72 - 10 * k)}%)`,
    );
    busyFrame = requestAnimationFrame(paintBusyTimer);
  }

  // Driven by requestAnimationFrame rather than an interval: milliseconds have to be repainted
  // every frame to move smoothly, and rAF is the one timer the browser aligns to the display and
  // suspends when the tab is hidden — where the page cannot record anyway.
  // Pass the state name to time it; pass null to stop. Passing the SAME name again is a no-op,
  // so a repeated frame for one stage does not restart its clock.
  function setBusyTimer(state) {
    if (state && running) {
      if (busyState === state) return;
      if (busyFrame) cancelAnimationFrame(busyFrame);
      busyState = state;
      busySince = performance.now();
      $orbtimer.hidden = false;
      paintBusyTimer();
      return;
    }
    if (busyFrame) cancelAnimationFrame(busyFrame);
    busyFrame = 0;
    busySince = 0;
    busyState = "";
    $orbtimer.hidden = true;
    $orbtimer.textContent = "";
  }

  // Paint only. Used when the SERVER tells us the value — either on the ready frame or after
  // someone (a laptop, or the agent itself via `command-bridge verbose on`) changed it elsewhere. Echoing it
  // back would be a loop, so this deliberately does not call tellServer.
  function paintVerbose(next) {
    verbose = Boolean(next);
    $verbose.setAttribute("aria-checked", String(verbose));
  }

  function setVerbose(next) {
    paintVerbose(next);
    tellServer("verbose", verbose);
  }

  // They are real <button>s now, so Space and Enter already fire click. The hand-wired keydown
  // handlers that a div with role=switch needed would double-toggle here — press, and the
  // control would flip and flip back.
  // What to do about a clip whose `onended` has not fired, as a PURE function of the context's
  // state and how many guard ticks it has been stalled. Kept out of the timer so it can be swept.
  //
  //   running/closed -> the source is either advancing or gone; nothing to decide
  //   suspended      -> the CLOCK is stopped, so the source will never end on its own: wake it,
  //                     and stop waiting if it will not wake
  //
  // 🔴 `suspended` is the case that was missing. It is not `closed` — the context is alive and
  // accepts `createBufferSource()` and `start()` — so the old predicate saw a healthy context and
  // waited forever on an event that could not arrive, wedging every clip behind it.
  function clipStallAction(state, ticks, limit) {
    if (!state || state === "closed") return "finish";
    if (state !== "suspended") return "wait";
    return ticks >= (limit || 15) ? "finish" : "resume";
  }
  diag.clipStallAction = clipStallAction;
  // 🔴 THE CLOCK IS THE FLOOR UNDER `onended`, added 2026-08-31. The "speaking" label — and the
  // hand chained to it, because the hand counts unheard clips and decrements on the same `played`
  // receipt — hung ~20 s after a clip had finished. The label clears on that receipt, the receipt
  // waits on `src.onended`, and `onended` fires late whenever the context suspends around the
  // clip's end (his laptop, same suspend that stalled Atlas for 43 s on 2026-08-26; NOT a phone).
  // `AudioContext.currentTime` advances ONLY while the context runs, so once it has passed the
  // clip's scheduled end the audio has genuinely played through: this cannot fire early during a
  // real suspend (the clock is frozen then, still short of the end) and it fires at once when a
  // late `onended` is the only thing still missing — including the exact reported case, a clip that
  // finished and THEN the context suspended. `onended` stays the fast path; this is the floor under
  // it. Pure and finite-guarded so `scripts/clipstall.py` sweeps it with no AudioContext, and so a
  // null clock (`ctx` nulled mid-drain) or an unknown duration defers to the stall guard rather
  // than finishing a clip early.
  function clipElapsed(now, end) {
    return Number.isFinite(now) && Number.isFinite(end) && now >= end;
  }
  diag.clipElapsed = clipElapsed;
  diag.orbView = orbView;
  diag.lanesView = lanesView;
  diag.tagView = tagView;
  diag.receiptView = receiptView;
  diag.laneOrbsView = laneOrbsView;
  // The unheard tally, exposed for the same reason as every other reducer here: it decides what
  // the hand says, and it must be checkable without an AudioContext (spec 029).
  diag.waitingCounts = waitingCounts;
  diag.clipOwner = clipOwner;
  diag.laneHue = laneHue;
  diag.deliver = (msg) => onMessage({ data: JSON.stringify(msg) });
  // THE BYTES THAT MUST FOLLOW A HEADER, through the SAME handler (spec 029).
  //
  // 🔴 Without this a harness can only deliver the header, and `onMessage` merely parks it in
  // `pendingClip` — no clip is ever enqueued, so any assertion about the queue is vacuous. The
  // first version of the cue test passed for exactly that reason and **the mutation check caught
  // it**: reinstating the bug it was written for left it green.
  //
  // Same reasoning as `pushAudio` above — a harness that sends one half of a two-part exchange is
  // asserting a state that cannot occur in production.
  diag.deliverBytes = (n) => onMessage({ data: new ArrayBuffer(Number(n) || 2) });
  // An agent's transcript row WITHOUT synthesizing audio, for the screenshot harness.
  //
  // A reply only reaches the log when a clip actually plays, so a harness with no audio can never
  // see one — which is how spec 013 shipped an agent-name fix nobody had looked at. This takes the
  // same two steps the play path takes (`tagView`, then `addRow`) and skips only the sound, so
  // what it renders is what he sees. ⚠ It deliberately does NOT stub the queue: a harness that
  // fakes the delivery path would stop being evidence about the delivery path.
  diag.renderAgentRow = (lane, text) =>
    addRow(tagView({ from: "agent", lane, lanes, fallback: defaultLane }), text, "claude",
           undefined, lane || defaultLane);

  // Collapse the transcript. Reported 2026-08-07: "I want to make that collapsible so that I can just
  // collapse it and hide it and just have the orb and the buttons and not see the transcript
  // text."
  //
  // `hidden` rather than a height animation, and the reason is the grid: an empty-but-present
  // 1fr row still eats its space, which is the same trap `#log:empty` already documents. The
  // body rule keys off `#log[hidden]` so collapsing genuinely gives the room back to the orb
  // instead of leaving a hole where the transcript was.
  //
  // Persisted, because it is a mode you choose for a situation — driving, or somebody else in
  // the room — and having to re-choose it on every reconnect would make it useless for exactly
  // those situations.
  function setCollapsed(next) {
    const on = Boolean(next);
    $log.hidden = on;
    // aria-EXPANDED, not aria-checked: this is a disclosure control for the region named by
    // aria-controls, not a two-state setting. A screen reader announces "collapsed/expanded"
    // instead of "not pressed", which is the difference between describing the transcript and
    // describing a switch.
    $collapse.setAttribute("aria-expanded", String(!on));
    localStorage.setItem("command-bridge.collapsed", on ? "1" : "0");
    diag.collapsed = on;
    // Rows added while collapsed have no measurable geometry, so the log would reopen scrolled
    // to wherever it was when it closed. Snap it back to the newest line on the way out.
    if (!on) scrollToEnd();
  }

  $collapse.addEventListener("click", () => setCollapsed(!$log.hidden));
  setCollapsed(localStorage.getItem("command-bridge.collapsed") === "1");

  $mute.addEventListener("click", () => setMuted(!muted));
  $verbose.addEventListener("click", () => setVerbose(!verbose));

  // Restores within this browser SESSION only. Verbose does not restore at all — it arrives
  // from the server on connect, because it is one preference he holds rather than one per
  // browser, and reading it from storage is what used to let a stale phone value overwrite what
  // he had just set on the laptop.
  //
  // Any value left in localStorage by an older build is cleared, not read: it is precisely the
  // stale mute this change exists to stop honouring.
  localStorage.removeItem("command-bridge.muted");
  setMuted(sessionStorage.getItem("command-bridge.muted") === "1");

  // Live level -> CSS variable, smoothed and painted once per frame rather than per audio
  // callback. Writing a style on every 4096-sample block (~12/s) is wasteful and jittery;
  // rAF gives smooth motion decoupled from the audio rate.
  let level = 0, levelTarget = 0;
  (function paint() {
    // Fast attack, slow release — matches how a level meter should feel: it jumps to your
    // voice instantly but decays gently instead of strobing on every syllable gap.
    level += (levelTarget - level) * (levelTarget > level ? 0.5 : 0.08);
    diag.liveLevel = level;
    document.documentElement.style.setProperty("--level", level.toFixed(3));
    requestAnimationFrame(paint);
  })();

  // --- Screen Wake Lock -----------------------------------------------------
  // Replaces installing a Caffeine-type app: the page keeps the screen alive itself.
  // The lock is auto-released whenever the document goes inactive, so it MUST be
  // re-acquired on visibilitychange or the screen sleeps on the first glance away.
  async function acquireWakeLock() {
    if (!("wakeLock" in navigator)) return;
    try { wakeLock = await navigator.wakeLock.request("screen"); }
    catch (e) { diag.errors.push("wakeLock: " + e.message); }
  }
  document.addEventListener("visibilitychange", async () => {
    if (!running || document.visibilityState !== "visible") return;
    if (wakeLock !== null) await acquireWakeLock();
    // Coming back to the foreground is the ONE moment a reconnect is certain to be able to
    // succeed, so retry immediately here rather than waiting out whatever backoff had accrued
    // while the tab was suspended and every attempt was doomed.
    if (!ws || ws.readyState !== WebSocket.OPEN) { reconnectDelay = 0; scheduleReconnect(true); }
  });

  // --- capture --------------------------------------------------------------
  function floatToPCM16(f32) {
    const out = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  // The orb is the ONLY microphone control. First tap grants and starts; every tap after that
  // mutes or unmutes, and never tears the session down.
  //
  // Live, 2026-08-01: "it doesn't make sense that it's a separate button from the middle orb.
  // Because when I tap the middle orb to start, that's what makes you listen to me. Maybe I can
  // tap it again to mute and unmute... as soon as the page is loaded, that is connected. What the
  // orb does is just helps us have this conversation."
  //
  // He is right, and the socket now opens on load to match. The ONE thing that cannot follow his
  // model is the first tap: `getUserMedia` requires a user gesture on mobile, so a page cannot
  // hold a microphone it was never handed. That tap is a browser rule, not a design choice.
  // THE ORB IS THE CHANNEL, not the microphone. Tapping it opens or closes the conversation in
  // BOTH directions: closed means nothing is heard and nothing plays, and replies queue on the
  // server until it reopens. Live, 2026-08-06: "the orb should control whether or not this
  // interaction is live... if I turn off the orb, that means that you cannot talk to me either.
  // And your responses get queued up server side until I turn the orb back on."
  //
  // It used to double as the mute, which conflated two different intentions — "stop hearing me"
  // and "stop talking to me" — and left no way to express only one of them. Mute is now its own
  // switch beside verbose.
  //
  // The first tap still has to start capture, because `getUserMedia` requires a user gesture on
  // mobile: a page cannot hold a microphone it was never handed. After that the stream stays and
  // the orb is purely the channel.
  async function orbTapped() {
    if (running) { await closeChannel(); return; }
    // A retry clears the previous refusal, so a second tap after granting permission in the
    // browser's own UI actually starts rather than sitting on the stale failure.
    if (phase === "denied") { phase = "idle"; setError(""); applyOrb(); }
    await start();
  }

  // OFF NOW MEANS THE MICROPHONE IS ACTUALLY RELEASED.
  //
  // Reported live 2026-08-16: "whenever I tap the orb and I turn it off, I would like you to stop
  // recording on the microphone, because that does not allow me to watch other media on the phone,
  // or use the Bluetooth or whatever, right — because you're hugging the microphone but the orb is
  // off, so there's no point in that."
  //
  // The orb used to stop LISTENING without stopping CAPTURING, which are different states and only
  // one of them was visible to him. The `MediaStream` stayed open, so the OS microphone indicator
  // stayed lit and the phone stayed in capture — confirmed on the server the same day, which
  // reported `channel_open: false, muted: true, capturing: true` after he switched it off.
  //
  // WHAT MAKES THIS DIFFERENT FROM WHAT HE ALREADY HAD: closing the tab releases the microphone
  // too, and he found that himself and rejected it. "What I did is I closed the tab, but I would
  // like to keep the tab open so that I can just come back and hit the orb again without having to
  // reopen the link, scroll up and go find the link." The tunnel is fronted by a URL that changes
  // on every restart, so reopening costs him a scroll through chat history for a link that may no
  // longer be valid. Hence `keepSocket`: the tracks end, the socket, the page and the transcript
  // all stay. Anything the agent says while he is off still arrives — the server queues it against
  // the closed channel and releases it when he taps back on.
  //
  // The permission grant belongs to the ORIGIN, not to the stream, so re-acquiring should not
  // re-prompt. That is the one claim here that no harness in this repo can settle: Chrome's
  // fake-media flag auto-grants silently, so a green re-acquire proves the path works and proves
  // nothing about whether a prompt would have appeared. It wants one tap on a real phone.
  async function closeChannel() {
    // Off has to mean off NOW, not after this sentence. Reported 2026-08-07: "I hit the orb to turn
    // off because I was not hearing you... However, you spoke anyway." `stop()` deliberately KEEPS
    // the clip queue, because its other caller is a device change where those replies are still
    // wanted; this caller is the opposite intention, so the queue is dropped here first.
    levelTarget = 0;
    silencePlayback();
    await stop({ keepSocket: true });
  }

  // Closing the channel stops the agent MID-SENTENCE, and drops whatever else was queued.
  //
  // The server already refuses to send new replies while the channel is shut, which looked like
  // enough and was not: a clip already delivered kept playing to the end and the local queue
  // kept its backlog. Reported 2026-08-07: "I hit the orb to turn off because I was not hearing you.
  // I was talking to somebody else and I didn't want you to speak. However, you spoke anyway."
  //
  // A switch whose effect waits for the current sentence to finish is not an off switch. He
  // reaches for it precisely when the next few seconds of speech are the problem — so the
  // unplayed audio is discarded rather than re-queued, because he shut the channel to not hear
  // it, and handing it back on reconnect would only replay the thing he interrupted.
  function silencePlayback() {
    try { if (playingSource) playingSource.stop(); } catch {}
    playingSource = null;
    clipQueue.length = 0;
  }

  async function start() {
    if (running) return;
    phase = "starting";
    applyOrb();
    try {
      // Chrome's WebRTC audio processing is tuned for TELEPHONY — making speech intelligible
      // to a human ear over a bad line — not for a speech recognizer. Noise suppression gates
      // and spectrally subtracts, and AGC ramps its gain over the first second or two, which
      // is very likely why the FIRST utterance of a session transcribes worst and later ones
      // are fine. Dictation tools that outperform us here (Handy) read the raw device.
      //
      // So: NS and AGC off by default. Echo cancellation stays ON — the reply plays out of
      // the speakers into this same microphone, and without EC the agent transcribes itself.
      // Override per-session with ?ns=1&agc=1&ec=0 to A/B it.
      const q = new URLSearchParams(location.search);
      const flag = (name, dflt) => q.has(name) ? q.get(name) === "1" : dflt;
      const constraints = {
        channelCount: 1,
        echoCancellation: flag("ec", true),
        noiseSuppression: flag("ns", false),
        autoGainControl:  flag("agc", false),
      };
      // ?device=<substring> picks a specific microphone by label instead of the system default.
      // Needed so an automated harness can point the page at a virtual audio cable without
      // changing the machine's default recording device, and useful on its own when the
      // default is the wrong mic. Labels are only populated once permission is granted, so
      // this takes two getUserMedia calls on the first run.
      const remembered = localStorage.getItem("command-bridge.micId");
      if (remembered && !q.get("device")) {
        constraints.deviceId = { exact: remembered };
      }
      const want = q.get("device");
      if (want) {
        try {
          const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
          probe.getTracks().forEach((t) => t.stop());
          const devices = await navigator.mediaDevices.enumerateDevices();
          const match = devices.find(
            (d) => d.kind === "audioinput" &&
                   d.label.toLowerCase().includes(want.toLowerCase())
          );
          if (match) constraints.deviceId = { exact: match.deviceId };
          else diag.errors.push("no audio input matching " + want);
        } catch (e) {
          diag.errors.push("device select: " + e.message);
        }
      }

      diag.constraints = constraints;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: constraints });
      } catch (err) {
        // A remembered microphone can be unplugged between sessions. Falling back to the
        // default beats refusing to start and looking broken.
        if (constraints.deviceId) {
          diag.errors.push("preferred mic unavailable, using default");
          delete constraints.deviceId;
          localStorage.removeItem("command-bridge.micId");
          micStream = await navigator.mediaDevices.getUserMedia({ audio: constraints });
        } else { throw err; }
      }
      diag.settings = micStream.getAudioTracks()[0].getSettings();
      diag.deviceLabel = micStream.getAudioTracks()[0].label;
      // The microphone has been granted at least once on this page. Never cleared — it is what
      // lets the orb say "Off" rather than "Tap to start" after `closeChannel` ends the tracks.
      everStarted = true;
      // Permission has landed, so device labels are populated for the first time. There is no
      // AudioContext yet, so this builds the lists and nothing more; the route is applied by the
      // second call below, once there is something to route.
      await refreshDevices("permission");
    } catch (e) {
      // On a LAN IP navigator.mediaDevices is undefined and this is a TypeError. That is not
      // a bug to fix here — it is the secure-context rule. See ai-docs/reference/browser.md.
      const msg = (navigator.mediaDevices ? e.message : "insecure origin — needs HTTPS or localhost");
      diag.errors.push("getUserMedia: " + msg);
      phase = "denied";
      applyOrb();
      setError("microphone unavailable: " + msg);
      return;
    }

    // Created inside the click handler so the autoplay policy unlocks playback too.
    ctx = new AC();
    if (ctx.state === "suspended") await ctx.resume();
    // A NEW CONTEXT OPENS ON THE BROWSER'S DEFAULT OUTPUT, whatever he chose last time. Put it
    // back before anything can play through it — a reply that arrives during setup would
    // otherwise come out of the wrong speaker and be gone before the route caught up.
    await refreshDevices("start");

    // The page already connected on load, so re-announce the REAL sample rate rather than
    // opening a second socket. `hello` is idempotent server-side — it just updates the rate the
    // resampler uses — and a stale 48000 here would silently resample every frame wrongly.
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "hello", sample_rate: ctx.sampleRate }));
    } else {
      await openSocket(ctx.sampleRate);
    }

    source = ctx.createMediaStreamSource(micStream);
    // ScriptProcessorNode is deprecated but universally present, including headless Chrome.
    // For one local user at 4096 frames the main-thread cost is irrelevant, and it removes a
    // whole class of AudioWorklet module-loading failure from the critical path.
    // AudioWorklet, NOT ScriptProcessorNode.
    //
    // ScriptProcessorNode runs its callback on the MAIN THREAD, and Chrome throttles main-thread
    // timers in a backgrounded tab. Measured 2026-07-29: switching to another window produced
    // 14 seconds of EXACT digital zero in the server's capture — not a quiet room, no audio at
    // all — and every word spoken in that window was lost. Since the whole point is to talk
    // while doing something else, that is fatal.
    //
    // AudioWorklet runs on the audio rendering thread and keeps delivering while the tab is
    // backgrounded. ScriptProcessor remains as a fallback for browsers without it.
    // The worklet is handed a 128-sample block per render quantum — ~375 per second at 48 kHz.
    // Posting each one individually would mean 375 WebSocket messages a second, nearly all
    // header overhead. Batch into ~40 ms chunks first: same audio, ~15 messages/sec.
    const batchSize = Math.round(ctx.sampleRate * 0.04);
    const workletSrc = `
      class Cap extends AudioWorkletProcessor {
        constructor(o) {
          super();
          this.size = (o.processorOptions && o.processorOptions.batchSize) || 1920;
          this.buf = new Float32Array(this.size);
          this.n = 0;
        }
        process(inputs) {
          const ch = inputs[0] && inputs[0][0];
          if (ch && ch.length) {
            for (let i = 0; i < ch.length; i++) {
              this.buf[this.n++] = ch[i];
              if (this.n === this.size) {
                this.port.postMessage(this.buf.slice(0));
                this.n = 0;
              }
            }
          }
          return true;   // keep running even when the input is momentarily silent
        }
      }
      registerProcessor('cap', Cap);
    `;
    const onChunk = (ch) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      // Mute is enforced HERE, by not sending. Not on the server, and not by stopping the audio
      // graph: a mute that still ships audio to something promising to ignore it is not a mute
      // anyone should have to trust, and tearing down the graph would cost a re-permission
      // prompt to come back. The level ring goes still too, which is the visible proof.
      if (muted) { levelTarget = 0; return; }
      // A closed channel sends nothing. The graph keeps running so reopening costs no permission
      // prompt, but no audio leaves the page.
      if (!channelOpen) { levelTarget = 0; return; }
      let sum = 0;
      for (let i = 0; i < ch.length; i++) sum += ch[i] * ch[i];
      const r = Math.sqrt(sum / ch.length);
      if (r > diag.peakRms) diag.peakRms = r;
      // Normalise against a typical speaking level (~0.15 RMS) so the ring uses its full
      // range on ordinary speech instead of only reacting to shouting.
      levelTarget = Math.min(1, r / 0.15);
      reportSpeaking(r);
      ws.send(floatToPCM16(ch).buffer);
      diag.framesSent++;
    };

    let usedWorklet = false;
    if (ctx.audioWorklet) {
      try {
        const url = URL.createObjectURL(new Blob([workletSrc], { type: "text/javascript" }));
        await ctx.audioWorklet.addModule(url);
        URL.revokeObjectURL(url);
        node = new AudioWorkletNode(ctx, "cap", {
          numberOfOutputs: 0,
          processorOptions: { batchSize },
        });
        node.port.onmessage = (e) => onChunk(e.data);
        source.connect(node);
        usedWorklet = true;
      } catch (e) {
        diag.errors.push("audioWorklet: " + e.message);
      }
    }
    if (!usedWorklet) {
      node = ctx.createScriptProcessor(4096, 1, 1);
      node.onaudioprocess = (ev) => onChunk(ev.inputBuffer.getChannelData(0));
