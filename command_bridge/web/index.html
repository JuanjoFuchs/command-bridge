    if (!m.rowLane) return true;                       // a row with no lane belongs to everyone
    return m.rowLane === m.live || m.rowLane === m.broadcast;
  }
  function scopeRow(row) {
    if (!row || !row.classList) return;
    const show = logScopeView({ rowLane: row.dataset.lane, live: liveLane, scope: getLogScope(),
                                broadcast: broadcastLane, laneCount: lanes.length });
    row.classList.toggle("offscope", !show);
  }
  // THE ONLY PAINTER of `.offscope` and of the dropdown's visibility.
  function applyLogScope() {
    const pick = document.getElementById("logpick");
    const sel = document.getElementById("logscope");
    const scope = getLogScope();
    if (pick) pick.hidden = lanes.length < 2;
    if (sel && sel.value !== scope) sel.value = scope;
    if ($log) $log.querySelectorAll(".row").forEach(scopeRow);
    diag.logScope = scope;
  }
  document.getElementById("logscope").addEventListener("change", (e) => {
    try { localStorage.setItem(LOGSCOPE_KEY, e.target.value === "all" ? "all" : "lane"); } catch (_) {}
    applyLogScope();
    scrollToEnd();
  });

  $collapse.addEventListener("click", () => setCollapsed(!$log.hidden));
  setCollapsed(localStorage.getItem("command-bridge.collapsed") === "1");

  // Replay the saved transcript BEFORE the socket connects, so a reload shows his history immediately
  // (the server does not re-send it). New live turns append after and keep the same store current.
  restoreLog();

  $mute.addEventListener("click", () => setMuted(!muted));
  // Verbose has no toggle any more (retired 2026-09-02) — it is the only mode, pinned on.

  // Restores within this browser SESSION only. Verbose does not restore at all — it arrives
  // from the server on connect, because it is one preference he holds rather than one per
  // browser, and reading it from storage is what used to let a stale phone value overwrite what
  // he had just set on the laptop.
  //
  // Any value left in localStorage by an older build is cleared, not read: it is precisely the
  // stale mute this change exists to stop honouring.
  localStorage.removeItem("command-bridge.muted");
  setMuted(sessionStorage.getItem("command-bridge.muted") === "1");

  // Live level -> CSS variable, smoothed and painted once per frame rather than per audio
  // callback. Writing a style on every 4096-sample block (~12/s) is wasteful and jittery;
  // rAF gives smooth motion decoupled from the audio rate.
  // `levelTarget` is written by the shell's capture path; this only smooths and paints it.
  let level = 0;
  // The AGENT's TTS output level (JJ, 2026-09-22): a REAL amplitude tapped off the playback analyser
  // (see playClip in the shell), so the attention strip plots the agent's voice as a waveform, not an
  // on/off block.
  let playLevel = 0, playBuf = null;
  (function paint() {
    // Fast attack, slow release — matches how a level meter should feel: it jumps to your
    // voice instantly but decays gently instead of strobing on every syllable gap.
    level += (levelTarget - level) * (levelTarget > level ? 0.5 : 0.08);
    diag.liveLevel = level;
    document.documentElement.style.setProperty("--level", level.toFixed(3));
    // Agent TTS amplitude — RMS of the playback analyser's time-domain buffer while a clip plays.
    let pTarget = 0;
    if (playAnalyser && playingSource) {
      playBuf = playBuf || new Uint8Array(playAnalyser.fftSize);
      playAnalyser.getByteTimeDomainData(playBuf);
      let sum = 0; for (let i = 0; i < playBuf.length; i++) { const v = (playBuf[i] - 128) / 128; sum += v * v; }
      pTarget = Math.min(1, Math.sqrt(sum / playBuf.length) / 0.15);
    }
    playLevel += (pTarget - playLevel) * (pTarget > playLevel ? 0.5 : 0.08);
    diag.playLevel = playLevel;
    requestAnimationFrame(paint);
  })();

  // ── the lane WAVEFORM visualizer (spec 016, 2026-09-09) ────────────────────────────────────────
  // Redraws each wave lane's bars every frame, and enforces the PRIORITY that voice beats the sweep:
  //   • an agent speaking            → synthesized spiky bars (its TTS is not captured);
  //   • the LIVE lane with real level → his voice as spiky bars — from the AnalyserNode's time-domain
  //     buffer if present, else a level-driven fallback, so it is never blank when he is speaking.
  //     This is the OVERRIDE: if the live lane is in a processing state (e.g. "transcribing") but he
  //     has real mic level, we add `.voicing` so the waveform shows and the sweep is hidden — the fix
  //     for "the waveform is being overridden by the transcribing animation";
  //   • a wave lane that is quiet, or an idle lane → a flat line.
  // A PRESENTATION animator like the level meter above — `applyLaneOrbs` still owns the row and its
  // `data-viz`; this sets the path's `d` and toggles the per-frame `.voicing` flag, nothing
  // structural. Not a CSS animation, so prefers-reduced-motion cannot silence it.
  diag.hasAnalyser = () => !!analyser;
  let waveTime = null;
  (function drawWaves() {
    if ($orbs && !$orbs.hidden && document.body.classList.contains("sharing")) {
      const t = performance.now() / 1000;
      if (analyser) {
        if (!waveTime || waveTime.length !== analyser.fftSize) {
          waveTime = new Uint8Array(analyser.fftSize);
        }
        analyser.getByteTimeDomainData(waveTime);
      }
      // GATE ON REAL SPEECH, NOT RAW LEVEL (spec 016, 2026-09-09). `speakingSignal` is the client's
      // own speech detector — RMS above a floor, held for a 120 ms minimum run and a 700 ms hangover
      // — the same signal it already sends the server as "speaking". A cough, a fan or a door does
      // not trip it, so the waveform stays flat on ambient noise ("that waveform is going crazy even
      // if I'm not speaking"). (The server's adaptive-noise-floor `speech_active` is not pushed to
      // the browser today; this is the noise-robust signal the client has.)
      const heSpeaking = !muted && speakingSignal;
      const cards = $orbs.querySelectorAll(".laneorb");
      for (let c = 0; c < cards.length; c++) {
        const card = cards[c];
        const line = card.querySelector(".waveline");
        if (!line) continue;
        const status = card.dataset.status;
        const agentSpeaking = status === "speaking";            // an agent talking → gate on ITS status
        const heVoicing = card.classList.contains("live") && heSpeaking;  // his real speech, live lane
        // VOICE WINS over the sweep — but only for REAL speech, so a processing lane keeps its sweep
        // until he actually talks.
        card.classList.toggle("voicing", heVoicing && card.dataset.viz !== "wave");
        let d;
        if (agentSpeaking) {
          d = drawBars(line, synthBars(t, c * 1.7 + 0.5), t, c * 1.7);   // an agent talking
        } else if (heVoicing && analyser && waveTime) {
          d = drawBars(line, micBars(waveTime), t, c * 1.7);    // his real voice (oscilloscope)
        } else if (heVoicing) {
          d = drawBars(line, levelBars(level, t, c), t, c * 1.7);   // fallback: level-driven, no analyser
        } else if (card.dataset.viz === "wave") {
          d = drawBars(line, ZERO_MAG, t, c * 1.7);             // a wave lane, quiet → EASE to flat
        } else if (card.dataset.viz === "idle") {
          if (line.__h) line.__h.fill(0);
          d = FLAT_LINE_D;                                      // idle → flat
        } else {
          continue;                                             // scan lane, not voicing → sweep (CSS)
        }
        if (line.__d !== d) { line.setAttribute("d", d); line.__d = d; }
      }
    }
    requestAnimationFrame(drawWaves);
  })();

  // (The wake lock, capture, the power and channel switches, the socket and its reconnect loop all
  // live in the shell — `web/shell.html` — beside the microphone they drive.)

  // EVERY SERVER FRAME, after the shell has done its audio half (a clip's header and bytes, a
  // barge-in, a channel close silencing playback). The shell relays the frame verbatim.
  async function onMessage(ev) {
    if (typeof ev.data === "string") {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === "turn") {
        diag.turns.push(msg);
        fleetMark("trans", ("lane" in msg) ? msg.lane : defaultLane);   // a final turn = his transcription finished
        if ($partial) { $partial.remove(); $partial = null; }   // the final supersedes it
        addRow(tagView({ from: "you", addressed: msg.addressed, lanes,
                         fallback: defaultLane,
                         ...("lane" in msg ? { lane: msg.lane } : {}) }),
               msg.text, msg.addressed ? "addressed" : "", msg.id,
               ("lane" in msg) ? msg.lane : defaultLane);
        placeDivider();
        autoCanvasOnTurn(("lane" in msg) ? msg.lane : defaultLane);   // his ruling releases a held canvas
      } else if (msg.type === "ready") {
        adoptLogSession(msg.session);   // drop a saved transcript from another session (2026-10-13)
        if (msg.lane_colors) laneColors = msg.lane_colors;
        if (msg.lane_roles) laneRoles = msg.lane_roles;
        liaisons = msg.liaisons || {};   // spec 038; an older server sends none = no hierarchy
        // Adopt the server's verbose, do not assert our own — it is one preference he holds,
        // not one per browser.
        if (msg.verbose !== undefined) paintVerbose(msg.verbose);
        if (msg.wake) wakeName = msg.wake;
        // THE WHOLE LANE PICTURE, adopted rather than accumulated. A phone reconnects every time
        // it locks, so "seed from this frame" is the common path and not the edge one — and a
        // strip rebuilt from remembered state would be a strip that can disagree with the server
        // about who is even in the room.
        if (Array.isArray(msg.lanes)) {
          lanes = msg.lanes;
          liveLane = msg.lane;
          laneStates = msg.lane_states || {};
          watchingLanes = msg.watching_lanes || [];
          laneConsumed = msg.lane_consumed || {};
          F.prevConsumed = { ...laneConsumed };   // seed the read-marker baseline WITHOUT marking (snapshot)
          laneWaiting = msg.waiting || {};
          laneWaitingSplit = msg.waiting_split || {};
          if (msg.broadcast) broadcastLane = msg.broadcast;
          if (msg.default_lane) defaultLane = msg.default_lane;
          if (msg.lane_activity) laneActivity = msg.lane_activity;   // objective fleet data (spec 021)
          applyFleetHome();                                          // fleet is the wide multi-agent default (FR1)
          applyLanes(); applyLaneOrbs();
          updateFleet();
          loadHistory();   // now that the lanes are known, the rebuilt rows get the right tags
        }
        applyOrb();
        document.body.classList.remove("booting");   // the room is known: drop the loading screen
      } else if (msg.type === "lane_activity") {
        // Objective per-lane activity (spec 021), pushed on a cadence. Stored and folded into the
        // fleet home layout; every other view ignores it, so it is inert off fleet mode.
        laneActivity = { server_epoch: msg.server_epoch, lanes: msg.lanes || {} };
        updateFleet();
        // The CARD STATUSES read this too now (laneBusy — working vs waiting from the session log),
        // so re-derive them on every activity push. They used to change only on lane/state events,
        // so a card could sit on "idle" while the log showed a script running (JJ, 2026-09-29:
        // "I see Kepler is wrong again … it's been running a script for over one minute").
        applyLaneOrbs();
      } else if (msg.type === "liaison") {
        // Liaison mode changed (spec 038): regroup the cards.
        liaisons = msg.liaisons || {};
        applyLaneOrbs();
        updateFleet();
      } else if (msg.type === "verbose") {
        // Someone flipped it elsewhere — another device, or the agent via `command-bridge verbose on`.
        paintVerbose(msg.value);
      } else if (msg.type === "channel") {
        // Another device (or a reconnect echo) changed it. The shell has already adopted it and
        // silenced playback on a close; this only repaints. (Standalone, this is the adoption.)
        channelOpen = Boolean(msg.value);
        applyOrb();
      } else if (msg.type === "wake") {
        // The agent renamed itself mid-session (`command-bridge wake --name codex`). Nothing on
        // screen prints the phrase any more, so this is recorded rather than painted — the
        // harness still asserts the page learned it.
        wakeName = msg.name || wakeName;
        diag.wake = wakeName;
      } else if (msg.type === "agent_state") {
        // Silence is ambiguous. Naming the state is what separates "it did not hear me" from
        // "it heard me and is working" from "it is holding back so as not to cut me off".
        // Name the operation, do not soften it. "Hearing you" was a friendlier word for
        // transcribing and it cost precision — Live: "it's not clear, hearing you, we should
        // say transcribing." He is watching a machine work; the label should say which machine.
        // The names themselves live in ORB_LABELS, next to the reducer that uses them.
        //
        // THIS HANDLER SETS ONE VARIABLE. Everything visible follows from applyOrb, including
        // whether the elapsed-seconds counter runs — which is what stops a future handler from
        //half-updating the orb and leaving it saying "Thinking" with no clock.
        diag.states.push(msg.state);
        // PER LANE, so the strip can show every agent at once — *"see if one agent is thinking,
        // transcribing, or synthesizing."* The orb still follows only the LIVE lane: a background
        // agent's work must not repaint the state of the agent he is talking to, which is the
        // same separation `muted` and `agent_state` already have from each other.
        // WHO IS WAITING arrives with every state change (015 FR2) — it is what separates a lane
        // that is listening from one that is heads-down, and neither reports itself.
        if (Array.isArray(msg.watching_lanes)) watchingLanes = msg.watching_lanes;
        if (msg.lane_consumed) { fleetMarkConsumed(msg.lane_consumed); laneConsumed = msg.lane_consumed; }
        if (msg.lane) { laneStates[msg.lane] = msg.state; applyLanes(); applyLaneOrbs(); }
        else { applyLaneOrbs(); }
        if (msg.lane === undefined || msg.live !== false) {
          agentState = msg.state;
          applyOrb();
        }
      } else if (msg.type === "lane") {
        if (msg.lane_colors) laneColors = msg.lane_colors;
        if (msg.lane_roles) laneRoles = msg.lane_roles;
        // WHO HE IS TALKING TO NOW, and the whole registry with it. The server sends the complete
        // set on every change rather than a delta, so a page that missed a message cannot drift
        // into disagreeing with it about who is even in the room.
        lanes = Array.isArray(msg.lanes) ? msg.lanes : lanes;
        liveLane = msg.lane;
        if (msg.waiting) laneWaiting = msg.waiting;
        if (msg.waiting_split) laneWaitingSplit = msg.waiting_split;
        if (msg.default_lane) defaultLane = msg.default_lane;
        applyLanes(); applyLaneOrbs();
      } else if (msg.type === "lane_waiting") {
        // An off-lane agent has something to say, or has just been heard. This is FR7's visible
        // half and it must arrive as an event: a mark that only appears on the next poll lags
        // the thing it describes, and he is looking at the screen when he switches.
        if (msg.waiting) { laneWaiting[msg.lane] = msg.waiting; fleetMark("synth", msg.lane); }   // a held clip = a reply finished synthesizing
        else delete laneWaiting[msg.lane];
        // The split rides on the same event (`split`); a zero `waiting` clears both.
        if (msg.waiting && msg.split) laneWaitingSplit[msg.lane] = msg.split;
        else delete laneWaitingSplit[msg.lane];
        applyLanes(); applyLaneOrbs();
      } else if (msg.type === "partial") {
        // Live preview of the utterance still being spoken. Replaced in place, then removed
        // when the final turn lands — so it reads as one sentence firming up rather than a
        // pile of near-duplicate rows.
        diag.partial = msg.text;
        diag.partials.push(msg.text);
        if (!$partial) {
          $partial = document.createElement("div");
          $partial.className = "row partial";
          const s = document.createElement("span");
          s.className = "tag"; s.textContent = "…";
          $partial.appendChild(s);
          $partial.appendChild(document.createElement("span"));
          $log.appendChild($partial);
        }
        $partial.lastChild.textContent = msg.text;
        showHeard($partial, true);   // the folded transcript's live preview (2026-09-29)
        // Same reason as addRow: the live preview grows a line at a time as you keep talking,
        // and measuring before the reflow leaves the newest words below the fold.
        revealRow($partial);
      } else if (msg.type === "consumed") {
        diag.consumed = msg.cursor;
        diag.pending = msg.pending;
        if (msg.read_through) laneReadThrough = msg.read_through;
        if (msg.lane_consumed) { fleetMarkConsumed(msg.lane_consumed); laneConsumed = msg.lane_consumed; }
        placeDivider();
      }
      return;
    }
  }

  // --- what the shell tells this page about clips ----------------------------------------------
  // A clip's bytes arrived and were queued in the shell.
  function clipQueued(header) {
    // A delivered clip = a reply finished synthesizing and is about to PLAY (JJ, 2026-09-22 turn
    // 6496: "I have not seen an S so far"). The held-clip path (lane_waiting) already marks S, but
    // that only fires for a clip held on a NON-live lane; on the live lane the bytes arrive here and
    // play at once, so without this mark synthesis on the lane he is watching never showed an S.
    // Cues carry no lane and are punctuation, not a reply, so they never mark.
    if (!header.cue) fleetMark("synth", header.lane || defaultLane);
    applyLaneOrbs();
  }
  // A reply became audible: its transcript row appears now, not when it was queued.
  function clipStarted(header) {
    addRow(tagView({ from: "agent", lane: header.lane, lanes, fallback: defaultLane }),
           header.text || "", "claude", header.id ? "c:" + header.id : undefined,
           header.lane || defaultLane);
    autoCanvasOnClip(header);   // a clip about the canvas shows it while it plays
  }
  function clipEnded(header) {
    saidEnded();   // the agent bubble fades once the clip has actually finished (2026-09-29)
    if (header) autoCanvasAfterClip(header);
  }

  // --- device pickers: what is heard, and where replies come out ------------------------------
  //
  // TWO REPORTS, ONE SECTION. The 2026-08-15 one below is about a picker that told the truth
  // about the wrong thing; the 2026-08-16 one is about there being two pickers at all —
  // "the microphone and speaker should be just one dropdown that controls both as a group
  // together". The second is answered by `pairDevices`/`paintGroup` further down, and it is
  // downstream of everything here: a control that sets both routes can only be honest if each
  // route is individually readable back, which is what the first report bought.
  //
  // REPORTED LIVE 2026-08-15: "whenever you restart the server, the client is still up. For some
  // reason, it stops using my Bluetooth device and starts outputting through the earpiece. And
  // however, the drop-down didn't change. It still says Bluetooth."
  //
  // TWO SYMPTOMS, AND THE CODE OWNED ONLY ONE OF THEM.
  //
  // The audio moving is the platform. Android does not let a page choose an output device — that
  // is `HTMLMediaElement.setSinkId`'s documented Android limitation, not an oversight here — and
  // an active capture with `echoCancellation` pulls the whole audio session into Android's
  // communication mode, whose fallback output when no headset route is up is the EARPIECE. That
  // is why it is the earpiece specifically and not the loudspeaker. Nothing in this file asked
  // for that and nothing in this file can override it.
  //
  // The picker was ours, and it was worse. There was no output picker at all — playback has
  // always gone to `ctx.destination`, wherever the OS puts that — so the drop-down he was reading
  // is the MICROPHONE. It "still said Bluetooth" because the microphone had not moved and it was
  // telling the truth about the only thing it has ever controlled. Two compounding reasons it
  // read as broken instead of irrelevant: a pill showing a bare device name makes no claim about
  // direction, and re-selecting the option already selected fires no `change` event at all — so
  // the one gesture a person makes to repair a stale control is the one gesture that does
  // nothing. Both are fixed here: the glyphs say which way each pill points, and neither list
  // waits to be corrected.
  //
  // THE RULE THAT FALLS OUT OF IT, and the reason this is one section rather than two:
  // A PICKER SHOWS WHAT IS IN USE, NEVER WHAT WAS REQUESTED. A request is right until the moment
  // it matters, and then stays confidently wrong because nothing ever contradicts it. So the
  // input list is painted from the live track's own settings, and the output list from the sink
  // the AudioContext reports back — not from `sinkWanted`, and not from `diag.settings`, which is
  // a snapshot taken at start() and therefore can never report a device that moved.

  // THE ROUTE ITSELF IS THE SHELL'S — the AudioContext it is read off lives there, and so does the
  // one door that changes it (`applySink`). This section enumerates, builds the lists and paints.
  // Standalone there is no context: every route reads "unknowable" and nothing is applied.
  const AC = window.AudioContext || window.webkitAudioContext;
  const { normSink, currentSink, liveSink, applySink } = SH || {
    normSink: (v) => (!v || v === "default" ? "" : v),
    currentSink: () => "", liveSink: () => null, applySink: async () => {},
  };
  // After the shell has changed or re-read the route: VISIBILITY FIRST, then the two painters. A
  // `NotSupportedError` in `applySink` clears `sinkSupported`, which changes which pills can exist
  // AND whether the halves can be paired — and `paintSink`/`paintGroup` both read `grouped`, which
  // `applyPills` republishes, so painting before deciding would repaint the layout just withdrawn.
  // The grouped pill stands for BOTH routes, so a sink that fell back has to move it too.
  function devicesChanged() {
    applyPills();
    paintSink();
    paintGroup();
  }

  // Paint the output picker from the CONTEXT, never from `sinkWanted`. This is the whole answer to
  // "the drop-down didn't change": the selection is a readout of the routing rather than a memory
  // of an instruction, so if the route falls back the control falls back with it, visibly, and he
  // learns from the picker instead of from the sound.
  function paintSink() {
    // SELECTION ONLY — this function no longer decides whether the pill is on screen. It used to
    // set `$spkpick.hidden` itself, and `paintGroup` and `refreshDevices` each set one too: three
    // independent writers of the same rule, which is the shape the orb already paid for. Spec 009
    // moved all three into `pillsView`/`applyPills`. It is still painted while hidden, because the
    // pill can come back on the next enumeration and a list that only updates while visible would
    // return stale.
    diag.sink.supported = sinkSupported;
    diag.sink.wanted = sinkWanted;
    if (!sinkSupported) { diag.sink.inUse = null; diag.sink.shown = null; return; }
    const have = normSink(currentSink());
    diag.sink.inUse = have;
    const opts = Array.from($spk.options);
    const match = opts.find((o) => normSink(o.value) === have)
               || opts.find((o) => normSink(o.value) === "");
    if (match) match.selected = true;
    else {
      // Playing through a device the enumeration does not list. Left alone, the browser displays
      // option zero — a specific, confident, wrong answer, which is the failure mode this whole
      // section exists to remove. Name the gap instead.
      const o = document.createElement("option");
      o.value = have; o.textContent = "current output";
      o.selected = true;
      $spk.appendChild(o);
    }
    diag.sink.shown = $spk.value;
  }

  // Chrome lists the same physical device up to three times: once for real, and once each as the
  // `default` and `communications` pseudo-devices, all sharing a groupId. The real entry is the
  // one worth naming and the one worth selecting, so the aliases are only ever tie-breakers.
  const ALIAS_IDS = new Set(["default", "communications"]);
  // "Default - Headset (WH-1000XM4)" is Chrome labelling the alias, not the device. Kept off the
  // grouped pill because the pill already means "the device", and a name that says which alias it
  // came from is noise in a control whose whole job is to name one object.
  const cleanLabel = (s) => (s || "").replace(/^(Default|Communications)\s+-\s+/i, "").trim();

  // GROUP BY `groupId`, WHICH IS ALREADY ON EVERY ENUMERATED DEVICE — so this is a rewrite of how
  // the lists are rendered, not new capability. Returns only the groups with BOTH halves present,
  // because a group with one half cannot be driven by a control that claims to set both.
  function pairDevices(ins, outs) {
    const map = new Map();
    const side = (kind) => (d) => {
      if (!d.groupId) return;
      let g = map.get(d.groupId);
      if (!g) { g = { in:null, out:null, label:"" }; map.set(d.groupId, g); }
      // Prefer the REAL entry over Chrome's aliases, for the id and for the label alike. First
      // writer wins otherwise, and the aliases usually sort first.
      //
      // BETWEEN THE TWO HALVES, first writer wins and that is deliberate — inputs are offered
      // first, so a group is named after its microphone. No rule picks the "better" name, because
      // there isn't one: on the device he actually reported, a Bluetooth headset, both halves
      // carry the same product name, and on a built-in card neither half names the card. Identity
      // here is the `groupId`; the label is only how he recognises it. A rule that reached into
      // label text to choose would be the same guesswork this function exists to avoid.
      const better = g[kind] === null || (ALIAS_IDS.has(g[kind]) && !ALIAS_IDS.has(d.deviceId));
      if (better) g[kind] = d.deviceId;
      const label = cleanLabel(d.label);
      if (label && (!g.label || (!ALIAS_IDS.has(d.deviceId) && g.labelFromAlias))) {
        g.label = label;
        g.labelFromAlias = ALIAS_IDS.has(d.deviceId);
      }
    };
    ins.forEach(side("in"));
    outs.forEach(side("out"));
    return new Map([...map].filter(([, g]) => g.in !== null && g.out !== null));
  }

  // HOW MANY DEVICES ARE THERE REALLY. This is the count spec 009 turns on, and the reason the
  // rule is "distinct devices" rather than "entries returned by enumerateDevices".
  //
  // Chrome lists one physical output up to THREE times — once for real, once as `default`, once as
  // `communications`, all sharing a `groupId`. A rule that counted rows would therefore leave the
  // dead picker on every single-output desktop: three entries, one choice, a drop-down that can
  // only ever re-select what is already selected. Two entries that are the same device said twice
  // are one choice, not two.
  //
  // IDENTITY IS THE PAGE'S EXISTING ONE, deliberately. `groupId` first, because that is the
  // browser's own statement that two entries are one object and it is already what `pairDevices`
  // trusts; the alias ids second. A second notion of "same device" invented here would be a second
  // thing for the grouped pill to disagree with.
  //
  // An alias is a POINTER, not a device — `default` names whichever real device the OS currently
  // points it at. So it folds into that device when the platform says which (a shared `groupId`,
  // or the label Chrome copied onto it), and is counted on its own ONLY when it is all there is.
  // That last case is not hypothetical: a lone unlabelled `default` is the Android shape exactly,
  // and it has to count as one — hiding the picker for "nothing to choose from" rather than for
  // "nothing enumerated" is the same outcome by an honest route.
  function distinctDevices(list) {
    const keys = new Set();
    const real = list.filter((d) => !ALIAS_IDS.has(d.deviceId));
    const aliases = list.filter((d) => ALIAS_IDS.has(d.deviceId));
    for (const d of real) keys.add(d.groupId ? "g:" + d.groupId : "d:" + d.deviceId);
    for (const d of aliases) {
      // Already counted under the real entry it points at.
      if (d.groupId && keys.has("g:" + d.groupId)) continue;
      // No groupId anywhere is the platform declining to say. The label is the only remaining
      // evidence, and "Default - Headset (WH-1000XM4)" is Chrome naming the device it points at.
      const label = cleanLabel(d.label);
      if (label && real.some((r) => cleanLabel(r.label) === label)) continue;
      keys.add(d.groupId ? "g:" + d.groupId : "l:" + (label || "default"));
    }
    return keys.size;
  }

  // THE ONE FUNCTION THAT DECIDES WHICH PILLS EXIST — pure, in the same sense and for the same
  // reason as `orbView`: enumeration facts in, a model out, no DOM and no globals read or written.
  //
  // WHY IT IS ONE FUNCTION. `paintSink`, `paintGroup` and `refreshDevices` each used to assign a
  // pill's `hidden` independently, which is precisely the shape that made the orb read "Thinking"
  // with no clock: whichever writer ran last won, none of them knew about the others, and nothing
  // in the suite could see the disagreement because there was no single thing to sweep. A rule
  // that lives in three assignments is a rule that will be tested on one path and broken on
  // another.
  //
  // THE RULE ITSELF. A control appears only when it can change something. Reported live
  // 2026-08-18, on a headset, with the speaker list offering only `default`: "It seems we need to
  // be smarter than that, right? If there is no speaker to choose, why would we show a drop-down
  // to choose a speaker?" Zero or one choice is not a choice. Disabling or greying such a control
  // would be worse than removing it — a disabled control still asserts that the capability EXISTS
  // and is merely unavailable right now, which is a different and false claim.
  //
  // The model:
  //   m.inputs         raw `audioinput` rows as `enumerateDevices` returns them
  //   m.outputs        raw `audiooutput` rows, same — RAW, because the alias collapse is this
  //                    function's job and a caller that pre-counted would be the second answer
  //   m.sinkSupported  can this platform route output per page at all
  //   m.liveSink       the sink read back off a LIVE AudioContext, normalised; `null` when there
  //                    is no live context or it reports none. Never `sinkWanted`, never the stored
  //                    preference, never the start()-time snapshot — see the route block below.
  function pillsView(m) {
    const ins = m.inputs || [];
    const outs = m.outputs || [];
    const sinkSupported = Boolean(m.sinkSupported);

    // PAIRING IS UNCHANGED — the 008-era rule moved here, not rewritten. Still all-or-nothing:
    // every input and every output must belong to a group that has both halves, because one
    // ungrouped device and the combined pill silently cannot reach it.
    const groups = pairDevices(ins, outs);
    const covered = (list) => list.every((d) => d.groupId && groups.has(d.groupId));
    const grouped = Boolean(sinkSupported && ins.length && outs.length
                            && covered(ins) && covered(outs));

    const inputs = distinctDevices(ins);
    const outputs = distinctDevices(outs);

    const show = { dev:false, mic:false, spk:false };
    const why = { dev:null, mic:null, spk:null };

    if (grouped) {
      // ONE PILL FOR ONE DEVICE — and still only where there is a second device to move to. A
      // laptop whose only sound card pairs cleanly reaches this branch with one group, and a
      // drop-down listing that one group is the same dead control in a tidier layout.
      show.dev = groups.size > 1;
      if (!show.dev) why.dev = "only one paired device — nothing to choose";
      // The single-purpose pair is the FALLBACK. Three pills is worse than two, and two ways to
      // set one route is two ways to be half-connected.
      why.mic = "the grouped pill covers both halves";
      why.spk = "the grouped pill covers both halves";
    } else {
      why.dev = !sinkSupported ? "output not selectable on this platform"
        : !ins.length || !outs.length ? "nothing enumerated on one side"
        : "some devices report no usable groupId";
      show.mic = inputs > 1;
      if (!show.mic) why.mic = inputs ? "one input device — nothing to choose"
                                      : "no audioinput devices enumerated";
      // TWO SEPARATE REASONS TO WITHDRAW THE OUTPUT PILL, and they are not the same fact. The
      // platform may be unable to route audio per page at all (`setSinkId` absent or refused), or
      // it may be able to and have nothing to route between. Counting answers the second without
      // needing the platform to admit the first — which matters because the capability check that
      // WOULD have caught Android is structurally unreachable: `applySink` returns early when the
      // wanted and current sinks already agree, and at page load both are "". Nothing calls
      // `setSinkId`, so nothing throws, so the dead control was never withdrawn. Provoking a
      // refusal on purpose is the wrong repair; not offering an empty choice is the right one.
      show.spk = sinkSupported && outputs > 1;
      if (!show.spk) why.spk = !sinkSupported ? "this platform cannot select an output device"
        : outputs ? "one output device — nothing to choose"
                  : "no audiooutput devices enumerated";
    }

    // FR3 — WHERE THE AUDIO IS GOING, said only when the page can genuinely know.
    //
    // The bar is deliberately high, because the failure that started this section was not a
    // missing control but a lying one: a picker reading "Bluetooth" while audio came out of the
    // earpiece. Knowing means the sink read back off the LIVE context matching an enumerated
    // device that carries a REAL label. A remembered preference, a `sinkWanted` and a start-time
    // snapshot are each a thing that was true once and is never contradicted — which is exactly
    // how a stale label survives — so none of them reach this function at all.
    //
    // AND ONLY WHERE NO CONTROL SAYS IT ALREADY. With a picker on screen the pill IS the readout,
    // and a second one beside it is a second thing to go stale. `route` is therefore non-null
    // exactly when the page renders route text, so the model and the DOM cannot disagree about it.
    let route = null;
    if (!show.dev && !show.spk && m.liveSink !== null && m.liveSink !== undefined) {
      const have = normSink(m.liveSink);
      const hit = outs.find((d) => normSink(d.deviceId) === have && cleanLabel(d.label));
      route = hit ? cleanLabel(hit.label) : null;
    }

    return { inputs, outputs, grouped, show, why, route };
  }

  // THE ONLY WRITER OF PILL VISIBILITY. Everything that can change what is enumerated, whether the
  // platform can route, or where audio is actually going ends here — and nothing else assigns a
  // pill's `hidden`, which `tests/test_device_pills.py` asserts over the source so a fourth
  // assignment cannot be added quietly.
  //
  // It computes nothing of its own: it is a projection of the model onto the DOM. A second
  // computation here would be a second answer, which is the defect this replaces rather than a
  // tidier version of it.
  function applyPills() {
    const view = pillsView({
      inputs: lastIns,
      outputs: lastOuts,
      sinkSupported,
      liveSink: liveSink(),
    });
    // PUBLISHED, not recomputed. `paintSink`, `paintGroup` and the list building in
    // `refreshDevices` all read `grouped`, and every one of them now reads the value this function
    // decided rather than deciding it again.
    grouped = view.grouped;
    $devpick.hidden = !view.show.dev;
    $micpick.hidden = !view.show.mic;
    $spkpick.hidden = !view.show.spk;
    // THE CLUSTER WIDTH FOLLOWS THE LAYOUT, from the same model. 29rem is what fits two pills on
    // one line, which `scripts/layout.py` requires; 24rem is the cluster bound `scripts/orbstate.py`
    // measures. Only the two-pill arrangement genuinely needs the room, and keying it on the model
    // rather than on a second reading of the DOM is what stops the wide cluster being granted to a
    // row that has one pill in it.
    $controls.classList.toggle("split", view.show.mic && view.show.spk);
    // NOTHING AT ALL when the route is unknowable — not "unknown", not an empty element holding a
    // line of height. `hidden` on a plain <div> is `display:none`, so it leaves the flex flow.
    //
    // Written only when it CHANGES, because this is a live region: assigning the same string still
    // replaces the text node, and some screen readers announce that. This function runs on every
    // enumeration and on every route change, so an unguarded write would re-announce the speaker
    // at moments where nothing about it moved.
    const text = view.route || "";
    if ($route.textContent !== text) $route.textContent = text;
    $route.hidden = !view.route;
    diag.pills = view;
    return view;
  }

  // Exposed for the same reason as `orbView`: a harness can sweep every enumeration shape — the
  // Android single `default`, Chrome's three rows for one card, two real devices, nothing at all —
  // in milliseconds, with no device, no permission and no phone. The browser checks then only have
  // to prove the model is WIRED to the page, not that the rules are right.
  diag.pillsView = pillsView;

  // Paint the grouped pill from the LIVE track and the LIVE sink — never from the last selection.
  // Same rule as `paintSink`, and it bites harder here: one control standing for two routes has
  // two ways to become a lie, so it has to be able to say "these are not the same device".
  function paintGroup() {
    // SELECTION ONLY — like `paintSink`, this no longer decides whether its pill is on screen, and
    // it no longer sets the cluster width either. Both moved to `applyPills` with spec 009: the
    // width is a consequence of which pills are visible, so it has to be set by whatever decides
    // that, or a one-pill row can be granted the two-pill width. The pill is still painted while
    // hidden, because `grouped` is recomputed on every enumeration and a stale list would arrive
    // on screen at exactly the moment it comes back.
    diag.group.supported = grouped;
    diag.group.count = deviceGroups.size;
    for (const stale of Array.from($dev.querySelectorAll("option[data-synthetic]"))) stale.remove();
    if (!grouped) { diag.group.inUse = null; diag.group.shown = null; return; }
    const track = micStream && micStream.getAudioTracks()[0];
    const liveIn = track ? track.getSettings().deviceId : undefined;
    // `currentSink()` reports the browser default as "", while `enumerateDevices` lists that same
    // device as "default" — the pair `normSink` exists for. Look the alias up, not the blank.
    const groupIn = groupOfDevice.get(liveIn) || null;
    const groupOut = groupOfDevice.get(normSink(currentSink()) || "default") || null;
    const match = groupIn && groupIn === groupOut
      ? Array.from($dev.options).find((o) => o.value === groupIn) : null;
    if (match) {
      match.selected = true;
      diag.group.inUse = groupIn;
      diag.group.why = "grouped";
    } else {
      // Option zero would otherwise be displayed: a specific, confident, wrong answer, which is
      // the failure this whole section exists to remove. Name the gap instead — and name WHICH
      // gap, because "not enumerated yet" and "your ears and your mouth are on different devices"
      // call for completely different responses.
      const split = Boolean(groupIn && groupOut);
      const o = document.createElement("option");
      o.value = ""; o.dataset.synthetic = "1"; o.selected = true;
      o.textContent = split ? "mic and speaker on different devices" : "current devices";
      $dev.appendChild(o);
      diag.group.inUse = null;
      diag.group.why = split ? "split across two devices" : "in use but not enumerated";
    }
    diag.group.shown = $dev.value;
  }

  // Rebuilt on every event that can change what is attached or where audio goes: the permission
  // grant, the context opening, a RECONNECT, and the browser's own `devicechange`. It used to run
  // exactly once, inside start() — so a list built at the first tap was still on screen hours
  // later, whatever had been plugged in or paired since.
  async function refreshDevices(reason) {
    if (!navigator.mediaDevices?.enumerateDevices) return;
    let devices;
    try { devices = await navigator.mediaDevices.enumerateDevices(); }
    catch (e) { diag.errors.push("enumerate: " + e.message); return; }

    const ins = devices.filter((d) => d.kind === "audioinput");
    const outs = devices.filter((d) => d.kind === "audiooutput");
    // KEPT, so the visibility rule can be re-run on the events that are not enumerations — a sink
    // that refused, a context that opened or closed, a route that fell back. This is the only
    // place that writes them.
    lastIns = ins;
    lastOuts = outs;

    // --- output capability ---------------------------------------------------
    // BOTH halves are feature-detected, and which half is missing is recorded, because that is the
    // question a live phone session can answer and no test here can: Android is expected to fail
    // the first check, the second, or both, and "it came out of the earpiece" is not evidence of
    // which. Guessing at this is what produced a suspected mechanism that turned out to be wrong.
    // Decided BEFORE the grouping below, because a platform that cannot move output cannot honour
    // a control that claims to move both halves either.
    diag.sink.devices = outs.length;
    if (sinkRefused) sinkSupported = false;
    else if (!AC || !("setSinkId" in AC.prototype)) { sinkSupported = false; diag.sink.why = "no setSinkId on this platform"; }
    else if (!outs.length) { sinkSupported = false; diag.sink.why = "no audiooutput devices enumerated"; }
    else { sinkSupported = true; diag.sink.why = "selectable"; }

    // --- can the two halves be paired? ---------------------------------------
    // ALL-OR-NOTHING, and deliberately strict — the rule itself now lives in `pillsView`, which is
    // where `grouped` is decided. What is still built here is the REVERSE INDEX `paintGroup` needs
    // to look a live device up by id, which is not a decision and cannot disagree with one:
    // `pillsView` calls the same `pairDevices` on the same two lists.
    deviceGroups = pairDevices(ins, outs);
    groupOfDevice = new Map();
    for (const d of devices) {
      if (d.groupId && deviceGroups.has(d.groupId)) groupOfDevice.set(d.deviceId, d.groupId);
    }

    // --- WHICH PILLS EXIST ---------------------------------------------------
    // THE DECISION, ON THE PATH THAT ALREADY RUNS (spec 009 FR5/TC2). This function is called on
    // the permission grant, on the context opening, on a reconnect and on the browser's own
    // `devicechange` — and enumeration is permission-dependent, so a decision made once at first
    // paint is wrong a second later. Sitting the rule here rather than beside it is the difference
    // between a rule that re-runs and a rule that sampled.
    //
    // It runs BEFORE the lists are built because it publishes `grouped`, which the building below
    // and both painters read. It runs again at the end, because `applySink` can discover a route
    // this platform will not honour and that changes which pills can exist at all.
    const view = applyPills();
    // Kept exactly as it was: `diag.group.why` answers "why is there no grouped pill", and
    // `paintGroup` owns the answer whenever there IS one. The finer reason a pill is off screen —
    // including a pairing that worked but offers one device — lives in `diag.pills.why`.
    if (!view.grouped) diag.group.why = view.why.dev;

    // --- input ---------------------------------------------------------------
    // The device actually feeding the graph, read LIVE off the track every time. Labels are empty
    // until permission is granted — which is why the decision above re-runs on the grant rather
    // than being taken once at first paint.
    const track = micStream && micStream.getAudioTracks()[0];
    const live = track ? track.getSettings().deviceId : undefined;
    if (ins.length) {
      $mic.innerHTML = "";
      for (const d of ins) {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || "microphone";
        if (d.deviceId === live) o.selected = true;
        $mic.appendChild(o);
      }
      diag.micInUse = live === undefined ? null : live;
      diag.micShown = $mic.value;
    }
    // NOTE THAT NOTHING HERE HIDES ANYTHING. The lists are built from what is enumerated and the
    // pills are shown from what is choosable, and those are two different questions with two
    // different answers — TC5. `grouped` is recomputed on every enumeration and a second device
    // can appear at any moment, so a list that only populated while visible would arrive on screen
    // empty at exactly the moment it came back.

    // --- output --------------------------------------------------------------
    if (sinkSupported) {
      $spk.innerHTML = "";
      for (const d of outs) {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || (normSink(d.deviceId) === "" ? "system default" : "speaker");
        $spk.appendChild(o);
      }
    }

    // --- the grouped pill ----------------------------------------------------
    // Built whenever the halves PAIR, not whenever the pill is on screen. With one paired device
    // the pill is withdrawn — nothing to choose — but a second device appearing is a `devicechange`
    // away, and the list has to be ready for it. Same rule as the two above.
    if (grouped) {
      $dev.innerHTML = "";
      for (const [id, g] of deviceGroups) {
        const o = document.createElement("option");
        o.value = id;
        o.textContent = g.label || "audio device";
        $dev.appendChild(o);
      }
    }

    // RE-APPLY. On the reconnect path this is the line whose absence is the bug: a socket coming
    // back is exactly the moment the page can no longer assume anything it set up before the drop
    // is still in force.
    await applySink(reason);
    // SECOND PASS. `applySink` may have just learned this platform refuses to route at all, which
    // withdraws the output pill and un-pairs the halves — and it may have moved the live sink,
    // which is what the FR3 route readout is painted from. Both are facts that did not exist when
    // the decision above was taken, and `applyPills` is cheap and pure.
    applyPills();
    paintSink();
    paintGroup();
  }

  // The set of attached devices changed under us — earbuds paired, a dock unplugged, a headset
  // that went away and came back. This is the ONLY event that can tell the page a sink has
  // returned, so it is also the only chance to put audio back on it without him touching
  // anything. Which is the point: he should not have to notice, and if he does notice, the
  // picker should already agree with him.
  if (navigator.mediaDevices && "ondevicechange" in navigator.mediaDevices) {
    navigator.mediaDevices.addEventListener("devicechange", () => { refreshDevices("devicechange"); });
  }

  $mic.addEventListener("change", async () => {
    localStorage.setItem("command-bridge.micId", $mic.value);
    // Full stop/start rather than surgery on a live audio graph: swapping the source node
    // mid-stream is where subtle capture bugs breed, and the turn log lives on the server so
    // a reconnect costs nothing.
    if (SH) await SH.restartCapture();
  });

  // No stop/start here, unlike the microphone above, and the asymmetry is real rather than an
  // oversight: `setSinkId` re-routes a LIVE context, so the session, the socket, the permission
  // grant and anything mid-playback all survive the change. Tearing the capture down to move a
  // speaker would drop his turn to fix his ears.
  //
  // Persisted, because a server restart already costs him the thread of the conversation; making
  // it cost the speaker choice on top is a second annoyance stacked on the first, and he would
  // have to notice it to fix it.
  $spk.addEventListener("change", async () => {
    sinkWanted = $spk.value;
    localStorage.setItem("command-bridge.sinkId", sinkWanted);
    await applySink("picked");
  });

  // ONE GESTURE, BOTH HALVES — AND THE ORDER IS THE WHOLE DESIGN.
  //
  // The two handlers above are deliberately asymmetric: the microphone tears the capture down and
  // rebuilds it, because swapping the source on a live audio graph is where subtle capture bugs
  // breed; the speaker does not, because `setSinkId` re-routes a live context and tearing capture
  // down to move a speaker "would drop his turn to fix his ears". A combined control has to do
  // both, so it inherits both reasons — which means the SINK GOES FIRST.
  //
  // Sink first is instant and non-destructive: his ears are fixed before anything is torn down, so
  // a reply already playing survives the change, and if the restart below fails (a mic unplugged
  // between enumeration and this tap) he is still left better off than he started. Capture first
  // would make every device change cost a dropped turn — paying the microphone's price for a
  // gesture that is usually about the speaker.
  //
  // Both halves are written to the SAME localStorage keys the single pickers use, so persistence,
  // the `start()` restore path and the fallback layout all keep working unchanged. A third stored
  // preference would be a third thing to go stale.
  $dev.addEventListener("change", async () => {
    const group = deviceGroups.get($dev.value);
    // The synthetic "current devices" option has an empty value and names a state, not a choice.
    // Selecting it is not a request for anything, so it must not move audio anywhere.
    if (!group) { paintGroup(); return; }

    sinkWanted = group.out;
    localStorage.setItem("command-bridge.sinkId", sinkWanted);
    await applySink("picked");

    localStorage.setItem("command-bridge.micId", group.in);
    if (SH) await SH.restartCapture();
  });

  // Sync the readout at load so `diag.sink` describes the page from its first moment rather than
  // from the first enumeration. Nothing is enumerated yet, so every pill is hidden — which the
  // markup already does. The value is that a harness reading `diag` before anyone taps gets the
  // restored preference and a real `pills` model, not a blank and a null.
  applyPills();
  paintSink();
  paintGroup();

  // THE CONTROLS MOVE INTO THE HEADER ROW (spec 014 FR1) — the `#controls` ELEMENT itself, not its
  // children. Rebuilding them in the header would fork four controls into two definitions, which is
  // how the mute button and the picker drifted apart the first time; moving the children instead
  // would orphan every rule and harness keyed on `#controls`, including the `.split` case
  // `scripts/layout.py` fakes to reproduce a two-pill desktop. `append` moves a live node, so
  // listeners, ids and accessible names all survive intact.
  $headctl.append($controls);

  // 🔴 SESSION LIFECYCLE LIVES ON THE POWER BUTTON, AND NOWHERE ELSE (spec 014 FR2, TC1, AC-2).
  //
  // The orb carried it until now, which was coherent while one orb meant one agent. Spec 014 gives
  // every lane an orb, and a lifecycle handler on each of them would mean N controls racing to own
  // one microphone. So it moved out to a control that is about the session rather than about an
  // agent, exactly as he asked: *"Maybe we add that button as a power button right to the left of
  // the command bridge title... And that means that the orbs, each orb for each agent or each lane
  // is just clicking on it, is just switching to that lane."*
  //
  // ⚠ THE ORB STAYS TAPPABLE WHILE THE SESSION IS OFF, and only then (TC2). A browser opens no
  // microphone without a gesture, and "Tap to start" written across the orb is what has taught
  // every first use so far; a bare power glyph teaches nothing. Once running, the orb is display.
  $power.addEventListener("click", orbTapped);
  $orbs.addEventListener("click", tapLaneOrb);

  // The seconds have to ADVANCE, and nothing else repaints the row between state changes — which
  // is precisely the window the number exists to fill.
  //
  // ⚠ **THE TICK IS THE RESOLUTION SHOWN, and when the decimal came back the tick had to follow.**
  // It was one second against a whole-second reading; a tenth is now displayed, so a one-second
  // tick would show a tenths digit that jumped by ten every time.
  //
  // 🔴 **AND IT MUST NOT CALL THE PAINTER.** `applyLaneOrbs` rebuilds the row with
  // `replaceChildren`, so at ten times a second a tap had a good chance of landing on a button
  // that stopped existing between press and release — the click never fires, because the element
  // it started on is gone. Reported within minutes of the decimal shipping: *"clicking around the
  // orbs is weird. And one click does not recognize the lane switching. Was that on purpose?"*
  //
  // 🎯 **A repaint rate is a liveness decision; a rebuild is a structural one, and they were the
  // same call.** This writes text into an element that is always present and touches nothing else,
  // so the buttons under his thumb survive. Structure still changes only when the model does.
  setInterval(() => {

        // lane recently touched the file. Two bugs fixed together: (1) direction was the all-time dominant,
        // so a file you read but edited more showed "in" while reading it; (2) `active` was FILE-level, so
        // one agent touching a file lit up EVERY agent's stale edge as if they were all reading/writing it.
        // Now only the agent actually touching it animates, in its live direction; idle edges fall to dominant.
        const lo = fm.laneOp[lane];
        const laneActive = !!(lo && (epoch - (lo.t || 0)) < F.ACTIVE_S);
        const dir = (laneActive && lo.op) ? lo.op : dom;
        const tok = fm.cmd ? ((fm.laneTok || {})[lane] || { in: 0, out: 0 }) : null;
        F.edges.push({ a: "agent:" + lane, f: fid, col: F.ACT[dir], into: dir !== "read", active: laneActive,
          vol: Math.round((fm.chars || 0) / 4),   // tokens read/written on this file (chars/4) -> drives the arrow COUNT
          cmd: !!fm.cmd, inT: tok ? (tok.inT || 0) : 0, outT: tok ? (tok.outT || 0) : 0,
          runIn: tok ? (tok.lastIn || 0) : 0, runOut: tok ? (tok.lastOut || 0) : 0 });
      }
    }
  }

  function fleetSim() {
    if (F.sim) return F.sim;
    // No many-body CHARGE: it once spread free-floating repos apart, but every box is PINNED by the
    // packer now, and a repo's charge was repelling its OWN dots — pushing them out to the rim and, with
    // the neighbours' charges, into two crushed columns that shook each time the sim warmed (JJ,
    // 2026-09-28). No COLLIDE either — dots are seated on a spiral outside the physics (fleetSeparateBoxes).
    const sim = d3.forceSimulation([])
      .alphaDecay(0.02).velocityDecay(0.62);
    sim.force("primary", (alpha) => { for (const n of F.nodes) {
      if (n.type !== "repo" || !n.primary) continue;
      const a = F.byId.get(n.primary); if (!a) continue;
      // A repo sits in the vertical MARGIN above (top-row agent) or below (bottom-row) its primary,
      // aligned to the agent's column and fanned horizontally when several share a primary. This uses
      // the empty space above/below the grid and never clips a card CORNER the way a diagonal placement
      // did (JJ, 2026-09-21: "the Magnus card is colliding with the command-bridge box").
      const up = a.y < 0 ? -1 : 1, V = 98;
      const tx = a.x + (n.offset || 0) * 120, ty = a.y + up * V;
      n.vx += (tx - n.x) * 0.3 * alpha; n.vy += (ty - n.y) * 0.3 * alpha; } });
    // (No "blob" force: file dots are SEATED on a spiral by fleetSeparateBoxes, outside the physics.)
    // Declutter — the ONE place collisions are resolved, and it uses each repo's REAL drawn box, not a
    // radius (JJ, 2026-09-21: "handle this logic properly once and for all"). A repo's box is as wide as
    // the WIDER of its file cluster and its NAME LABEL — which is exactly why two repos with
    // long names overlapped: a radius ignored the label. Two rectangle-vs-
    // rectangle rules: (1) no repo box may enter the grid's bounding box; (2) no two repo boxes overlap.
    // Only the repo node is moved; its files and label follow. Files are never pushed, so the
    // ring-around-a-repo look cannot come back.
    sim.force("declutter", (alpha) => {
      const repos = [], agents = [];
      for (const n of F.nodes) { if (n.type === "repo") repos.push(n); else if (n.type === "agent") agents.push(n); }
      if (!agents.length) return;
      const HW = 74, HH = 46;   // agent-card half-extents (world)
      let gx0 = 1e9, gy0 = 1e9, gx1 = -1e9, gy1 = -1e9;
      for (const ag of agents) { gx0 = Math.min(gx0, ag.x - HW); gy0 = Math.min(gy0, ag.y - HH); gx1 = Math.max(gx1, ag.x + HW); gy1 = Math.max(gy1, ag.y + HH); }
      // each repo's half-extents, centred on the repo node (files cluster there; the name sits on top)
      const half = new Map();
      for (const rp of repos) {
        let sx = rp.r || 20, sy = rp.r || 20;
        for (const f of F.nodes) { if (f.type === "file" && f.repoId === rp.id) {
          const r = (f.dotR || 4) + 2;
          sx = Math.max(sx, Math.abs(f.x - rp.x) + r); sy = Math.max(sy, Math.abs(f.y - rp.y) + r); } }
        const nameHW = ((rp.repo || "x").length) * 3.4 + 8;   // ~world half-width of the drawn name label
        half.set(rp.id, { hw: Math.max(sx, nameHW), hh: sy + 20 });   // +20 for the label row above the dots
      }
      for (const rp of repos) {
        const b = half.get(rp.id); if (!b) continue;
        // (1) eject the repo's box from the grid box, the shortest of the four ways out
        const pL = (rp.x + b.hw) - gx0, pR = gx1 - (rp.x - b.hw), pT = (rp.y + b.hh) - gy0, pB = gy1 - (rp.y - b.hh);
        if (pL > 0 && pR > 0 && pT > 0 && pB > 0) {
          const m = Math.min(pL, pR, pT, pB);
          if (m === pL) rp.vx -= pL * 3.5 * alpha;
          else if (m === pR) rp.vx += pR * 3.5 * alpha;
          else if (m === pT) rp.vy -= pT * 3.5 * alpha;
          else rp.vy += pB * 3.5 * alpha;
        }
        // (2) separate from every other repo box (rectangle overlap -> push apart on the shorter axis)
        for (const o of repos) { if (o === rp) continue; const ob = half.get(o.id); if (!ob) continue;
          const ox = (b.hw + ob.hw + 8) - Math.abs(rp.x - o.x), oy = (b.hh + ob.hh + 8) - Math.abs(rp.y - o.y);
          if (ox > 0 && oy > 0) {
            if (ox <= oy) rp.vx += (rp.x < o.x ? -1 : 1) * ox * 1.5 * alpha;
            else rp.vy += (rp.y < o.y ? -1 : 1) * oy * 1.5 * alpha;
          } }
      }
    });
    sim.stop();
    F.sim = sim; return sim;
  }

  // NO TWO BOXES OVERLAP, measured on what is DRAWN (JJ, 2026-09-28, after command boxes doubled the box
  // count: `⌘ command-bridge` sat on `⌘ python`, a notes repo on no-repo). Slots are spaced by an
  // ESTIMATED width, but a box is drawn around its file dots wherever the forces put them, and a busy
  // repo's blob outgrows its estimate; the no-repo box is pinned without looking at its neighbours at
  // all. So each frame, measure every box in world units (the same extents the render and fleetFit
  // use), and push the LATER of any overlapping pair apart along the axis that needs the smaller move
  // — anchor and dots together, so the box moves whole. A few passes settle a chain of pushes.
  // AGE FADE (JJ, 2026-09-22 idea 1): a file dims as its last-touch age grows from ACTIVE_S toward its
  // stale window; past it the node is dropped in fleetBuild. Active files stay full; a floor keeps a
  // not-quite-stale one faintly visible. ONE definition, used by the dot AND the lines into it.
  function fleetAgeFade(n) {
    if (!n || n.type !== "file") return 1;
    if (n.age < F.ACTIVE_S) return 1;
    const fadeWin = (n.cnt && n.cnt.in_repo === false) ? F.STALE_NOREPO_S : F.STALE_S;
    return Math.max(0.15, 0.72 * (1 - (n.age - F.ACTIVE_S) / (fadeWin - F.ACTIVE_S)));
  }

  // DOTS SIT ON SEATS, NOT IN PHYSICS (JJ, 2026-09-28: "there is still this breathing … pulls all the
  // dots together, kind of overlapping, and then releases them"). Every data refresh re-warmed the sim;
  // the pull to the box centre won for a moment, then collision pushed the dots back out — a breath per
  // refresh. No tuning of three competing forces fixes that, so the dots left the simulation: each one
  // gets a fixed SEAT on a sunflower (golden-angle) spiral around its box centre, in the order it FIRST
  // appeared, so a new file takes the next seat outward and no other dot moves. Spacing comes from
  // the repo's biggest dot, so no two seats can overlap. The packer sizes its cells from the same
  // function, so the box drawn around the seats matches its cell.
  const DOT_GAP = 3, GOLDEN = Math.PI * (3 - Math.sqrt(5));
  function fleetSpiralC(dotRs) { return (Math.max(4, ...dotRs) + DOT_GAP) * 1.05; }   // spiral neighbours sit ~1.65c apart, so this still clears two of the biggest dots
  function fleetSeat(i, c) { const r = c * Math.sqrt(i + 0.5), a = i * GOLDEN; return [r * Math.cos(a), r * Math.sin(a)]; }
  function fleetBlobR(dotRs) {
    if (!dotRs.length) return 0;
    return fleetSpiralC(dotRs) * Math.sqrt(dotRs.length - 0.5) + Math.max(...dotRs) + 2;
  }

  function fleetSeparateBoxes() {
    const repos = F.nodes.filter(n => n.type === "repo");
    if (repos.length < 2) return;
    const filesOf = new Map(repos.map(r => [r.id, []]));
    for (const f of F.nodes) if (f.type === "file" && filesOf.has(f.repoId)) filesOf.get(f.repoId).push(f);
    // SEAT every dot (see fleetSpiralC above). A dot EASES to its seat rather than jumping, so a seat
    // that shifts (a stale file leaving compacts the order) slides smoothly; at rest nothing moves.
    const seq = F.dotSeq = F.dotSeq || { n: 0, of: new Map() };
    for (const r of repos) {
      if (r.fx != null) r.x = r.fx; if (r.fy != null) r.y = r.fy;   // a pinned box IS at its pin
      const fs = filesOf.get(r.id);
      for (const f of fs) if (!seq.of.has(f.id)) seq.of.set(f.id, seq.n++);
      fs.sort((a, b) => seq.of.get(a.id) - seq.of.get(b.id));
      const c = fleetSpiralC(fs.map(f => f.dotR || 4));
      fs.forEach((f, i) => {
        const [sx, sy] = fleetSeat(i, c), tx = r.x + sx, ty = r.y + sy;
        const far = Math.hypot(tx - f.x, ty - f.y) > 400;   // a brand-new node far away: place it outright
        f.x = far ? tx : f.x + (tx - f.x) * 0.2; f.y = far ? ty : f.y + (ty - f.y) * 0.2; f.vx = 0; f.vy = 0;
      });
    }
    const boxOf = (r) => {
      const fs = filesOf.get(r.id); if (!fs.length) return null;
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const f of fs) { const d = f.dotR || 4; x0 = Math.min(x0, f.x - d); y0 = Math.min(y0, f.y - d); x1 = Math.max(x1, f.x + d); y1 = Math.max(y1, f.y + d); }
      const lbl = String(r.repo).length * 6.3 + 12;
      return { x0: x0 - 10, y0: y0 - 24, x1: Math.max(x1 + 10, x0 - 10 + lbl), y1: y1 + 10 };
    };
    const move = (r, dx, dy) => {
      // REMEMBER the push (sepDX/sepDY), so fleetBuild re-pins the box at its separated spot rather than
      // its original slot on the next data refresh — otherwise the two fight every ~2s and the dots,
      // dragged back and forth, smear across a stretched box.
      r.sepDX = (r.sepDX || 0) + dx; r.sepDY = (r.sepDY || 0) + dy;
      if (r.fx != null) r.fx += dx; if (r.fy != null) r.fy += dy; r.x += dx; r.y += dy;
      for (const f of filesOf.get(r.id)) { f.x += dx; f.y += dy; }
    };
    const G = 14;
    for (let pass = 0; pass < 6; pass++) {
      let moved = false;
      for (let i = 0; i < repos.length; i++) for (let j = i + 1; j < repos.length; j++) {
        const A = boxOf(repos[i]), B = boxOf(repos[j]); if (!A || !B) continue;
        if (A.x1 + G <= B.x0 || B.x1 + G <= A.x0 || A.y1 + G <= B.y0 || B.y1 + G <= A.y0) continue;
        const right = (B.x0 + B.x1) >= (A.x0 + A.x1), down = (B.y0 + B.y1) >= (A.y0 + A.y1);
        const dx = right ? (A.x1 + G - B.x0) : -(B.x1 + G - A.x0);
        const dy = down ? (A.y1 + G - B.y0) : -(B.y1 + G - A.y0);
        if (Math.abs(dx) <= Math.abs(dy)) move(repos[j], dx, 0); else move(repos[j], 0, dy);
        moved = true;
      }
      if (!moved) break;
    }
  }

  function fleetFit() {
    const c = F.canvas; if (!c) return;
    const W = c.clientWidth || 1, H = c.clientHeight || 1;
    // bbox (to shrink if the graph would overflow) … In the TOP-ROW layout the agents are a fixed
    // screen strip, NOT on the canvas, so fit ONLY the repos + files (JJ, 2026-09-21: "the part that's
    // zoomable and movable is just the repos").
    const skipAgents = F.layout === "toprow";
    let a = 1e9, b = 1e9, d = -1e9, e = -1e9;
    for (const n of F.nodes) { if (skipAgents && n.type === "agent") continue; const r = n.r || n.dotR || 8;
      a = Math.min(a, n.x - r); b = Math.min(b, n.y - r); d = Math.max(d, n.x + r); e = Math.max(e, n.y + r); }
    // FIT THE DRAWN REPO BOXES, not just their dots (JJ, 2026-09-28: "why there are still collisions in
    // between repos" — a screenshot showed a long-named repo running off the right edge, under the
    // transcript). The render draws each box LEFT-anchored and at least as wide as its NAME, plus a title
    // row on top, so a long name like `some-service-enterprise-deploy` extends the box well past its file
    // dots — which is all this bbox used to measure. Mirror the render's box in world units (11px label,
    // ~6.3 world px per char at k=1) so the fit frames the whole box.
    for (const n of F.nodes) { if (n.type !== "repo") continue;
      const files = F.nodes.filter(f => f.type === "file" && f.repoId === n.id); if (!files.length) continue;
      let x0 = 1e9, y0 = 1e9, x1 = -1e9;
      for (const f of files) { const r = f.dotR || 4; x0 = Math.min(x0, f.x - r); y0 = Math.min(y0, f.y - r); x1 = Math.max(x1, f.x + r); }
      const pad = 10, cap = 22, lblW = String(n.repo).length * 6.3 + 12;
      a = Math.min(a, x0 - pad); b = Math.min(b, y0 - cap - 2);
      d = Math.max(d, x0 - pad + Math.max(x1 - x0 + pad * 2, lblW));
    }
    if (a > d) { a = -F.rhub; b = -F.rhub; d = F.rhub; e = F.rhub; }
    if (F.layout === "toprow" && F.packBox) ({ x0: a, y0: b, x1: d, y1: e } = F.packBox);
    if (F.layout === "toprow") {
      // Reserve a strip at the top for the fixed agent row, then FILL the space below it with the repos
      // (JJ, 2026-09-21: "so that the repos have more space"). Centre the repo block in that lower area.
      // … and the bottom timeline strip (agent / you lanes, ~36px) overlays the stage, so reserve it too
      // or the last row of boxes renders underneath it.
      // Each extra wrapped agent row (fleetRowGeom) pushes the repo area down by one card + gap.
      const g = fleetRowGeom(W, ($orbs && $orbs.querySelectorAll(".laneorb").length) || 1);
      // In liaison mode the strip is the hierarchy (spec 038), whose height is its own geometry's.
      const TOP = Object.keys(liaisons).length
        ? liaisonGeom(W, liaisonGroups(lanes, liaisons)).height + (W < 600 ? 10 : 14)
        : (W < 600 ? 54 : 76) + (g.rows - 1) * (g.CARDH + g.GAP);
      const BOT = 40, pad = W < 600 ? 24 : 48, availH = Math.max(80, H - TOP - BOT);   // reserve just the top-aligned agent strip (~y8..64; ~y4..48 on a phone); repos fill the rest
      const k = Math.min((W - pad) / Math.max(d - a, 1), (availH - pad) / Math.max(e - b, 1), 1.8);
      F.view.k = k;
      F.view.cx = W / 2 - ((a + d) / 2) * k;
      F.view.cy = TOP + availH / 2 - ((b + e) / 2) * k;
      return;
    }
    const pad = 60;
    const fitK = Math.min((W - pad) / Math.max(d - a, 1), (H - pad) / Math.max(e - b, 1), 1.4);
    // … but DON'T fill the viewport by default (JJ, 2026-09-19: agents closer, repos closer). Target
    // a fixed agent-ring screen radius so the cluster stays TIGHT and the repos sit just outside it,
    // with margin around — only zoom out further if the graph would otherwise overflow.
    const compactK = 168 / Math.max(F.rhub, 1);
    F.view.k = Math.min(fitK, compactK);
    // Centre on the AGENT cluster (the ring is centred at the origin), so the agents sit in the middle
    // and the repos fan out around them, rather than centring on the full bbox (which the far repos
    // pull off to one side).
    F.view.cx = W / 2;
    F.view.cy = H / 2;
  }

  // THE AGENT ROW WRAPS when the cards would get too narrow to read (JJ, 2026-10-07, seven agents on
  // the phone: "the responsiveness should make the agents break out into a new row … especially when
  // the cards don't have enough width"). The 2026-09-25 rule forced ONE row on a phone with a 40px
  // floor, which at seven agents cut names to two letters. Now a card never goes below MINW; the row
  // count is the fewest that respects it, and the cards are then spread EVENLY over those rows (7 →
  // 4 + 3, not 6 + 1). `fleetFit` reads the same geometry so the repos start below the last row.
  function fleetRowGeom(W, n) {
    const narrow = W < 600;
    const L = narrow ? 2 : 4, R = L, GAP = narrow ? 4 : 8, CARDH = narrow ? 44 : 56, TOPM = narrow ? 4 : 8;
    const MINW = narrow ? 84 : 96;
    const fit = Math.max(1, Math.floor((W - L - R + GAP) / (MINW + GAP)));
    const rows = Math.ceil(n / Math.min(fit, n));
    const cols = Math.ceil(n / rows);
    const cardW = (W - L - R - (cols - 1) * GAP) / cols;
    return { L, GAP, CARDH, TOPM, rows, cols, cardW };
  }

  // THE HIERARCHY STRIP (spec 038): one COLUMN per liaison, its card big across the column's full width,
  // its workers as small chips flowing beneath it. Pure (W + groups in, boxes out) so a harness can
  // check it without a page; `fleetFit` reads `height` so the repos start below the strip.
  function liaisonGeom(W, groups) {
    const narrow = W < 600;
    const L = narrow ? 2 : 4, GAP = narrow ? 4 : 8, TOPM = narrow ? 4 : 8;
    const LEADH = narrow ? 52 : 66, CHIPH = narrow ? 22 : 24, CHIPW = narrow ? 76 : 104;
    const n = Math.max(1, groups.length);
    const colW = (W - 2 * L - (n - 1) * GAP) / n;
    const pos = {};
    let height = TOPM + LEADH;
    groups.forEach((g, i) => {
      const x0 = L + i * (colW + GAP);
      pos[g.lead] = { x: x0 + colW / 2, y: TOPM + LEADH / 2, w: colW, h: LEADH };
      const per = Math.max(1, Math.floor((colW + GAP) / (CHIPW + GAP)));
      const cw = (colW - (per - 1) * GAP) / per;
      g.workers.forEach((name, j) => {
        const r = Math.floor(j / per), c = j % per;
        pos[name] = { x: x0 + c * (cw + GAP) + cw / 2,
                      y: TOPM + LEADH + GAP + r * (CHIPH + GAP) + CHIPH / 2, w: cw, h: CHIPH };
      });
      const rows = Math.ceil(g.workers.length / per);
      if (rows) height = Math.max(height, TOPM + LEADH + rows * (CHIPH + GAP));
    });
    return { pos, height };
  }
  diag.liaisonGeom = liaisonGeom;

  function fleetPlaceCards() {
    if (!$orbs) return;
    const cards = [...$orbs.querySelectorAll(".laneorb")];
    if (F.layout === "toprow" && Object.keys(liaisons).length) {
      const W = (F.canvas && F.canvas.clientWidth) || 1200;
      const { pos } = liaisonGeom(W, liaisonGroups(lanes, liaisons));
      for (const el of cards) {
        const p = pos[el.dataset.lane];
        const node = F.byId.get("agent:" + el.dataset.lane);
        if (!p) { el.style.display = "none"; continue; }
        el.style.display = "";
        el.style.width = Math.round(p.w) + "px";
        el.style.height = Math.round(p.h) + "px";
        el.style.transform = "translate(" + Math.round(p.x) + "px, " + Math.round(p.y) + "px) translate(-50%, -50%)";
        if (node) { node._sx = p.x; node._sy = p.y; }   // edges still start at the agent's card
      }
      return;
    }
    for (const el of cards) { el.style.height = ""; el.style.display = ""; }
    if (F.layout === "toprow") {
      // Agents in a FIXED single row pinned at the top, OFF the pan/zoom canvas (JJ, 2026-09-21). The
      // row TOP-aligns with the transcript column's top and the cards GROW to span the full stage width
      // (JJ, 2026-09-21: "agents higher up, aligned to the transcript top; grow their width so they
      // span the full row, from the very left to the beginning of the transcript column"). #orbs is
      // inset:0 of #stage, and #stage is grid-column 1 with the transcript (#log) as grid-column 2 — so
      // x = 0..W already runs from the left edge to the transcript column; the cards just need to FILL
      // it instead of sitting centred, and sit at the very top instead of a title's-worth below it.
      const W = (F.canvas && F.canvas.clientWidth) || 1200, n = cards.length || 1;
      // Below 600px the gaps/margins tighten and the CSS trims the card insides to match; the row
      // wraps rather than squeezing (fleetRowGeom).
      const { L, GAP, CARDH, TOPM, cols, cardW } = fleetRowGeom(W, n);
      cards.forEach((el, i) => {
        const node = F.byId.get("agent:" + el.dataset.lane);
        const r = Math.floor(i / cols), c = i % cols;
        const x = L + cardW / 2 + c * (cardW + GAP);
        const y = TOPM + CARDH / 2 + r * (CARDH + GAP);   // first row's TOP edge at the transcript top
        el.style.width = Math.round(cardW) + "px";   // GROW the card — width only (scale would grow height too)
        el.style.transform = "translate(" + Math.round(x) + "px, " + Math.round(y) + "px) translate(-50%, -50%)";
        if (node) { node._sx = x; node._sy = y; }   // screen position for the edge draw
      });
      return;
    }
    const cs = Math.max(0.55, Math.min(1.6, F.view.k));   // cards scale with the zoom, clamped readable
    for (const el of cards) {
      const n = F.byId.get("agent:" + el.dataset.lane); if (!n) continue;
      el.style.width = "";   // revert the toprow width override so the CSS 130px applies in the cluster
      const sx = SX(n.x), sy = SY(n.y);
      el.style.transform = "translate(" + Math.round(sx) + "px, " + Math.round(sy) + "px) translate(-50%, -50%) scale(" + cs.toFixed(3) + ")";
      n._sx = sx; n._sy = sy;   // screen position for the edge draw
    }
  }

  function fleetRender() {
    F.raf = 0;
    if (!fleetOn() || !F.ctx) return;
    const c = F.canvas, ctx = F.ctx, sim = F.sim, dpr = Math.min(devicePixelRatio || 1, 2);
    const W = c.clientWidth, H = c.clientHeight;
    if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    let running = false;
    if (sim && sim.alpha() > 0.006) { sim.tick(); running = true;
      for (const n of F.nodes) { if (n.type === "agent") continue;
        const dd = Math.hypot(n.x, n.y); if (dd > 0.01 && dd < F.rforbid) { const s = F.rforbid / dd; n.x *= s; n.y *= s; n.vx = 0; n.vy = 0; } } }
    fleetSeparateBoxes();
    if (!F.userMoved) fleetFit();
    fleetPlaceCards();   // set agent screen positions (incl. the fixed top row) BEFORE the edges read them
    const t = (performance.now() - F.t0) / 1000;
    const sc = F.view.k;   // sizes scale WITH the zoom (JJ, 2026-09-18: zoom must resize, not just move apart)
    // repo bounding boxes — the box GROWS to fit its label so the repo name is always constrained in it.
    const rf = Math.max(8, Math.round(11 * sc));

    let pinch = null;        // {d, mx, my} at the last pinch frame

    c.style.cursor = "grab";

      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2) { const m = mid(); pinch = { d: m.d, mx: m.x, my: m.y }; }

    });

      const wasOne = pts.size === 1;
      pts.delete(e.pointerId);

        else { lastTap = now; tapX = e.clientX; tapY = e.clientY; }

        // should be me tapping on a file, right?"). A touch has no pointer-over, so a single tap on a
        // file dot selects it exactly as hovering does — tooltip plus its edges lit to the agents that
        // touched it — and a tap on empty space clears it.
        const r = c.getBoundingClientRect();

    c.addEventListener("pointercancel", lift);
    c.addEventListener("pointerleave", (e) => { if (e.pointerType !== "touch") { pts.delete(e.pointerId); F.hover = null; fleetTip(null); } });

      const prev = pts.get(e.pointerId);

        // (JJ, 2026-09-24) — the tooltip names it, the highlighted lines show WHO worked on it.

        F.view.cy = sy - (sy - F.view.cy) * (nk / F.view.k) + (m.y - pinch.my);
        F.view.k = nk; F.userMoved = true;
        pinch = { d: m.d, mx: m.x, my: m.y };
      } else if (pts.size === 1) {
        F.view.cx += e.clientX - prev.x; F.view.cy += e.clientY - prev.y; F.userMoved = true;
      }
    });
    c.addEventListener("wheel", (e) => {
      e.preventDefault();
      const r = c.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
      const f = e.deltaY < 0 ? 1.12 : 1 / 1.12, nk = Math.max(0.2, Math.min(4, F.view.k * f));
      F.view.cx = sx - (sx - F.view.cx) * (nk / F.view.k);
      F.view.cy = sy - (sy - F.view.cy) * (nk / F.view.k);

    // The fleet LAYOUT picker was retired (JJ, 2026-09-24): settled on the fixed top row, so there is
    // no #lay select to wire any more — `F.layout` is the constant "toprow".
  }

    F.ctx = F.ctx || (F.canvas && F.canvas.getContext("2d"));

    const sig = F.nodes.map(n => n.id).sort().join("|");
    // A node joining or leaving only needs the NEW dot to find its place — every box is pinned now, so
    // a hard reheat (0.4) just made the blob pull overshoot and every dot shook for a few seconds after
    // each change (JJ, 2026-09-28: "they shake for a few seconds, then calm down"). Kick gently instead.

  }

  // body.fleet (and body.sharing, which the card styling is gated on) whenever there are >=2 lanes on
  // a wide screen, so the meeting screen is the objective fleet graph by default — no canvas frame
  // required (that was the old spec-016 trigger; the canvas is on-demand now). A solo session, or a
  // narrow screen (phone reflow is out of scope this spec), keeps the prior behaviour, so the /events
  // watcher still governs body.sharing there. The mock owns the class in a `?mock=` render.
  function applyFleetHome() {

  const MOCK_SCENARIOS = {
