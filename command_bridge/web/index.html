    // transcript — and dexter is an UNWATCHED background agent, which the page infers as "thinking"
    // (it went heads-down; we can only see its watch closed). That inferred-thinking lane must ALSO
    // carry the seconds counter — the 2026-09-02 fix — so it stays in the scenario as the check.
    meeting: {
      // `sharing` renders the MEETING layout deterministically from the URL alone (spec 016): the
      // canvas region + the lanes-over-transcript right column, with no drawn canvas frame needed.
      sharing: true,
      lanes: ["magnus", "atlas", "kepler", "dexter"], live: "kepler", default: "magnus",
      states: { kepler: "speaking", atlas: "thinking" }, watching: ["magnus"],
      turns: [
        { id: 1, lane: "magnus", text: "Join the two tools into one product.", addressed: true },
        { id: 2, lane: "kepler", text: "It fits — the parts already exist.", addressed: false },
        { id: 3, lane: "magnus", text: "Maximize the canvas, transcript on the right.", addressed: true },

    // shows the three motions side by side (big pulse / gentle undulation / flat breath).
    meeting2: {
      sharing: true, lanes: ["magnus", "atlas"], live: "magnus", default: "magnus",
      states: { magnus: "speaking" }, watching: ["atlas"],   // magnus live+speaking, atlas idle
      turns: [{ id: 1, lane: "magnus", text: "Two agents, one row of two.", addressed: true }],
    },
    meeting3: {
      sharing: true, lanes: ["magnus", "atlas", "kepler"], live: "kepler", default: "magnus",
      states: { kepler: "speaking", atlas: "thinking" }, watching: ["magnus"],
      // kepler live+speaking, atlas thinking, magnus watched-but-not-live → idle
      turns: [{ id: 1, lane: "kepler", text: "Three agents, one row of three.", addressed: false }],
    },
    meeting5: {
      sharing: true, lanes: ["magnus", "atlas", "kepler", "dexter", "orion"], live: "kepler",
      default: "magnus",
      // Every activity language at once: idle (flat), speaking (waveform), thinking (ping-pong sweep),
      // synthesizing (right→left sweep), transcribing (left→right sweep).
      states: { kepler: "speaking", atlas: "thinking", dexter: "synthesizing", orion: "transcribing" },
      watching: ["magnus"],
      turns: [{ id: 1, lane: "kepler", text: "Five agents lay out three then two.", addressed: false }],
    },
    // A one-agent, idle scenario for the solo layout.
    // fleet:true — a one-agent session is a row of one card now, like any other (2026-09-29)
    solo: { fleet: true, lanes: ["magnus"], live: "magnus", default: "magnus", states: {}, watching: ["magnus"],
            turns: [{ id: 1, lane: "magnus", text: "What's the status of the roadmap?", addressed: true }] },
    // THE UNHEARD-COUNT SPLIT (2026-09-22 idea #2), for a mic-less screenshot of the orb badges:
    //   magnus  regular 2 + intent 1  -> bright "2 +1", warm "wants you" highlight
    //   atlas   intent-only 2         -> DIM badge "2", NO warm highlight (nothing to divert for)
    //   dexter  regular 1             -> bright "1", warm highlight
    //   kepler  live, nothing waiting
    waitsplit: {
      sharing: true, lanes: ["magnus", "atlas", "kepler", "dexter"], live: "kepler", default: "magnus",
      states: { kepler: "speaking", atlas: "thinking" }, watching: ["kepler"],
      waiting: { magnus: 3, atlas: 2, dexter: 1 },
      waiting_split: { magnus: { regular: 2, intent: 1 }, atlas: { regular: 0, intent: 2 },

      turns: [
        { id: 1, lane: "magnus", text: "Split the unheard count into intent versus regular.", addressed: true },
        { id: 2, lane: "atlas", text: "On it — building the intent-versus-regular count.", addressed: false },
      ],
    },

    // the centre; each repo an agent touches orbits it as a cluster of file dots; read/edit/write is
    // chevron flow, git status the fill, recency the label fade. `fleet:true` selects the home layout;
    // `lane_activity` is what the server derives from git + the session logs (mocked here for a
    // mic-less render — server_epoch 1000, file `t` near it = active/lit, older = faded).

      fleet: true,
      lanes: ["magnus", "atlas", "kepler", "dexter", "orion", "vega"], live: "magnus",
      default: "magnus",
      states: { magnus: "speaking", atlas: "thinking", dexter: "synthesizing" },

          last_commit_epoch: 996, has_frame: true, files: {
            "D:/dev/command-bridge/command_bridge/web/index.html": { read: 2, edit: 18, write: 0, t: 999, repo: "command-bridge", in_repo: true, dirty: true },
            "D:/dev/command-bridge/command_bridge/server.py": { read: 1, edit: 9, write: 0, t: 993, repo: "command-bridge", in_repo: true, dirty: true },
            "D:/dev/command-bridge/command_bridge/fleet.py": { read: 0, edit: 2, write: 1, t: 985, repo: "command-bridge", in_repo: true, dirty: false } } },
        atlas: { counts: { read: 20, edit: 6, write: 1, bash: 12, search: 9, commits: 0 }, files: {
            "D:/dev/notes/Guide.md": { read: 8, edit: 3, write: 0, t: 991, repo: "notes", in_repo: true, dirty: true },

        kepler: { counts: { read: 4, edit: 0, write: 0, bash: 3, search: 2, commits: 0 }, files: {
            "D:/dev/api/run.py": { read: 4, edit: 0, write: 0, t: 942, repo: "api", in_repo: true, dirty: false } } },
        dexter: { counts: { read: 9, edit: 12, write: 2, bash: 20, search: 4, commits: 1 },
          last_commit_epoch: 999, files: {
            "D:/dev/notes/blog/draft.md": { read: 1, edit: 10, write: 1, t: 999, repo: "notes", in_repo: true, dirty: true } } },
        orion: { counts: { read: 2, edit: 0, write: 0, bash: 1, search: 0, commits: 0 }, files: {} },
        vega: { counts: { read: 0, edit: 0, write: 0, bash: 0, search: 0, commits: 0 }, files: {} },

    running = true;

  // failed connect or a missing token needs its error SEEN, and a slow server gets a 10 s ceiling.
  const endBoot = () => document.body.classList.remove("booting");

  } else {

    // screenshot shows the fleet as it really is, but never acquire the mic (the shell blocks start()).

  // shell answers the attach by asking the server for the ready frame again, so a reloaded UI
  // rebuilds its lanes from the server and its audio state from `cbShell.state` — and shows exactly
  // what it showed before the reload. Detached on the way out, so the shell never calls into a page
  // that is gone.

  // this paints them and hands his pick back to the app. Hidden with fewer than two outputs: a control
  // offering no choice is not a control (the device pickers' rule).
  const $routepick = document.getElementById("routepick");

    $approute.replaceChildren(...list.map((o) => {
      const opt = document.createElement("option");

      opt.textContent = String(o.label || o.type);

    if (r && r.current != null) $approute.value = String(r.current);

  }
  if ($approute) $approute.addEventListener("change", (e) => { if (SH) SH.setNativeRoute(e.target.value); });

  const hooks = {
    message: (data) => onMessage({ data }),
    applyOrb, applyLaneOrbs, devicesChanged, refreshDevices, nativeRoutes,
    setError: paintError,
    clipQueued, clipStarted, clipEnded,
    forgetAgentState: () => { agentState = "idle"; },
    // A SHELL change waiting for the orb to go off (FR6) shows as the amber dot on the power button.
    updateWaiting: (on) => { document.documentElement.dataset.updateWaiting = on ? "1" : ""; },
  };
  if (SH) {
    SH.attach(hooks);
    window.addEventListener("pagehide", () => SH.detach(hooks));
    refreshDevices("attach");
  }
  applyOrb();
})();

  // layout the mock just set. The real (non-mock) session is unchanged (spec 016 FR5).
  var isMock = new URLSearchParams(location.search).has("mock");

    // 2026-09-25, phone included — and drives body.sharing itself (by lane count, not canvas frames),
    // with the canvas on-demand — so defer here rather than toggle sharing off when no frame is drawn.

  // new URL bypasses the http cache AND the bfcache, so the iframe's stream and its render come back
  // with no manual refresh. Harmless if the iframe was already fine (one extra reload); the camera

  // new page. The event names the signature of this file as it is on disk now; this page was served
  // stamped with its own, so a mismatch is the one thing that means "you changed". That holds after

  // itself is the shell's to handle, held until the orb is off; a canvas change, the canvas's.)
