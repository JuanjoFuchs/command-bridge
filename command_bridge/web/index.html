  // turns AND agent replies both flow through addRow, so both are captured; transient partials never
  // reach addRow, and the read-boundary divider re-places itself from the server's `consumed`, so
  // neither is persisted.
  const LOG_KEY = "command-bridge.log";
  const LOG_MAX = 200;                                  // keep the newest rows so storage cannot grow without bound
  let logRows = [];
  let logSaveT = null;
  function writeLog() { try { localStorage.setItem(LOG_KEY, JSON.stringify(logRows.slice(-LOG_MAX))); } catch (_) {} }
  function saveLog() { clearTimeout(logSaveT); logSaveT = setTimeout(writeLog, 400); }
  function restoreLog() {
    let saved; try { saved = JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch (_) { saved = []; }
    if (!Array.isArray(saved) || !saved.length) return;
    logRows = saved.slice(-LOG_MAX);                    // adopt as the running history so live saves keep it
    for (const r of logRows) addRow(r.tag, r.text, r.cls, r.id, r.lane, true);
    scrollToEnd();
  }
  window.addEventListener("pagehide", writeLog);        // flush before a reload/navigation the debounce would miss

  // THE SAVED ROWS BELONG TO ONE SESSION (JJ, 2026-10-13, after a restart onto `serve --session demo`:
  // *"The transcript panel is not filtered to the session. It's showing the previous session."*). The
  // store above is per-browser, not per-session, so it replayed the old session's rows — and their turn
  // ids, which the new session reuses from 0, so addRow's dedup then swallowed the new session's turns.
  // `ready` names the session; a saved log from any other session (or an older build that never
  // recorded one) is dropped before `/history` rebuilds. Pure so the test runs the shipped rule.
  const LOG_SESSION_KEY = "command-bridge.log.session";
  function logBelongsTo(savedSession, session) {
    return !session || savedSession === session;
  }
  function adoptLogSession(session) {
    let saved = null; try { saved = localStorage.getItem(LOG_SESSION_KEY); } catch (_) {}
    if (logBelongsTo(saved, session)) return;
    $log.querySelectorAll(".row").forEach(n => n.remove());
    logRows = [];
    writeLog();
    try { localStorage.setItem(LOG_SESSION_KEY, session); } catch (_) {}
  }

  // THE SERVER'S TRANSCRIPT WINS OVER THIS DEVICE'S (JJ, 2026-09-25, on the phone after the laptop:
  // "the turns that I did while in the computer are not showing up here, why"). The saved rows above
  // are only what THIS browser happened to see live, so a second device showed a stale, one-sided
  // conversation. `/history` returns his turns and the agents' spoken replies from disk; on every
  // connect the log is rebuilt from it (localStorage stays as the instant, offline first paint).
  // Keys match the live rows' ids — his turn id, `c:<clip id>` for a reply — so nothing doubles.
  async function loadHistory() {
    let rows;
    try {
      const r = await fetch("/history" + location.search);
      if (!r.ok) return;
      rows = (await r.json()).rows;
    } catch (_) { return; }
    // An EMPTY answer is still an answer: a fresh session has no history, and keeping the rows this
    // browser saved would show him a different session's conversation (2026-10-13).
    if (!Array.isArray(rows)) return;
    $log.querySelectorAll(".row").forEach(n => n.remove());
    logRows = [];
    // HISTORY IS NOT NEWS: replayed rows must not pop bubbles (JJ, 2026-09-29: "whenever I reload …
    // my bubbles appear, like all of them, for a moment and then they disappear").
    bubblesMuted = true;
    try {
    for (const h of rows) {
      if (h.from === "agent") {
        addRow(tagView({ from: "agent", lane: h.lane, lanes, fallback: defaultLane }),
               h.text, "claude", h.key, h.lane || defaultLane);
      } else {
        addRow(tagView({ from: "you", addressed: h.addressed, lanes, fallback: defaultLane,
                         ...(h.lane ? { lane: h.lane } : {}) }),
               h.text, h.addressed ? "addressed" : "", h.id, h.lane || defaultLane);
      }
    }
    } finally { bubblesMuted = false; }
    recolorRows();
    placeDivider();
  }

  // The read boundary lives INSIDE the log, sitting after the last turn claude has consumed —
  // so anything below the line is visibly still unread. Same idea as mc view's
  // "agent consumed through #N" divider: a position in the transcript says more than a count
  // floating above it, because you can see WHICH turns are still waiting.
  // WHAT HAPPENED TO ONE TURN (spec 013 FR7) — a PURE function, asserted without a browser.
  //
  // JJ, 2026-08-24: *"once it's sent, it's one check. Once it arrives to the destination, it's two
  // checks. And once the recipient has read the message, the two checks turn blue. I would like
  // something similar, but respecting this design."*
  //
  // ⚠ **"Delivered" and "read" are the same event in this tool** — a `watch` hands a turn over AND
  // moves the cursor — so mapping them naively would make two ticks and blue ticks rise together
  // and one of the three states would never be seen. The honest third state is ANSWERING: the
  // cursor proves an agent was given it, a clip spoken afterwards proves something was done with
  // it. That is the difference he actually wants to see, and the only one this tool can prove.
  function receiptView(m) {
    if (m.id === undefined || m.id === null) return { state: "", ticks: "" };
    if (m.consumed !== undefined && m.consumed !== null && m.id <= m.consumed) {
      return { state: "read", ticks: "✓", aria: "read" };
    }
    return { state: "sent", ticks: "✓", aria: "sent" };
  }

  // Paint a receipt onto every one of HIS rows. Agent rows carry none — a receipt is about
  // whether the other side got it, and he knows what he heard.
  // 🔴 A RECEIPT IS ABOUT ONE LANE, so it is read against THAT lane's cursor (spec 015 FR1).
  //
  // It used to use the session-wide `consumed`, which is a single integer overwritten by whichever
  // lane's watch reported last — so Atlas reading turn 2510 painted Claude's earlier turns blue,
  // turns Claude was never given. JJ caught it on the page: *"whenever one lane reads, I think
  // we're marking everything as read."*
  //
  // ⚠ **A turn with no lane falls back to the session cursor**, which is exactly right for the
  // thousands of turns that predate lanes: there was one reader then, and the session-wide number
  // is that reader's cursor.
  function consumedFor(lane) {
    if (lane && laneConsumed[lane] !== undefined) return laneConsumed[lane];
    if (lane && lanes.length >= 2) return -1;   // a lane we have no cursor for has read nothing
    return diag.consumed;
  }

  // HIS TURNS AN AGENT HAS NOT READ YET, per lane (JJ, 2026-09-29: "similar to the way we track the
  // dots … we should have similar one to track the turns that I spoke and the agent hasn't read yet.
  // Because now that we don't have the transcript fully visible all time, once one of these ephemeral
  // bubbles disappears … I don't know if an agent has … read my turn"). The mirror of the waiting badge:
  // that one counts the agent's clips HE hasn't heard, this counts HIS turns the AGENT hasn't read. Same
  // source as the ticks below (a row's id against its lane's consumed cursor), so the card and the
  // transcript can never disagree. Recounted on every receipt pass; the card row repaints only when a
  // count actually changes.
  let laneUnread = {};
  function paintReceipts() {
    const unread = {};
    $log.querySelectorAll(".row.addressed").forEach((row) => {
      const id = Number(row.dataset.id);
      if (!Number.isFinite(id)) return;
      const v = receiptView({ id, consumed: consumedFor(row.dataset.lane) });
      if (v.state === "sent" && row.dataset.lane) unread[row.dataset.lane] = (unread[row.dataset.lane] || 0) + 1;
      const cell = row.querySelector(".text") || row;
      let tick = row.querySelector(".tick");
      if (!v.ticks) { if (tick) tick.remove(); return; }
      if (!tick) {
        tick = document.createElement("span");
        tick.className = "tick";
        cell.appendChild(tick);
      }
      tick.textContent = v.ticks;
      tick.dataset.state = v.state;
      tick.setAttribute("aria-label", v.aria);
    });
    if (JSON.stringify(unread) !== JSON.stringify(laneUnread)) { laneUnread = unread; applyLaneOrbs(); }
  }

  // 🔴 **THE READ-BOUNDARY DIVIDER IS GONE**, and the per-turn tick replaced it outright.
  //
  // JJ, 2026-08-24: *"I think we should remove the red to here line as well. That's redundant
  // now."* He is right — the divider marked ONE position for ONE reader, which stopped being a
  // coherent thing to draw the moment three agents shared the log. A tick per turn says the same
  // thing per turn, and says it for whichever lane the turn belongs to.
  //
  // The name is kept because three call sites read better with it; all it does now is repaint.
  function placeDivider() {
    paintReceipts();
    scrollToEnd();
  }

  // --- the two toggles -------------------------------------------------------
  // Both persist in localStorage. Losing your mute on a reload means the room gets streamed
  // again without anyone deciding to; losing verbose means being asked to re-toggle a
  // preference, which is the friction it exists to remove.

  // `tellServer`, the speaking signal and the synthetic-capture hook live in the shell, with the
  // socket and the microphone they act on.

  function setMuted(next) {
    muted = Boolean(next);
    // sessionStorage, NOT localStorage — mute is SESSION state, not a device preference.
    // Reported 2026-08-11. It survives a reload, which matters because he refreshes constantly
    // mid-conversation and re-muting every time would be its own annoyance; it does NOT survive
    // closing the tab. He shut the laptop on a Saturday and opened it Monday still muted, on a
    // page that otherwise looked live — deaf, with no event to explain why.
    //
    // The distinction that decides it: a PREFERENCE describes how you always want the tool
    // (verbose, speech rate, voice) and should outlive everything. STATE describes what is true
    // right now (muted, channel open) and outliving its moment is what makes it a trap.
    sessionStorage.setItem("command-bridge.muted", muted ? "1" : "0");
    // The server is told so `command-bridge status` can say "he has himself muted" — otherwise a silent
    // tunnel and a muted one look identical from the agent's side, and the agent goes hunting
    // for a broken microphone that is working perfectly.
    tellServer("muted", muted);
    $mute.setAttribute("aria-checked", String(muted));
    if (muted) { levelTarget = 0; tellServer("speaking", false); }
    applyOrb();
  }

  // The orb, as a PURE FUNCTION of the model. No DOM, no globals, no side effects — which is
  // the whole point: this is the part that kept breaking, and a function with inputs and a
  // return value is the part that can be unit-tested exhaustively. Exposed on `diag` so the
  // harness can drive the entire state matrix in milliseconds without a microphone.
  //
  // Precedence, outermost first, and each layer is answering a different question:
  //   not running  -> there is no session yet; nothing else is meaningful
  //   warming      -> the mic is open but no audio has arrived; claiming "Listening" here invites
  //                   him to talk into a gap, which is very likely why a first utterance garbles
  //   channel off  -> he shut the conversation; the agent's state is not his concern right now
  //   playing      -> the CLIENT knows when audio starts and stops; the server only knows when it
  //                   finished sending, and letting both write the label made them race
  //   otherwise    -> whatever the agent is doing, with MUTED replacing only the idle label
  //
  // Mute changes exactly one thing and never anything else. It is not a colour, not a glow, and
  // not a state of its own — the mute button carries that. Reported 2026-08-07.
  const ORB_LABELS = {
    idle: "Listening", transcribing: "Transcribing", thinking: "Thinking",
    synthesizing: "Synthesizing", waiting: "Waiting", speaking: "Speaking",
  };
  const TIMED_STATES = ["transcribing", "thinking", "synthesizing", "waiting"];

  function orbView(m) {
    // A REFUSED MICROPHONE SAYS SO ON THE ORB, not only on the error line. A tap that silently
    // returns the orb to "Tap to start" is indistinguishable from a tap that never registered,
    // and that ambiguity cost a live session on 2026-08-07 ("tap to start does not work"). The
    // orb is where he is already looking; the failure belongs there.
    if (m.phase === "denied") return { label: "No mic", timer: null };
    // OFF AND NEVER-STARTED LOOK THE SAME TO `running` AND ARE NOT THE SAME THING. Since
    // 2026-08-16 the orb releases the microphone when he switches it off, so `running` is false in
    // both cases; `everStarted` is the only fact that separates "he turned it off" from "this page
    // has never been live". Absent (an old harness sweeping the model) reads as never-started,
    // which is the previous behaviour exactly.
    if (!m.running) {
      const label = m.phase === "starting" ? "Starting" : m.everStarted ? "Off" : "Tap to start";
      return { label, timer: null };
    }
    if (m.phase === "warming") return { label: "Warming up", timer: null };
    if (!m.channelOpen) return { label: "Off", timer: null };
    if (m.playing) return { label: "Speaking", timer: null };
    const state = m.agentState || "idle";
    const label = state === "idle" ? (m.muted ? "Muted" : "Listening")
                                   : (ORB_LABELS[state] || "Listening");
    return { label, timer: TIMED_STATES.includes(state) ? state : null };
  }

  // ---------------------------------------------------------------- lanes (spec 012)
  //
  // Several agents, one microphone, one transcript. The same discipline as the orb, for the same
  // reason: a PURE reducer plus exactly one painter. The orb once read "Thinking" with no clock
  // because four handlers painted it independently and nothing in the suite could see that; a
  // strip with one row per agent has more ways to go quietly wrong, not fewer.
  let lanes = [];            // registered agent lanes, in registration order
  let liveLane = null;       // who he is talking to
  let laneWaiting = {};      // lane -> how many clips it is holding
  let laneWaitingSplit = {}; // lane -> {intent, regular} — the same backlog split (2026-09-22 idea #2)
  let laneStates = {};       // lane -> idle | transcribing | thinking | synthesizing | speaking
  let broadcastLane = "everyone";
  // The lane a turn with NO `lane` key belongs to — the name the server was started as. Thousands
  // of turns predate lanes, and rendering them as addressed to nobody would rewrite the history
  // he scrolls back through.
  let defaultLane = null;
  // Per lane, the highest turn id it had in hand when it last spoke — the blue tick (013 FR7).
  let laneReadThrough = {};
  // How far EACH lane has read — the receipt's cursor, per reader (spec 015 FR1).
  let laneConsumed = {};
  // Which lanes are sitting in a `watch` right now — the server's own answer, not a guess.
  let watchingLanes = [];

  const LANE_BUSY = ["transcribing", "thinking", "synthesizing", "speaking"];

  function lanesView(m) {
    const names = (m.lanes || []).slice();
    const broadcast = m.broadcast || "everyone";
    // BELOW TWO AGENTS THERE IS NO CHOICE TO OFFER. One agent plus "everyone" is the same
    // destination twice, so the row would be decoration occupying a line of a phone screen —
    // the exact rule the device pickers already follow, and the reason a single-agent session
    // looks precisely as it did before lanes existed.
    const shown = names.length >= 2;
    const rows = names.map((name) => {
      const state = m.states && m.states[name] ? m.states[name] : "idle";
      const waiting = (m.waiting && m.waiting[name]) || 0;
      // The intent/regular split (2026-09-22 idea #2). Degrades to all-regular with no split.
      const split = (m.waitingSplit && m.waitingSplit[name]) || null;
      const waitingRegular = split ? (split.regular || 0) : waiting;
      const waitingIntent = split ? (split.intent || 0) : 0;
      const live = name === m.live;
      return {
        name,
        live,
        waiting,
        waitingRegular,
        waitingIntent,
        state,
        busy: LANE_BUSY.includes(state),
        // The label is built HERE, not in the painter, so a harness can assert what the row says
        // without a browser. Same argument as `orbView` returning its own label.
        label: name,
        // WHAT THIS AGENT IS DOING, IN WORDS (spec 013 FR5). The dot already carried `busy`, and
        // a dot that is either on or off cannot answer the question he actually asked:
        // *"I should know if an agent is listening or thinking or something else."* A binary
        // indicator collapses four distinct states into one, so the state has to be said.
        //
        // ⚠ **`waiting` outranks the state**, because a held clip is the one thing he can act on:
        // *"I need a way to know that an agent is trying to talk to me so that I can divert my
        // attention to that agent."* An agent that is thinking wants nothing from him; an agent
        // holding speech does.
        // "wants you" keys off REGULAR only — an intent-only backlog is not something to divert to.
        stateLabel: waitingRegular ? "wants you" : (state && state !== "idle" ? state : ""),
        // What a screen reader is told, which has to carry everything the colour carries.
        aria: name + (live ? ", live" : "")
              + (waitingRegular ? ", " + waitingRegular + " waiting to be heard" : "")
              + (waitingIntent ? ", " + waitingIntent + " intent" : "")
              + (state && state !== "idle" ? ", " + state : ""),
      };
    });
    // The broadcast lane is a DESTINATION, never a participant: it has no state of its own and
    // can hold nothing, because anything said to everyone is said to the live lane too.
    rows.push({
      name: broadcast, live: m.live === broadcast, waiting: 0, waitingRegular: 0, waitingIntent: 0,
      state: "", busy: false,
      label: "everyone", broadcast: true,
      aria: "everyone" + (m.live === broadcast ? ", live" : ""),
    });
    return { shown, rows };
  }

  // ONE painter, and the ONLY thing allowed to touch the strip.
  function applyLanes() {
    recolorRows();   // keep the transcript's per-lane hues in sync with the current lanes (and the cards)
    applyLogScope(); // spec 026: the transcript follows the live lane
    const view = lanesView({ lanes, live: liveLane, waiting: laneWaiting, waitingSplit: laneWaitingSplit,
                             states: laneStates, broadcast: broadcastLane });
    $lanes.hidden = !view.shown;
    diag.lanes = view;
    if (!view.shown) { $lanes.replaceChildren(); return; }
    $lanes.replaceChildren(...view.rows.map((row) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.lane = row.name;
      b.classList.toggle("live", row.live);
      b.classList.toggle("waiting", row.waitingRegular > 0);
      b.setAttribute("aria-pressed", String(row.live));
      b.setAttribute("aria-label", row.aria);
      const dot = document.createElement("span");
      dot.className = "dot" + (row.busy ? " busy" : "");
      b.append(dot, document.createTextNode(row.label));
      if (row.stateLabel) {
        const st = document.createElement("span");
        st.className = "st";
        st.textContent = row.stateLabel;
        b.append(st);
      }
      if (row.waitingRegular > 0) {
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = String(row.waitingRegular);
        b.append(n);
      }
      if (row.waitingIntent > 0) {
        const ni = document.createElement("span");
        ni.className = "ni";
        ni.textContent = (row.waitingRegular ? "+" : "") + row.waitingIntent;
        b.append(ni);
      }
      return b;
    }));
  }

  // A TAP IS THE OTHER HALF OF THE SWITCH, never a replacement for it. He refused being REQUIRED
  // to tap, not the tap itself, so this exists for when his hands are free and the voice path
  // stays the one that works when they are not.
  $lanes.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-lane]");
    if (!btn) return;
    const name = btn.dataset.lane;
    if (name === liveLane) return;      // tapping where you already are is not a switch
    // Optimistic, then corrected by the server's own broadcast. The alternative — waiting for the
    // round trip to repaint — makes his own tap feel like it did not register, which is the
    // ambiguity the orb's "No mic" label exists to kill.
    liveLane = name;
    applyLanes(); applyLaneOrbs();
    fetch("/lane" + location.search, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "switch", name }),
    }).catch(() => {});
  });

  // ================= spec 014: ONE ORB PER AGENT ==================================
  //
  // JJ, 2026-08-24, after an hour with three agents: *"now that we have multiple lanes and I can
  // talk to multiple agents, I think having a single orb in the middle makes no sense… gives each
  // lane its own orb with the same functionality and same behaviors that the current middle orb
  // has."* Chosen against a clickable preview (`scripts/uipreview.py`, arrangement C) rather than
  // a description, and the reason it wins is not the pixels: with one centre orb, "which agent is
  // this" is a label on a shape that means something else. With one orb each it cannot be asked.

  // COLOUR IS IDENTITY, NEVER STATUS (FR5) — his ruling: *"we shouldn't make the colors represent
  // the statuses, because the statuses are represented within the orb."*
  //
  // Deterministic by POSITION so two devices watching one session agree without the server holding
  // a preference. ⚠ TC3: these differ in lightness as well as hue, so they survive the common
  // colour blindnesses and hold 4.5:1 on the page's light ground. TC4: the list repeats rather than
  // running out, and name plus position still separate lanes past its length.
  // 🔴 EVERY ORB COUNTS ITS OWN SECONDS. Reported live 2026-08-24, minutes after the row shipped:
  // *"I no longer see the seconds counter, the timer, whenever you're doing something. I think
  // that should display… whenever they're doing something."*
  //
  // The timer was a child of the single orb, so replacing that orb silently took it away — a
  // regression no harness caught, because `orbView` still returns its `timer` and the golden still
  // matches. **The model was intact and the thing that showed it was gone.**
  //
  // ⚠ **Per lane, not just the live one**, which is what he asked for and is also the only version
  // that means anything now: a background agent thinking for ninety seconds is exactly the thing
  // the number exists to make visible, and it is the one the old single orb could never show.
  // Timed client-side from the state change, because the server reports what a lane IS doing and
  // not when it started.
  const laneBusySince = {};
  const laneBusyState = {};
  const LANE_BUSY_STATES = ["transcribing", "thinking", "synthesizing", "speaking"];
  // 🔴 THE CLOCK RESTARTS ON EVERY STATE, not once per busy spell.
  //
  // JJ, 2026-08-25: *"sometimes the timers are not resetting because I was just seeing an agent
  // finishing the synthesizing of its turn and it started speaking, but the timer kept going."*
  //
  // It only started the clock `if (!laneBusySince[name])`, so a lane that went thinking →
  // synthesizing → speaking kept one running total across all three. That number answers "how
  // long has this agent been busy", which is not the question the digit sits next to: the word
  // above it names ONE stage, so the seconds beneath it have to be that stage's.
  function noteLaneBusy(name, state) {
    if (LANE_BUSY_STATES.includes(state)) {
      if (!laneBusySince[name] || laneBusyState[name] !== state) {
        laneBusySince[name] = Date.now();
        laneBusyState[name] = state;
      }
    } else {
      delete laneBusySince[name];
      delete laneBusyState[name];
    }
  }
  // 🔴 THE DECIMAL IS BACK. *"the seconds counter inside of the orbs — you have removed the
  // decimals. I think we should re-add the decimals."* (2026-08-25)
  //
  // ⚠ **One decimal, not two or three**, and the reason is the repaint rather than the arithmetic:
  // a digit that never changes is worse than no digit, so every place shown has to be redrawn at
  // its own rate. One decimal means ten repaints a second, which is the same budget the orb's
  // level ring already spends. Two would mean a hundred and three a thousand, for digits nobody
  // can read as they pass.
  //
  // Past a minute the tenths are dropped: at that scale the number is answering "is this stuck",
  // not "how fast was that", and `1m07` reads faster than `1m07.4`.
  function laneElapsed(name) {
    const since = laneBusySince[name];
    if (!since) return "";
    const ms = Date.now() - since;
    if (ms < 100) return "";
    const s = ms / 1000;
    if (s < 60) return s.toFixed(1) + "s";
    const whole = Math.floor(s);
    return Math.floor(whole / 60) + "m" + String(whole % 60).padStart(2, "0");
  }

  const LANE_HUES = ["#3559bd", "#0f7a63", "#8a3fa8", "#a8501f", "#1f6f8a", "#7a2f4f"];

  const SVG_NS = "http://www.w3.org/2000/svg";

  // ── the audio WAVEFORM visualizer (spec 016, rebuilt 2026-09-09) ─────────────────────────────
  // An audio-editor / oscilloscope waveform: a dense set of thin VERTICAL bars, MIRRORED above and
  // below the centre axis, their heights varying (spiky) into a centre-weighted envelope (a HANN
  // window — "more amplitude through the middle ... less to the sides"). Drawn into each wave lane's
  // SVG every frame by the visualizer below from a per-bar magnitude (0..1). Flat/quiet when no audio.
  const WAVE_N = 40;                                   // envelope samples across the width
  const HANN = Array.from({ length: WAVE_N },          // centre-weight envelope, 0 at edges, 1 mid
    (_, i) => 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (WAVE_N - 1)));
  const FLAT_LINE_D = "M0,20 L100,20";                 // the flat line: idle, or a quiet wave lane
  const WAVE_MAX = 17;                                  // peak half-height of the line (of the 20 above/below the axis)
  const WAVE_EASE = 0.3;                                // per-frame approach to the target — quick enough to feel alive
  const WAVE_PTS = 120;                                 // points along the drawn line
  const ZERO_MAG = () => 0;                             // targets flat; the envelope EASES down to it
  // ONE THIN LINE, NOT MIRRORED BARS (JJ, 2026-09-29: "the waveform should be a more thinner line
  // and that's more alive … that moves more. This one is too thick"). The per-sample magnitudes
  // (mic / synth / level, 0..1) still set the ENVELOPE, eased so it flows rather than jitters; a
  // travelling carrier of three sines rides inside it, so the line ripples every frame even while
  // the envelope holds. Eased envelope persists on the line element; once it has eased to ~0 this
  // returns the single flat line, so a quiet lane is truly still.
  function drawBars(line, mag, t, seed) {
    const H = line.__h || (line.__h = new Float32Array(WAVE_N));
    let maxH = 0;
    for (let i = 0; i < WAVE_N; i++) {
      const target = Math.max(0, Math.min(1, mag(i))) * HANN[i];
      H[i] += (target - H[i]) * WAVE_EASE;
      if (H[i] > maxH) maxH = H[i];
    }
    if (maxH < 0.04) return FLAT_LINE_D;                // settled flat → one clean line
    const s = seed || 0;
    let d = "";
    for (let p = 0; p <= WAVE_PTS; p++) {
      const f = p / WAVE_PTS, e = f * (WAVE_N - 1), k = Math.min(WAVE_N - 2, Math.floor(e));
      const env = H[k] + (H[k + 1] - H[k]) * (e - k);  // envelope, interpolated between samples
      const carrier = 0.55 * Math.sin(f * 38 + t * 11 + s)
                    + 0.30 * Math.sin(f * 83 - t * 17 + s * 2)
                    + 0.15 * Math.sin(f * 151 + t * 29);
      d += (p ? "L" : "M") + (f * 100).toFixed(1) + "," + (20 + carrier * env * WAVE_MAX).toFixed(2);
    }
    return d;
  }

  // HIS REAL VOICE — peak amplitude per bar from the AnalyserNode's TIME-DOMAIN buffer (a true
  // oscilloscope), AUTO-NORMALIZED so it fills the row at ANY input level.
  // ⚠ WHY NORMALIZE instead of a fixed gain (2026-09-10). A constant gain can't win: JJ's mic runs
  // quiet, so the value that filled a loud test barely moved his real waveform ("his mic runs quiet
  // ... even at 4.5 it barely moves"), and a value big enough for the quiet mic would clip a loud one.
  // So we divide each bar by a ROLLING PEAK of his own recent speech: the loudest recent syllable maps
  // to ~full and quieter ones breathe below it — the SAME on-screen presence whether he is quiet or
  // loud, matched to the agent's synthBars (which is left untouched).
  //   • INSTANT ATTACK, SLOW DECAY: the normalizer jumps up the moment he gets louder (`Math.max`
  //     against the live frame peak) and eases back down over ~1-1.5s (`* MIC_PEAK_DECAY` per frame),
  //     so it tracks his level without pumping frame to frame.
  //   • FLOORED (MIC_NORM_FLOOR): the normalizer never drops below a sane peak, so near-silence is not
  //     amplified to full and the divide is always safe. This path only RUNS while the speech VAD says
  //     he is speaking (see drawWaves' `heVoicing`), so between words it is flat, not full of noise.
  const WAVE_NOISE_FLOOR = 2;                           // out of 128; steady room tone reads as flat. LOW because his real
                                                       // mic is quiet — a bigger subtraction ate his whole signal.
  const MIC_NORM_FLOOR = 3;                             // quietest peak that still maps to a full row (guards ÷). LOW so a
                                                       // quiet mic tracks ITS OWN peak; a high floor clamped above his level
                                                       // and he could never fill. The VAD gate (heVoicing) suppresses noise,
                                                       // not this floor, so it is safe to sit just above the divide guard.
  const MIC_PEAK_DECAY = 0.99;                          // per-frame decay of the rolling peak (~1-1.5s half-life)
  const MIC_FILL_GAMMA = 0.4;                           // <1: lift the BODY of his waveform toward full so it reads as full
                                                       // as the agent's synthBars. His peaks reach full but real speech is
                                                       // transient and WAVE_EASE damps it, so normalized-alone read small
                                                       // ("does not match the agents speaking"). 0 stays 0 (silence still
                                                       // flat), 1 stays 1 — only the mid-range is lifted, spikes preserved.
  let micPeak = MIC_NORM_FLOOR;                         // rolling peak of his recent mic amplitude (0..127)
  function micBars(timeData) {
    const per = Math.max(1, Math.floor(timeData.length / WAVE_N));
    // The frame's loudest sample drives the rolling normalizer: instant attack, slow decay, floored.
    let framePeak = 0;
    for (let k = 0; k < timeData.length; k++) {
      const v = Math.abs(timeData[k] - 128);
      if (v > framePeak) framePeak = v;
    }
    micPeak = Math.max(framePeak, micPeak * MIC_PEAK_DECAY, MIC_NORM_FLOOR);
    const denom = micPeak - WAVE_NOISE_FLOOR;           // >= MIC_NORM_FLOOR - WAVE_NOISE_FLOOR > 0
    return (i) => {
      let peak = 0;
      for (let j = 0; j < per; j++) {
        const v = Math.abs(timeData[i * per + j] - 128);
        if (v > peak) peak = v;
      }
      const n = Math.min(1, Math.max(0, peak - WAVE_NOISE_FLOOR) / denom);
      return Math.pow(n, MIC_FILL_GAMMA);              // lift the body so his wave matches the agent's fullness
    };
  }
  // FALLBACK when there is a mic level but no analyser data — a shape scaled by his RMS level, so the
  // waveform still reacts to his voice (never blank when the state says he is speaking).
  function levelBars(lvl, t, seed) {
    return (i) => lvl * 1.35 * (0.4 + 0.6 * Math.abs(Math.sin(i * 2.3 + t * 14 + seed)));
  }
  // A synthesized "talking" shape for a SPEAKING agent (no captured TTS) — speech-pulsing, gentle.
  function synthBars(t, seed) {
    return (i) => {
      const f = i / (WAVE_N - 1);
      const shape = 0.55 + 0.45 * Math.sin(Math.PI * f);
      const speech = 0.30 + 0.70 * Math.abs(Math.sin(t * 2.3 + seed)
                                            + 0.4 * Math.sin(t * 5.7 + seed * 1.7)) / 1.4;
      const spike = 0.6 + 0.4 * Math.abs(Math.sin(f * 26 + t * 9 + seed * 2.1));
      return shape * speech * spike;
    };
  }

  // WHICH VISUAL LANGUAGE a status speaks (spec 016, 2026-09-09). Real states: listening / idle /
  // thinking (derived) and speaking / transcribing / synthesizing / waiting (reported). speaking and
  // listening are the WAVEFORM; the processing states share ONE sweep and differ only in DIRECTION
  // (`vizSweep`): transcribing left→right, synthesizing right→left, thinking/waiting ping-pong.
  function vizBucket(status) {
    if (status === "speaking" || status === "listening") return "wave";
    if (status === "transcribing" || status === "synthesizing"
        || status === "thinking" || status === "waiting") return "scan";
    return "idle";
  }
  function vizSweep(status) {
    if (status === "transcribing") return "lr";
    if (status === "synthesizing") return "rl";
    return "pp";   // thinking / waiting bounce back and forth
  }

  // HOW MANY COLUMNS the meeting lane grid uses, chosen so the cards stay ROUGHLY SQUARE for the
  // agent count (JJ, 2026-09-09: "the boxes should try to be squares — that's how ... we should
  // decide how to distribute them"). His examples pin the common counts (2 → a row of two, 4 → 2×2,
  // 5 → 3+2); above that it is √n rounded up, capped at three columns. A presentation choice off the
  // row count — the lane MODEL is untouched (KD2). Solo sessions never reach the grid (TC3).
  const LANE_COLS = { 2: 2, 3: 3, 4: 2, 5: 3, 6: 3 };
  function laneCols(n) {
    if (n <= 1) return 1;
    return LANE_COLS[n] || Math.min(3, Math.ceil(Math.sqrt(n)));
  }
  // AN AGENT'S COLOUR IS ITS OWN (JJ, 2026-10-01: *"I can clearly see blue and think magnus and think
  // command bridge"*). The server sends the roster's name → colour map; only a lane missing from it
  // falls back to the positional palette, which used to repaint everyone whenever the set changed.
  let laneColors = {};
  // Each agent's ROLE from the roster, shown beside its name on the card (JJ, 2026-10-05: "until I
  // know or learn what name goes with what responsibility").
  let laneRoles = {};
  // THE HIERARCHY (spec 038, JJ 2026-10-09: "there are two layers: a liaison, an agent that I speak to,
  // versus the rest of agents that only speak through my liaisons"). {liaison: [explicit workers]} from
  // the server; empty = every lane is its own speaker, the layout of before. `liaisonGroups` is the
  // SAME rule as liaison.py's `groups`: a lane no liaison claims belongs to the first liaison.
  let liaisons = {};
  function liaisonGroups(names, map) {
    const leads = Object.keys(map || {});
    const out = leads.map((lead) => ({ lead, workers: [] }));
    if (!leads.length) return out;
    for (const n of names) {
      if (leads.includes(n)) continue;
      const owner = leads.find((l) => (map[l] || []).includes(n)) || leads[0];
      out[leads.indexOf(owner)].workers.push(n);
    }
    return out;
  }
  function isWorker(name) {
    const leads = Object.keys(liaisons || {});
    return leads.length > 0 && !leads.includes(name);
  }
  // A worker shows only WORKING or IDLE (JJ: "There's only need to show their name and whether they
  // are working or idle"). Anything an agent does other than sitting in its watch is working.
  function workerState(status) {
    return /^(idle|listening|off|waiting|asleep)$/.test(String(status || "idle")) ? "idle" : "working";
  }
  diag.liaisonGroups = liaisonGroups;
  diag.workerState = workerState;
  // Whose canvas is open, so that agent's button can close it again and shows pressed (2026-10-05).
  // Declared up here because the card painter reads it before the canvas code further down runs.
  let canvasLane = null;
  function laneHue(names, name) {
    if (laneColors && laneColors[name]) return laneColors[name];
    const i = (names || []).indexOf(name);
    return i < 0 ? "var(--faint)" : LANE_HUES[i % LANE_HUES.length];
  }

  // The pure half, swept by scripts/lanestrip.py without a browser — same discipline as `orbView`
  // and `lanesView`, and the reason a literal tag went unnoticed the one time it was skipped.
  function laneOrbsView(m) {
    const names = (m.lanes || []).slice();
    // 🔴 CARDS FOR ANY SESSION WITH AN AGENT, the orb is retired (JJ, 2026-09-29: "everything is
    // agent cards now, there's no orb, even on a single lane"). The old rule kept the single orb below
    // two agents (NFR1) so a solo session looked as it always had; that look is now the anomaly — it
    // is what flashed on first launch — so a one-agent session gets a row of one card.
    const shown = names.length >= 1;
    return {
      shown,
      rows: names.map((name) => {
        // 🔴 "IDLE" WAS A LIE FOR EVERY AGENT THAT WAS ACTUALLY WORKING. JJ, 2026-08-24:
        // *"the agents say idle, but in reality, you are not idle, right? Whenever you're not
        // listening and whenever you're doing something, you're thinking."*
        //
        // The cause: `lane_states` only ever holds what an agent REPORTED. The tunnel's own stages
        // fire for the live lane; a background agent heads-down in a long task reports nothing, so
        // it read exactly like one sitting doing nothing.
        //
        // 🔴 **AND THE FIRST FIX STILL OVERCLAIMED, IN THE OTHER DIRECTION.** It separated
        // "working" from "idle" by whether the lane had ever read anything — which is history, not
        // state, and it left "idle" meaning an agent we simply could not see.
        //
        // JJ, 2026-08-25, correcting it: *"an agent that is not listening is an agent that is
        // thinking, right? We don't have a way to determine if an agent is idle or not, so we
        // shouldn't claim it. The only reason we show idle is if an agent is listening... but it's
        // not the agent I am focused on. That means that it's waiting for me. That means that it's
        // idle."*
        //
        // 🎯 **His rule needs no history at all — two facts the server already publishes:**
        //
        //     in a watch  AND live      -> listening   (it is hearing him right now)
        //     in a watch  AND not live  -> idle        (it is waiting for him, which IS idle)
        //     not in a watch            -> thinking    (it is doing something; we cannot see what)
        //
        // **"Idle" is now the ONE state we can actually observe** — a lane parked in a wait that he
        // is not talking to — rather than the label for everything unknown. And an agent that has
        // gone quiet without a watch is called thinking, because from out here that is the only
        // honest reading: it is between calls, and being between calls is work.
        let state = (m.states && m.states[name]) || "";
        if (!state || state === "idle") {
          const watching = (m.watching || []).includes(name);
          state = watching ? (name === m.live ? "listening" : "idle") : "thinking";
          // 🔴 A BACKGROUNDED WATCH IS NOT PROOF OF WAITING (JJ, 2026-09-29: "we instruct agents
          // that are busy implementing something to background their watch. And that shows them as
          // idle when in reality they are actually working"). The fleet tails each agent's session
          // log and reports its non-watch tool activity; a call still running, or one in the last
          // WORK_RECENT_S, means it is working — shown as THINKING, not a new status (JJ: "it would
          // mean thinking, right, we don't want to introduce a new status"). A foreground watch is
          // excluded from that activity, so an agent parked in one still reads as listening.
          if (watching && m.busy && m.busy(name)) state = "thinking";
        }
        const live = name === m.live;
        // 🔴 THE HAND MEANS "STILL UNHEARD", ON EVERY LANE (spec 029 FR2).
        //
        // ⚠ **This USED to force zero on the live lane, and that was his rule too:** *"the hand
        // with the turns should only show whenever the lane is not focused."* (2026-08-25) He
        // asked for the opposite on 2026-08-27 — *"The hand number should decrease gradually as
        // the [queued] turns get played"* — and the two are reconcilable rather than contradictory.
        //
        // The old rule objects to a hand that ASKS FOR ATTENTION HE IS ALREADY GIVING. The new one
        // wants a COUNTDOWN OF WHAT IS STILL TO PLAY. Counting only the unheard satisfies both: on
        // a lane he is not on it is the held backlog, and on the lane he is on it is the queue
        // draining to zero by itself. The number never asks for anything — it reports.
        const waiting = (m.waiting && m.waiting[name]) || 0;
        // THE SPLIT (2026-09-22 idea #2). When present, `waitingRegular` is what the badge shows
        // bright and what raises the warm "wants you" highlight; `waitingIntent` rides beside it,
        // dim. With no split reported (an older server), everything is treated as regular so the
        // badge degrades to exactly its previous behaviour rather than hiding a real backlog.
        const split = (m.waitingSplit && m.waitingSplit[name]) || null;
        const waitingRegular = split ? (split.regular || 0) : waiting;
        const waitingIntent = split ? (split.intent || 0) : 0;
        return {
          name, live, waiting, waitingRegular, waitingIntent, state,
          hue: laneHue(names, name),
          // The status word lives INSIDE the orb (FR6), and it is always the LANE's own state.
          //
          // ⚠ It used to read "off" on every orb while the session was down, which was wrong on
          // two counts: the session being off is already said by the power button and by the whole
          // row going grey, so repeating it N times adds nothing — and it DESTROYED the per-lane
          // information at exactly the moment it is most useful. An agent that has been thinking
          // for two minutes while he had the orb closed is the thing he most wants to see on
          // coming back, and the old rule painted it as "off".
          status: state,
          aria: name + (live ? ", live" : "")
                + (waitingRegular ? ", " + waitingRegular + " waiting to be heard" : "")
                + (waitingIntent ? ", " + waitingIntent + " intent" : "")
                + (state && state !== "idle" ? ", " + state : ""),
        };
      }),
    };
  }

  // HOW MANY REPLIES EACH LANE STILL HAS UNHEARD — a pure function, and that is the point.
  //
  // THE SERVER'S BACKLOG PLUS THIS PAGE'S. The two never overlap: the server broadcasts
  // `waiting: 0` for a lane at the instant it hands the whole queue over, and from then on the
  // remainder is local. Summing them is what makes the hand count DOWN as each clip plays instead
  // of vanishing on the first one.
  //
  // 🔴 **EXTRACTED FROM THE PAINTER BECAUSE IT COULD NOT BE TESTED THERE (spec 029).** The tally
  // lived inside `applyLaneOrbs`, so the only way to exercise it was to make the page actually
  // play audio — which a headless run cannot do, because `drainClips` returns early with no
  // AudioContext and never repaints. **Two mutation checks passed against the live bug for that
  // reason**: nothing rendered a hand either way, so the assertion was measuring silence.
  //
  // ⚠ Cues are excluded on both halves (FR1). A cue header carries no `lane` — it is the one kind
  // of audio outside the lane system — so the `|| defaultLane` fallback banked every
  // acknowledgement sound against the default lane and flashed a hand there. JJ, 2026-08-27:
  // *"I saw a hand quickly appear and disappear on the Magnus lane."*
  // (`clipOwner`, which decides whose clip is playing, lives in the shell beside `drainClips`.)

  function waitingCounts({ lanes, laneWaiting, clipQueue, playingLane, defaultLane }) {
    const out = {};
    (lanes || []).forEach((n) => {
      const local = (clipQueue || []).filter(
        (c) => c && c.header && !c.header.cue
               && (c.header.lane || defaultLane) === n).length
        + (playingLane === n ? 1 : 0);
      const total = ((laneWaiting || {})[n] || 0) + local;
      if (total) out[n] = total;
    });
    return out;
  }

  // THE SAME BACKLOG, SPLIT INTENT vs REGULAR (2026-09-22 idea #2). Mirrors `waitingCounts` exactly
  // — the same two sources (the server's held clips + this page's own draining queue) — so the two
  // never disagree about the total. The server reports its held clips already split (it carries the
  // `intent` flag on each held clip); the local clipQueue carries `header.intent` per clip; the clip
  // playing right now counts as regular, because he is HEARING it, it is not a promise still owed.
  // Regular is what should pull him to a lane; intent is a supersedable "on it…" he can ignore.
  function waitingSplitCounts({ lanes, laneWaitingSplit, clipQueue, playingLane, defaultLane }) {
    const out = {};
    (lanes || []).forEach((n) => {
      const srv = (laneWaitingSplit || {})[n] || null;
      let intent = srv ? (srv.intent || 0) : 0;
      let regular = srv ? (srv.regular || 0) : 0;
      (clipQueue || []).forEach((c) => {
        if (!c || !c.header || c.header.cue) return;
        if ((c.header.lane || defaultLane) !== n) return;
        if (c.header.intent) intent += 1; else regular += 1;
      });
      if (playingLane === n) regular += 1;
      if (intent || regular) out[n] = { intent, regular };
    });
    return out;
  }

  // THE BROWSER TAB SAYS WHO YOU ARE ON (JJ, 2026-10-01: "CB needs a favicon and the page title
  // should reflect the name of the [lane] I'm on and maybe the status as well"). Title: "magnus ·
  // listening"; favicon: a dot in that agent's own colour, so a glance at the tab bar says which
  // agent the page is talking to. Repainted on every card repaint, which is every state change.
  let lastTabKey = "";
  function paintTabIdentity(view) {
    const lane = liveLane || defaultLane || "";
    const row = (view && view.rows || []).find((r) => r.name === lane);
    const status = !(running && channelOpen) ? "off" : (row && row.status) || "";
    const title = lane ? (status ? `${lane} · ${status}` : lane) + " — command-bridge" : "command-bridge";
    let hue = lane ? laneHue(lanes, lane) : "";
    if (!hue || hue.startsWith("var(")) hue = "#79849b";
    const key = title + "|" + hue;
    if (key === lastTabKey) return;
    lastTabKey = key;
    // The TAB is the shell's (spec 023): this page is a frame inside it, so its own title is unseen.
    const tab = SH ? window.parent.document : document;
    tab.title = title;
    const icon = tab.getElementById("favicon");
    if (icon) {
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='${hue}'/></svg>`;
      icon.href = "data:image/svg+xml," + encodeURIComponent(svg);
    }
  }

  // ONE painter, and the ONLY thing allowed to touch the orb row.
  function applyLaneOrbs() {
    const waiting = waitingCounts({ lanes, laneWaiting, clipQueue, playingLane, defaultLane });
    const waitingSplit = waitingSplitCounts({ lanes, laneWaitingSplit, clipQueue, playingLane, defaultLane });
    const view = laneOrbsView({
      lanes, live: liveLane, waiting, waitingSplit, states: laneStates,
      // The two facts that separate "listening" from "working" from "never started".
      watching: watchingLanes, consumed: laneConsumed,
      sessionOff: !(running && channelOpen),
      busy: laneBusy,   // working vs waiting, from the session log — passed in so the view stays pure
    });
    view.sessionOff = !(running && channelOpen);
    // Stamp the busy clocks from the DERIVED state actually shown (row.state), NOT the raw reported
    // `laneStates`. Reported 2026-09-02: *"some agents show thinking without the seconds counter."*
    // The status WORD is derived — an unwatched lane reads "thinking" because we can see its watch
    // closed — but the clock was fed `laneStates[n] || "idle"`, where a lane that never self-reported
    // is "idle" and so never got timed. That split the word from the seconds. Feeding the same
    // derived state clocks an INFERRED thinking too, from the moment we saw it stop listening — which
    // we DO observe (the watch closing). Built after the view for that reason; still one repaint, one
    // tick, so a state that just changed is still timed from now, not the next paint.
    view.rows.forEach((r) => noteLaneBusy(r.name, r.state));
    diag.laneOrbs = view;
    paintTabIdentity(view);
    if ($orbs) {
      $orbs.hidden = !view.shown;
      // HOW MANY ORBS SHARE THE ROW — the CSS sizes each disc off its actual share of the width,
      // so two lanes get a bigger orb than three. Published rather than inferred, the same rule
      // the rest of this file follows: a stylesheet cannot count its own elements.
      $orbs.style.setProperty("--n", String(view.rows.length || 1));
      // HOW MANY COLUMNS the meeting grid uses — kept square-ish for the count (2026-09-09). Set by
      // the single painter alongside --n; the CSS grid reads it. Inert off the meeting layout.
      $orbs.style.setProperty("--cols", String(laneCols(view.rows.length)));
      // The step-back above only makes sense when there is something to step back FROM. Said once
      // on the row rather than by each orb deciding, the same rule `data-off` already follows.
      $orbs.dataset.multi = String(view.rows.length > 1);
      $orbs.replaceChildren(...(view.shown ? view.rows.map((row) => {
        const b = document.createElement("button");
        b.type = "button";
        // A WORKER (spec 038) is a name and working/idle, nothing else: it has no canvas, no voice and
        // no lane to switch to, so no canvas button, no meter, no animation, no badges, no timer. JJ:
        // "There's only need to show their name and whether they are working or idle."
        if (isWorker(row.name)) {
          const ws = workerState(row.status);
          b.className = "laneorb worker " + ws;
          b.dataset.lane = row.name;
          b.dataset.work = ws;
          b.disabled = true;   // not a lane he can switch to: its liaison speaks for it
          b.style.setProperty("--lane-c", row.hue);
          const owner = (liaisonGroups(lanes, liaisons).find((g) => g.workers.includes(row.name)) || {}).lead;
          b.setAttribute("aria-label", row.name + ", " + ws + (owner ? ", speaks through " + owner : ""));
          b.title = row.name + " · " + ws + (owner ? " · through " + owner : "");
          const wn = document.createElement("span");
          wn.className = "nm";
          wn.textContent = row.name;
          const wst = document.createElement("span");
          wst.className = "stat";
          wst.textContent = ws;
          b.append(wn, wst);
          return b;
        }
        // The warm "wants you" highlight keys off REGULAR only (2026-09-22 idea #2): a lane holding
        // nothing but intent clips must not glow for attention he is told to ignore.
        b.className = "laneorb" + (row.live ? " live" : "") + (row.waitingRegular ? " waiting" : "")
          + (Object.keys(liaisons).length ? " lead" : "");
        b.dataset.lane = row.name;
        // WHICH ACTIVITY VISUAL this lane speaks (spec 016, 2026-09-09) — the status routed to one of
        // idle / wave / scan, plus the scan DIRECTION (lr / rl / pp). `data-status` carries the raw
        // status so the visualizer can tell "listening" (his mic) from "speaking" (a synthesized
        // agent). Derived here in the painter (KD2: no model change); `laneOrbsView` is untouched.
        b.dataset.viz = vizBucket(row.status);
        b.dataset.sweep = vizSweep(row.status);
        b.dataset.status = row.status;
        b.style.setProperty("--lane-c", row.hue);
        b.setAttribute("aria-pressed", String(row.live));
        b.setAttribute("aria-label", row.aria);

        // THE DISC — the phone/voice pulse orb. Kept exactly as it was for the base layout; the
        // meeting layout hides it (CSS) and shows the activity visualizer below instead.
        const disc = document.createElement("span");
        disc.className = "disc";
        // THE ACTIVITY VISUALIZER — the meeting layout's per-lane state (spec 016). One slot holds
        // two renderers; `data-viz` (and the per-frame `.voicing` override) reveals one. The WAVEFORM's
        // path is redrawn per frame by the visualizer (near the level meter); the SCAN is CSS.
        // `display:none` on the phone/voice layout. Built by the single painter (NFR1); no state.
        const wave = document.createElement("span");
        wave.className = "wave";
        wave.setAttribute("aria-hidden", "true");
        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("class", "wavesvg");
        svg.setAttribute("viewBox", "0 0 100 40");
        svg.setAttribute("preserveAspectRatio", "none");
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("class", "waveline");
        path.setAttribute("vector-effect", "non-scaling-stroke");
        path.setAttribute("d", FLAT_LINE_D);
        svg.append(path);
        const scan = document.createElement("span");
        scan.className = "wavescan";
        wave.append(svg, scan);

        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = row.name;
        if (laneRoles && laneRoles[row.name]) {
          const role = document.createElement("span");
          role.className = "nmrole";
          role.textContent = " · " + laneRoles[row.name].replace(/-/g, " ");
          nm.append(role);
        }
        // NAME then STATUS+SECONDS (JJ, 2026-09-02: "the name of the agent is always sitting below
        // it, and the status with the seconds also sit below"). In the meeting card these are placed
        // by grid-areas (name left, state right, wave beneath); on the phone they stack under the disc.
        const st = document.createElement("span");
        st.className = "stat";
        st.textContent = row.status;
        // The seconds, appended to the status line. ⚠ ALWAYS APPENDED, even when empty, so the
        // tick can write into it without rebuilding the row (the rebuild is what broke tapping).
        const t = document.createElement("span");
        t.className = "lanetimer";
        t.textContent = laneElapsed(row.name);
        st.append(t);

        // A WAITING BADGE WITH A COUNT (FR7): a DOT in the lane hue + the number (JJ, 2026-09-09:
        // "a dot the same colour as the box and the number next to it ... in the top right",
        // replacing the ✋). It hangs off the BUTTON (not the disc) so it survives the meeting layout,
        // where the disc is replaced by the wave, and it is absolute so it never pushes the content.
        b.append(disc, wave, nm, st);
        // THE WAITING BADGE, SPLIT (2026-09-22 idea #2): the regular count bright in the lane hue,
        // the intent count a faint "+N" beside it. A lane with only intent held dims the whole badge
        // (`intent-only`) so it reads as "something parked" without pulling him off his lane.
        if (row.waitingRegular || row.waitingIntent) {
          const badge = document.createElement("span");
          badge.className = "lanewait" + (row.waitingRegular ? "" : " intent-only");
          const dot = document.createElement("span");
          dot.className = "lanedot";
          badge.append(dot);
          if (row.waitingRegular) {
            const cnt = document.createElement("span");
            cnt.className = "lanecount";
            cnt.textContent = String(row.waitingRegular);
            badge.append(cnt);
          }
          if (row.waitingIntent) {
            const ic = document.createElement("span");
            ic.className = "laneintent";
            // A leading "+" only when a regular count precedes it; intent-only reads as a plain
            // dim number, not a dangling "+3".
            ic.textContent = (row.waitingRegular ? "+" : "") + row.waitingIntent;
            badge.append(ic);
          }
          b.append(badge);
        }
        // HIS UNREAD TURNS — the mirror badge, bottom-right with an UP chevron (the top one points down),
        // so the two corners read as the two directions: top-right the agent is waiting on him, bottom-
        // right he is waiting on the agent. See laneUnread above paintReceipts.
        const unreadN = laneUnread[row.name] || 0;
        if (unreadN) {
          const ub = document.createElement("span");
          ub.className = "laneunread";
          ub.title = unreadN + (unreadN === 1 ? " turn" : " turns") + " you said that " + row.name + " hasn't read yet";
          const ud = document.createElement("span");
          ud.className = "unreaddot";
          const uc = document.createElement("span");
          uc.className = "unreadcount";
          uc.textContent = String(unreadN);
          ub.append(ud, uc);
          b.append(ub);
        }
        // OPEN-CANVAS CONTROL (spec 021 FR6) — present ONLY when this agent has a pointable frame, so
        // a click is known to reveal a canvas; clicking a card with nothing to show just switches to
        // it. A role="button" span (never a <button>: the card itself is a button, and nesting is
        // invalid). The canvas is strictly user-initiated (KD3) — it never opens on a hand or a switch.
        const fa = laneActivity.lanes && laneActivity.lanes[row.name];
        if (fa && fa.has_frame) {
          const open = document.createElement("span");
          // Pressed on the card whose canvas is SHOWING — the live lane, since the shared canvas follows
          // it (JJ, 2026-10-05: "the Dexter card had the canvas button toggled but I was in your canvas").
          const isOn = liveLane === row.name && document.body.classList.contains("canvasopen");
          open.className = "laneopen" + (isOn ? " on" : "");
          open.setAttribute("aria-pressed", isOn ? "true" : "false");
          open.setAttribute("role", "button");
          open.tabIndex = 0;
          open.dataset.openLane = row.name;
          open.title = "Open " + row.name + "'s canvas";
          open.setAttribute("aria-label", "Open " + row.name + "'s canvas");
          open.textContent = "⛶";   // ⛶ — this agent has something to show
          b.append(open);
          b.classList.add("has-open");   // deterministic hook for the badge shift (don't rely on :has)
        }
        return b;
      }) : []));
    }
    // The single orb and the row are alternatives, never both: one of them is always the whole
    // answer to "who am I talking to".
    if ($orbwrap) $orbwrap.hidden = view.shown;
    // The chip strip said exactly what the orbs now say, in less space and with less meaning.
    // Two controls for one fact is how a page starts disagreeing with itself.
    if ($lanes) $lanes.hidden = view.shown || lanes.length < 2;
    // BORDER THE SHARED CANVAS IN THE LIVE AGENT'S COLOUR (JJ, 2026-09-02) — the #sharecanvas rule
    // reads --canvas-c, so a glance says whose screen is on the canvas.
    document.documentElement.style.setProperty("--canvas-c", laneHue(lanes, liveLane) || "transparent");
    // In the fleet home the cards are positioned by the force layout, not the CSS grid — place the
    // freshly-built cards at the current node coords (the render loop keeps them live after).
    if (document.body.classList.contains("fleet")) fleetPlaceCards();
  }

  // A TAP SWITCHES THE LANE AND NOTHING ELSE (FR9). The session moved to the power button, so an
  // orb no longer has a second meaning to be ambiguous about.
  function switchLane(name) {
    if (!name || name === liveLane) return;
    if (isWorker(name)) return;   // spec 038: he speaks to liaisons only

    liveLane = name;
    applyLaneOrbs();
    applyLanes();
    // A SPECTATE PAGE NEVER MOVES HIS LANE (JJ, 2026-10-05: "The change you made made me come back. I
    // was in Draco"). Read-only means read-only: an agent's headless test clicked a canvas button on a
    // spectate page, the switch went to the server, and pulled him off the agent he was talking to.
    // The canvas still follows locally (it falls back to the lane named in cb-focus-latest).
    if (SPECTATE) return;
    fetch("/lane" + location.search, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "switch", name }),
    }).catch(() => {});
  }

  // The on-demand canvas (spec 021 FR6/KD3). STRICTLY user-initiated: opened only from a card's open
  // control (an agent that has a pointable frame), never by a hand-raise or a bare lane switch. It
  // switches to the lane so the shared canvas shows ITS frame, then reveals the surface.
  function paintOpenButtons() {   // the pressed look follows canvasLane without waiting for a card rebuild
    const on = document.body.classList.contains("canvasopen");
    for (const b of document.querySelectorAll("[data-open-lane]")) {
      const pressed = on && b.dataset.openLane === liveLane;
      b.classList.toggle("on", pressed);
      b.setAttribute("aria-pressed", pressed ? "true" : "false");
    }
  }
  function openCanvas(name) {
    autoCanvas = null;   // opened by him; the auto path re-marks it right after this returns
    canvasLane = name;
    setTimeout(paintOpenButtons, 0);
    switchLane(name);
    document.body.classList.add("canvasopen");
    // spec 022 (JJ, 2026-09-25): opening the canvas lands on the lane's latest edited frame, not the
    // whole board. The iframe was display:none until now, so it is told AFTER it has a size.
    const sc = document.getElementById("sharecanvas");
    setTimeout(() => {
      // name the lane: the canvas holds the focus until ITS switch to that lane lands (canvas/page.py)
      try { sc && sc.contentWindow.postMessage({ type: "cb-focus-latest", lane: name }, location.origin); } catch (_) {}
    }, 350);
  }
  function closeCanvas() { autoCanvas = null; canvasHeld = null; document.body.classList.remove("canvasopen"); canvasLane = null; paintOpenButtons(); }

  // THE CANVAS SHOWS WHILE AN AGENT TALKS ABOUT IT, THEN HIDES (JJ, 2026-10-05: *"when an agent wants
  // to show me something or updates something in their canvas, the canvas should show for a while
  // while the agent is speaking about that, and then it should disappear … and go back to this. And
  // then I have the possibility to toggle it back on"*).
  //
  // "Talks about it" is read from the order agents already work in: draw (or point, or arm cues),
  // THEN say. So canvas activity on a lane since that lane's last clip ended marks the next clip
  // from it as being about the canvas. When that clip starts the canvas opens on the lane's latest
  // frame; when the lane's run of clips ends it closes back to the fleet. Opening it is still never
  // a SWITCH: a clip only plays on the lane he is already on.
  //
  // He keeps it by touching it: a click into the canvas (focus moves into its frame) or its button
  // turns the auto-open into his own, which only he closes. Status frames (`_`-prefixed) never count,
  // the same opt-out that keeps them from moving the camera.
  const AUTO_CANVAS_LINGER_MS = 1500;   // a gap between one lane's clips shorter than this keeps it open
  const canvasNews = {};                // lane -> when its canvas last changed, since its last clip ended
  const canvasLook = {};                // lane -> an explicit camera move (`point --look`) since its last clip
  let autoCanvas = null;                // the lane whose canvas was opened for a clip, until he takes it
  let canvasHeld = null;                // the auto-opened lane held open until HE speaks on it (below)
  let autoCanvasT = 0;
  let canvasReplayUntil = 0;            // the SSE replays every frame after `sync`; that is not news
  // A CAMERA MOVE IS A QUESTION, SO IT WAITS FOR HIS ANSWER (JJ, 2026-10-13: *"When you show me
  // something in the canvas and I have to make a ruling on that, maybe we shouldn't hide the canvas as
  // soon as your turn ends, but until I give you that ruling."*). An edit alone still hides after the
  // clip; a frame the agent deliberately brought on screen (`point --look`, or a `look`) stays until his
  // next turn lands on that lane. Pure so the test runs the shipped rule.
  function canvasEventIsLook(d) {
    return Boolean(d) && (d.kind === "look" || (d.kind === "point" && Boolean(d.selector) && Boolean(d.look)));
  }
  window.addEventListener("cb-canvas-event", (e) => {
    const d = e.detail || {};
    if (d.kind === "sync") { canvasReplayUntil = Date.now() + 1500; return; }
    if (!d.lane || Date.now() < canvasReplayUntil) return;
    if (d.kind === "frame" && String(d.id || "").startsWith("_")) return;
    if (d.kind === "point" && !d.selector) return;   // a cleared highlight shows nothing
    canvasNews[d.lane] = Date.now();
    if (canvasEventIsLook(d)) canvasLook[d.lane] = true;
  });
  function autoCanvasOnClip(header) {
    const lane = header.lane || defaultLane;
    if (!lane || lane !== liveLane || !canvasNews[lane]) return;
    delete canvasNews[lane];
    const look = Boolean(canvasLook[lane]);
    delete canvasLook[lane];
    if (document.body.classList.contains("canvasopen")) {   // already showing: leave it as it is
      if (look && autoCanvas === lane) canvasHeld = lane;    // ...but a look on an auto-open one holds it
      return;
    }
    clearTimeout(autoCanvasT);
    openCanvas(lane);
    autoCanvas = lane;
    canvasHeld = look ? lane : null;
  }
  // His final turn on the held lane is the ruling: release the hold and close it the way a clip end would.
  function autoCanvasOnTurn(lane) {
    if (!canvasHeld || canvasHeld !== lane) return;
    canvasHeld = null;
    if (autoCanvas === lane) closeCanvas();
  }
  function autoCanvasAfterClip(header) {
    const lane = header.lane || defaultLane;
    if (!autoCanvas || autoCanvas !== lane) return;
    if (canvasHeld === lane) return;   // held for his ruling: his next turn closes it, not this clip
    clearTimeout(autoCanvasT);
    autoCanvasT = setTimeout(() => {
      const more = (clipQueue || []).some((c) => c && c.header && !c.header.cue
                                                && (c.header.lane || defaultLane) === lane);
      if (autoCanvas === lane && canvasHeld !== lane && playingLane !== lane && !more) closeCanvas();
    }, AUTO_CANVAS_LINGER_MS);
  }
  // Touching the canvas makes it his. Focus moving into the canvas frame is the one signal this
  // page gets for a click inside it.
  window.addEventListener("blur", () => {
    if (autoCanvas && document.activeElement === document.getElementById("sharecanvas")) autoCanvas = null;
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.body.classList.contains("canvasopen")) closeCanvas();
  });
  { const cc = document.getElementById("canvasclose"); if (cc) cc.addEventListener("click", closeCanvas); }

  function tapLaneOrb(ev) {
    // The open-canvas control (present only on an agent with a pointable frame) opens the canvas and
    // must NOT also fall through to a bare switch — checked first and stops here (AC5).
    const open = ev.target.closest("[data-open-lane]");
    if (open) {
      ev.stopPropagation();
      // A TOGGLE (JJ, 2026-10-05: "a click to that same button should allow me to close it"). The same
      // agent's button closes the canvas it opened; another agent's button still switches to that one.
      if (document.body.classList.contains("canvasopen") && liveLane === open.dataset.openLane) {
        closeCanvas();
        return;
      }
      openCanvas(open.dataset.openLane);
      return;
    }
    const btn = ev.target.closest("button[data-lane]");
    if (!btn) return;
    switchLane(btn.dataset.lane);
  }

  // ONE painter, and it is the ONLY thing allowed to touch the orb. Every handler updates the
  // model and calls this; none of them writes a label or a class directly.
  function applyOrb() {
    const view = orbView({ running, phase, channelOpen, muted, playing, agentState, everStarted });
    $orblabel.textContent = view.label;
    // The dimmed "closed" look now has to survive capture being released, or switching the orb off
    // would return it to the bright never-started styling — the visual saying "start me" over a
    // conversation he deliberately ended.
    $orb.classList.toggle("closed", !channelOpen && (running || everStarted));
    $orb.classList.toggle("thinking", Boolean(view.timer));
    $orb.classList.toggle("speaking", view.label === "Speaking");
    // LIVE means audio is genuinely flowing: capture past its warm-up, over a socket that is up. It
    // was added and removed by hand in four places in the audio code; derived here, it cannot be
    // left on by a path that forgot it — and it repaints correctly when this frame reloads.
    $orb.classList.toggle("live", Boolean(running && phase === "live" && S.connected));
    setBusyTimer(view.timer);
    // The power button reflects the SESSION, which is the one thing it owns (spec 014 FR2). It is
    // painted from the same view as the orb so the two can never disagree about whether the
    // conversation is live — a second source of truth for one boolean is how the picker came to
    // read "Bluetooth" while the earpiece was playing.
    if ($power) {
      const on = Boolean(running && channelOpen);
      $power.setAttribute("aria-pressed", String(on));
      $power.setAttribute("aria-label", on ? "Stop the conversation" : "Start the conversation");
      // The orb row states the SESSION once, rather than each orb inventing a state for it.
      if ($orbs) $orbs.dataset.off = String(!on);
      // And the WHOLE ROOM dims when the channel is off, so "off" is unmistakable at a glance and the
      // power button is the one lit thing to turn it back on (JJ, 2026-09-02: "the style of the whole
      // UI to be more obvious when the power button is off").
      document.documentElement.dataset.off = String(!on);
    }
    // The lane orbs' status word reads "off" while the session is down, so they repaint with the
    // orb and not only when the lane set changes — otherwise the row would keep claiming
    // "listening" over a released microphone.
    applyLaneOrbs();
    diag.orb = view;
  }

  // How long the orb has been in ITS CURRENT STATE, reddening as it climbs.
  //
  // ONE CLOCK PER STAGE, restarting at every transition. This shipped as a single clock across
  // the whole chain and the owner corrected it the moment he saw it: "I meant counts per stage. Each
  // state gets its own count." He is right and the reason is what the number is FOR — a total
  // says the wait was long, which he already knows from waiting; a per-stage count says WHICH
  // stage was long, which is the only version that tells him anything he can act on.
  //
  // Speaking is deliberately excluded ("maybe we shouldn't put the count on speaking"): the
  // audio itself already tells him how long it is taking, and a clock on it would measure his
  // own patience rather than the machine's.
  const TIMER_FULL_RED_S = 60;     // measured: the agent stage runs 15-30 s and has reached 60
  let busySince = 0;
  let busyState = "";
  let busyFrame = 0;

  function paintBusyTimer() {
    const s = (performance.now() - busySince) / 1000;
    // THREE DECIMALS, and they are not decoration. Reported 2026-08-07: "we should add decimal points
    // to that second counter because it looks a bit dull." A whole-second counter is motionless
    // for a full second at a time, which reads as FROZEN — the exact thing he is watching the
    // orb to rule out. Moving milliseconds say "still running" without him having to wonder.
    $orbtimer.textContent = s.toFixed(3) + " sec";
    // Interpolate cool -> red. Saturation and lightness climb with hue so late seconds read as
    // urgent on a phone in daylight, where hue alone is the first thing the screen loses.
    const k = Math.min(1, s / TIMER_FULL_RED_S);
    $orbtimer.style.setProperty(
      "--orb-timer",
      `hsl(${Math.round(210 - 210 * k)} ${Math.round(45 + 55 * k)}% ${Math.round(72 - 10 * k)}%)`,
    );
    busyFrame = requestAnimationFrame(paintBusyTimer);
  }

  // Driven by requestAnimationFrame rather than an interval: milliseconds have to be repainted
  // every frame to move smoothly, and rAF is the one timer the browser aligns to the display and
  // suspends when the tab is hidden — where the page cannot record anyway.
  // Pass the state name to time it; pass null to stop. Passing the SAME name again is a no-op,
  // so a repeated frame for one stage does not restart its clock.
  function setBusyTimer(state) {
    if (state && running) {
      if (busyState === state) return;
      if (busyFrame) cancelAnimationFrame(busyFrame);
      busyState = state;
      busySince = performance.now();
      $orbtimer.hidden = false;
      paintBusyTimer();
      return;
    }
    if (busyFrame) cancelAnimationFrame(busyFrame);
    busyFrame = 0;
    busySince = 0;
    busyState = "";
    $orbtimer.hidden = true;
    $orbtimer.textContent = "";
  }

  // Paint only. Used when the SERVER tells us the value — either on the ready frame or after
  // someone (a laptop, or the agent itself via `command-bridge verbose on`) changed it elsewhere. Echoing it
  // back would be a loop, so this deliberately does not call tellServer.
  function paintVerbose(next) {
    verbose = Boolean(next);
    // The button is retired, so $verbose is null now — the value still drives behaviour, it just has
    // no control to paint. Kept null-safe so the server's ready frame / `command-bridge verbose` echo
    // does not throw.
    if ($verbose) $verbose.setAttribute("aria-checked", String(verbose));
  }

  function setVerbose(next) {
    paintVerbose(next);
    tellServer("verbose", verbose);
  }

  // They are real <button>s now, so Space and Enter already fire click. The hand-wired keydown
  // handlers that a div with role=switch needed would double-toggle here — press, and the
  // control would flip and flip back.
  // (The clip-stall predicates, `clipStallAction` and `clipElapsed`, live in the shell with the
  // playback they guard; they are still on `diag`.)
  diag.orbView = orbView;
  diag.lanesView = lanesView;
  diag.tagView = tagView;
  diag.receiptView = receiptView;
  diag.laneOrbsView = laneOrbsView;
  // The unheard tally, exposed for the same reason as every other reducer here: it decides what
  // the hand says, and it must be checkable without an AudioContext (spec 029).
  diag.waitingCounts = waitingCounts;
  diag.waitingSplitCounts = waitingSplitCounts;
  diag.laneHue = laneHue;
  // Feeds a server frame into the REAL handler. Inside the shell `diag.deliver` (and
  // `deliverBytes`, the audio that must follow a header — spec 029) are the SHELL's, so a frame
  // takes the whole production path: the audio half there, then this page's `onMessage`.
  // Standalone there is no audio half, so a frame goes straight to `onMessage`.
  if (!SH) diag.deliver = (msg) => onMessage({ data: JSON.stringify(msg) });
  // An agent's transcript row WITHOUT synthesizing audio, for the screenshot harness.
  //
  // A reply only reaches the log when a clip actually plays, so a harness with no audio can never
  // see one — which is how spec 013 shipped an agent-name fix nobody had looked at. This takes the
  // same two steps the play path takes (`tagView`, then `addRow`) and skips only the sound, so
  // what it renders is what he sees. ⚠ It deliberately does NOT stub the queue: a harness that
  // fakes the delivery path would stop being evidence about the delivery path.
  diag.renderAgentRow = (lane, text) =>
    addRow(tagView({ from: "agent", lane, lanes, fallback: defaultLane }), text, "claude",
           undefined, lane || defaultLane);

  // Collapse the transcript. Reported 2026-08-07: "I want to make that collapsible so that I can just
  // collapse it and hide it and just have the orb and the buttons and not see the transcript
  // text."
  //
  // `hidden` rather than a height animation, and the reason is the grid: an empty-but-present
  // 1fr row still eats its space, which is the same trap `#log:empty` already documents. The
  // body rule keys off `#log[hidden]` so collapsing genuinely gives the room back to the orb
  // instead of leaving a hole where the transcript was.
  //
  // Persisted, because it is a mode you choose for a situation — driving, or somebody else in
  // the room — and having to re-choose it on every reconnect would make it useless for exactly
  // those situations.
  function setCollapsed(next) {
    const on = Boolean(next);
    $log.hidden = on;
    // aria-EXPANDED, not aria-checked: this is a disclosure control for the region named by
    // aria-controls, not a two-state setting. A screen reader announces "collapsed/expanded"
    // instead of "not pressed", which is the difference between describing the transcript and
    // describing a switch.
    $collapse.setAttribute("aria-expanded", String(!on));
    localStorage.setItem("command-bridge.collapsed", on ? "1" : "0");
    diag.collapsed = on;
    // Rows added while collapsed have no measurable geometry, so the log would reopen scrolled
    // to wherever it was when it closed. Snap it back to the newest line on the way out.
    if (!on) scrollToEnd();
  }

  // ---------------------------------------------------------------- transcript scope (spec 026)
  //
  // JJ, 2026-10-08: "I would like it to filter to the agent that I am on. Instead of showing every
  // transcript for every agent." A PURE decision (logScopeView) plus ONE painter (applyLogScope),
  // the orb/lanes/pills discipline. Rows are hidden with `.offscope`, never removed, so the saved log
  // stays whole and "All agents" brings everything back at once.
  //
  // The scope is read from storage on every call rather than held in a `let`: applyLanes() can run
  // before this block's statements have executed, and a `let` read then is a TDZ ReferenceError.
  const LOGSCOPE_KEY = "command-bridge.logscope";
  function getLogScope() {
    try { return localStorage.getItem("command-bridge.logscope") === "all" ? "all" : "lane"; }
    catch (_) { return "lane"; }
  }
  // Is a row for `rowLane` visible? FR3 + FR6.
  function logScopeView(m) {
    if (m.scope !== "lane") return true;
    if ((m.laneCount || 0) < 2) return true;          // no choice to make below two lanes
    if (!m.live || m.live === m.broadcast) return true;
