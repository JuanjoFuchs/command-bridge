    get sinkWanted() { return sinkWanted; }, set sinkWanted(v) { sinkWanted = v || ""; },
    get sinkSupported() { return sinkSupported; }, set sinkSupported(v) { sinkSupported = Boolean(v); },
    get sinkRefused() { return sinkRefused; }, set sinkRefused(v) { sinkRefused = Boolean(v); },
    get phase() { return phase; },
    get playing() { return playing; },
    get everStarted() { return everStarted; },
    get playingLane() { return playingLane; },
    get playingSource() { return playingSource; },
    get speakingSignal() { return speakingSignal; },
    get analyser() { return analyser; },
    get playAnalyser() { return playAnalyser; },
    get clipQueue() { return clipQueue; },
    get ctx() { return ctx; },
    get micStream() { return micStream; },
    get connected() { return Boolean(ws && ws.readyState === WebSocket.OPEN); },
  };
  // THE APP'S HALF OF THE CONTRACT (spec 032 FR2). In NATIVE mode the service plays the clips and owns
  // the session, so it tells the page what is true and the page paints it through its own painters —
  // the orb, the lane that is speaking, the transcript's spoken rows — exactly as if it were playing.
  let nativeRoutes = null;
  // TO THE APP (spec 032/033). A web message, not a JavaScript interface: the app answers only messages
  // posted from THIS top frame, so the canvas frames (agent-authored HTML, same origin) cannot drive
  // the orb or move his audio (spec 033 review). Hoisted, so orbTapped above can call it.
  function nativeCall(op, extra) {
    try { window.CBNative && window.CBNative.postMessage(JSON.stringify(Object.assign({ op }, extra || {}))); }
    catch (e) {}
  }
  if (NATIVE) {
    window.cbNative = {
      state(s) {
        running = Boolean(s && s.running);
        channelOpen = Boolean(s && s.channelOpen);
        if (running) everStarted = true;
        phase = (s && s.phase) || (running ? "live" : "idle");
        if (!running || !channelOpen) { levelTarget = 0; speakingSignal = false; }
        applyOrb();
      },
      // HIS LEVEL (spec 033 FR1): the service captures, so it hands the page each frame's level on the
      // page's own scale and its speech detector's state. These are the two facts the meter and his
      // lane's wave already follow (the level-driven bars: there is no analyser in the app).
      level(l, speaking) {
        levelTarget = Math.max(0, Math.min(1, Number(l) || 0));
        speakingSignal = Boolean(speaking);
      },
      // THE OUTPUTS the phone has and the one in use (spec 033 FR3), for the caret on the mic. Kept so a
      // UI frame that reloads repaints the caret on attach.
      routes(r) {
        if (PRIMS) return;   // spec 044: the server's `native_routes` is the source
        nativeRoutes = r || null;
        ui("nativeRoutes", nativeRoutes);
      },
      clip(kind, header) {
        if (!header) return;
        if (kind === "start") {
          playing = true;
          playingLane = clipOwner(header, defaultLane);
          applyLaneOrbs();
          applyOrb();
          if (!header.cue) ui("clipStarted", header);
        } else {
          playing = false;
          playingLane = null;
          applyLaneOrbs();
          applyOrb();
          if (!header.cue) ui("clipEnded", header);
        }
      },
    };
  }
  window.cbShell = {
    state, diag,
    // Called by the UI frame on every load. The UI repaints from `state`; the server is asked for
    // the ready frame again so the lanes come from the server rather than from a replay (FR4).
    attach(h) {
      hooks = h;
      if (lastError) ui("setError", lastError);
      if (reloadPending) ui("updateWaiting", true);
      if (readySeen && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "resync" }));
      if (lastPartial) ui("message", lastPartial);
      if (nativeRoutes) ui("nativeRoutes", nativeRoutes);
    },
    // The mic caret's choice in the app (spec 033 FR3): the app owns the route, so the pick goes to it.
    setNativeRoute(type) {
      if (!NATIVE) return;
      // Spec 044: the server keeps his pick and routes the app; an older app keeps it itself.
      if (PRIMS) { tellServer("route_pick", Number(type)); return; }
      nativeCall("setRoute", { type: Number(type) });
    },
    detach(h) { if (hooks === h) hooks = null; },
    orbTapped,                                   // call it INSIDE the click handler: TC1
    tellServer,
    // A different microphone is a full rebuild of capture (see the picker in the UI for why).
    async restartCapture() { await stop({ rebuild: true }); await start(); },
    applySink, normSink, currentSink, liveSink,
  };

  // --- reloading: the UI reloads itself; the shell only for its OWN change (FR5, FR6) ----------
  // ⚠ NEVER reload the shell out from under a LIVE channel. A full reload destroys the AudioContext
  // and the microphone, and a browser will not restart either without a fresh tap — so a shell
  // change is HELD while running && channelOpen and applied the instant he next goes off. Only a
  // change to this file can need that now; a UI change reloads the UI frame live.
  let reloadPending = false;
  const liveNow = () => running && channelOpen;
  function hardReload() {
    // A new ?_v= is a cache miss, so a pushed reload always lands the new bytes. The token and every
    // other param are kept; replace() keeps the churn out of back-history.
    try {
      const u = new URL(location.href);
      u.searchParams.set("_v", Date.now().toString(36));
      location.replace(u.href);
    } catch (_) { location.reload(); }
  }
  function applyHeldReload() { if (reloadPending && !liveNow()) hardReload(); }
  if (!MOCK) {
    try {
      const es = new EventSource("/events");
      let reloadT;
      es.addEventListener("reload", (e) => {
        let d = {}; try { d = JSON.parse(e.data || "{}"); } catch (_) {}
        if (!d.shell_sig || d.shell_sig === SHELL_SIG) return;   // the shell did not change
        clearTimeout(reloadT);
        reloadT = setTimeout(() => {
          if (!liveNow()) { hardReload(); return; }
          reloadPending = true;
          ui("updateWaiting", true);
        }, 250);
      });
    } catch (_) {}
  }

  // --- boot: the UI frame, and the socket on load (before any tap) -----------------------------
  // The socket needs no permission and no gesture — only the microphone does — so the page arrives
  // already connected, and the first tap has one job instead of three.
  const frame = document.getElementById("ui");
  frame.addEventListener("load", () => { try { frame.contentWindow.focus(); } catch (_) {} });
  frame.src = "/ui" + location.search;
  if (!MOCK) {
    openSocket(48000).catch((e) => diag.errors.push("initial connect: " + e.message));
  }
})();
</script>
</body>
</html>
