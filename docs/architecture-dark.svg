<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-label="One spoken turn. You speak into a phone browser; voice-tunnel runs a wake gate and speech recognition and writes a line to a log; your agent reads that line, reasons, and calls say; voice-tunnel synthesizes the reply and you hear it. Everything runs on your machine.">
  <rect width="880" height="262" fill="#0d1117"/>
  <defs>
    <marker id="a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ffb35e"/></marker>
    <marker id="a-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8fb4ff"/></marker>
  </defs>
  <rect x="0" y="14" width="188" height="202" rx="14" fill="#161b22" stroke="#ffffff1f" stroke-width="1"/>
  <rect x="240" y="14" width="380" height="202" rx="14" fill="#161b22" stroke="#ffffff1f" stroke-width="1"/>
  <rect x="674" y="14" width="206" height="202" rx="14" fill="#161b22" stroke="#ffffff1f" stroke-width="1"/>
  <text x="94" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#e7eaf1" text-anchor="middle" font-weight="600">You</text>
  <text x="94" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8d95a3" text-anchor="middle">no app · one tap</text>
  <text x="430" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#e7eaf1" text-anchor="middle" font-weight="600">voice-tunnel</text>
  <text x="430" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8d95a3" text-anchor="middle">holds no model · decides nothing</text>
  <text x="777" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#e7eaf1" text-anchor="middle" font-weight="600">Your agent</text>
  <text x="777" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8d95a3" text-anchor="middle">all the intelligence</text>
  <path d="M166,112 H262" stroke="#ffb35e" stroke-width="2" fill="none" marker-end="url(#a-warm)"/>
  <text x="214" y="100" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#ffb35e" text-anchor="middle">your voice</text>
  <path d="M598,112 H696" stroke="#ffb35e" stroke-width="2" fill="none" marker-end="url(#a-warm)"/>
  <text x="647" y="100" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#ffb35e" text-anchor="middle">a line in the log</text>
  <path d="M696,180 H598" stroke="#8fb4ff" stroke-width="2" fill="none" marker-end="url(#a-cool)"/>
  <text x="647" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8fb4ff" text-anchor="middle">say "…"</text>
  <path d="M262,180 H166" stroke="#8fb4ff" stroke-width="2" fill="none" marker-end="url(#a-cool)"/>
  <text x="214" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8fb4ff" text-anchor="middle">spoken reply</text>
  <text x="94" y="117" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#ffb35e" text-anchor="middle">you speak</text>
  <text x="94" y="185" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#8fb4ff" text-anchor="middle">you hear</text>
  <text x="430" y="117" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#ffb35e" text-anchor="middle">wake gate  ›  speech recognition</text>
  <text x="430" y="185" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8fb4ff" text-anchor="middle">speech synthesis</text>
  <text x="777" y="117" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#ffb35e" text-anchor="middle">watch --since</text>
  <text x="777" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4b5" text-anchor="middle">reason · run tools</text>
  <text x="777" y="185" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8fb4ff" text-anchor="middle">say</text>
  <text x="440" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4b5" text-anchor="middle">Runs entirely on your machine. No GPU, no account, no speech API.</text>
</svg>
