  const names = Object.keys(BEATS).sort((a, b) => BEATS[a] - BEATS[b]);
  const cards = Object.fromEntries(names.map(n => [n, document.querySelector("#agent-" + n + " .card")]));
  // One agent lit at a time, crisp, no blur: its card edge goes orange and a little thicker, in 0.3 s.
  window.seek = function (t) {
    t = Math.max(0, Math.min(16.0, Number(t) || 0));
    let lit = names[0];
    for (const n of names) if (t >= BEATS[n]) lit = n;
    const a = Math.min(1, (t - BEATS[lit]) / 0.3);
    for (const n of names) {
      const c = cards[n], on = n === lit;
      // inline style, not attributes: the .card rule's stroke and fill would win over a presentation attribute
      c.style.stroke = on ? "#f97316" : "";
      c.style.strokeWidth = on ? (2 + 3 * a).toFixed(2) + "px" : "";
      c.style.fill = on ? "rgba(249,115,22," + (0.10 * a).toFixed(3) + ")" : "";
    }
  };
  window.seek(0);
})();
</script>
</body></html>
