name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Three operating systems because the things that break here are OS-shaped: per-user
    # directory conventions (LOCALAPPDATA vs XDG vs Application Support), path separators, and
    # the SAPI backend which only exists on Windows. A Linux-only matrix would pass while the
    # tool wrote its config to the wrong place on two thirds of installs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Core only, deliberately. The suite must pass with no piper, no sherpa-onnx, no model and
      # no microphone — that is the floor a fresh `pip install voice-tunnel` lands on, and if the
      # tests need more than the floor they are not testing what users get.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check voice_tunnel/ tests/ scripts/

      - name: Test
        run: python -m pytest tests/ -q

      - name: The CLI answers from an unrelated working directory
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python -m voice_tunnel describe > /dev/null
          voice-tunnel describe > /dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Validate metadata
        run: twine check dist/*

      # The client page is package DATA living at voice_tunnel/web/. If it stops being included,
      # every installed user gets a 500 on the only page the tool serves, and no test that runs
      # from a checkout can see it — a checkout has the file whether the wheel ships it or not.
      - name: The wheel contains the client page and no model
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "voice_tunnel/web/index.html" in names, f"client page missing from {wheel}"
          heavy = [n for n in names if n.endswith((".onnx", ".bin", ".tar.bz2"))]
          assert not heavy, f"model files must never ship in the wheel: {heavy}"
          size = len(open(wheel, "rb").read())
          assert size < 1_000_000, f"wheel is {size} bytes; a model has probably crept in"
          print(f"ok: {wheel} {size} bytes, {len(names)} entries")
          PY
