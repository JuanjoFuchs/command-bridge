name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Three operating systems because the things that break here are OS-shaped: per-user
    # directory conventions (LOCALAPPDATA vs XDG vs Application Support), path separators, and
    # the SAPI backend which only exists on Windows. A Linux-only matrix would pass while the
    # tool wrote its config to the wrong place on two thirds of installs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Core only, deliberately. The suite must pass with no piper, no sherpa-onnx, no model and
      # no microphone — that is the floor a fresh `pip install command-bridge` lands on, and if the
      # tests need more than the floor they are not testing what users get.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check command_bridge/ tests/ scripts/

      - name: Test
        run: python -m pytest tests/ -q

      # Spec 011, FR4/AC23. The saving this repo claims is recomputed here from the working tree —
      # both the before and the after — and the step fails when a floor is missed. A number written
      # into a document is true exactly once; this one cannot rot, because there is no recorded
      # constant for a later payload change to falsify.
      #
      # In the matrix rather than in a job of its own, deliberately. It has to run on the CI FLOOR
      # (TC6, AC26): core dependencies only, no piper, no model, no microphone. A gate that needed
      # the extras would be a gate nobody could run, and running it on all three operating systems
      # is what keeps it that way. It starts and contacts no server (TC1) — every payload is built
      # in process.
      - name: The context saving still clears its floors
        run: python scripts/contextcost.py --gate

      - name: The CLI answers from an unrelated working directory
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python -m command_bridge describe > /dev/null
          command-bridge describe > /dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Validate metadata
        run: twine check dist/*

      # The client page is package DATA living at command_bridge/web/. If it stops being included,
      # every installed user gets a 500 on the only page the tool serves, and no test that runs
      # from a checkout can see it — a checkout has the file whether the wheel ships it or not.
      - name: The wheel contains the client page and no model
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "command_bridge/web/index.html" in names, f"client page missing from {wheel}"
          heavy = [n for n in names if n.endswith((".onnx", ".bin", ".tar.bz2"))]
          assert not heavy, f"model files must never ship in the wheel: {heavy}"
          size = len(open(wheel, "rb").read())
          assert size < 1_000_000, f"wheel is {size} bytes; a model has probably crept in"
          print(f"ok: {wheel} {size} bytes, {len(names)} entries")
          PY
