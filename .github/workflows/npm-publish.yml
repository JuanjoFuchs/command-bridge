name: Publish to npm

# Simpler than agent-mail-cli's equivalent, and the difference is the packaging model: that one
# downloads per-platform PyInstaller binaries into the npm package, so its workflow has to verify
# every release asset exists first. This npm package carries no binary — it builds a private
# virtualenv at postinstall and pip-installs `voice-tunnel` into it (spec 003) — so the only
# thing that must be true before publishing is that the PyPI version is actually live.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v prefix"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # `environment: release` is not decoration — npm's trusted publisher matches on it, and the
    # OIDC token carries it as a claim. It was configured on npmjs as `release` while this job
    # declared none, so every automated npm publish this project ever attempted failed with a
    # 404: npm reports "not found" rather than "forbidden" for a package you cannot publish to,
    # so it does not leak whether the name exists, and the error names neither the real cause
    # nor the field that is wrong.
    #
    # Declared here rather than relaxed on npmjs because an environment is worth having: it is
    # the place to require a manual approval before anything reaches a public registry.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # NO `registry-url`, and its absence is the whole fix — the same shape of bug as the one
      # that broke PyPI in this very release, one layer over.
      #
      # `registry-url` makes setup-node write an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. With no NODE_AUTH_TOKEN set that
      # expands to an EMPTY token, npm sees credentials configured and authenticates with them,
      # and OIDC is never attempted. npm then answers 404 rather than 403, so the message names
      # neither the cause nor the field.
      #
      # AN EMPTY CREDENTIAL IS NOT AN ABSENT ONE. Trusted publishing needs npm to find no auth
      # configured at all, which means not writing the file in the first place. The registry
      # defaults to registry.npmjs.org regardless, so nothing is lost by omitting it.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 24 satisfies the
      # runtime, but the npm bundled with a given Node image drifts, and the failure mode of
      # being one patch short is an authentication error that reads like a misconfigured
      # publisher rather than an old client. Pin it forward and assert it.
      - name: Ensure an npm new enough for OIDC
        run: |
          npm install -g npm@latest
          npm --version
          node -e "
            const [maj,min,pat] = require('child_process')
              .execSync('npm --version').toString().trim().split('.').map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error('npm >= 11.5.1 required for trusted publishing'); process.exit(1); }
          "

      # THE ORDERING CONSTRAINT. npm postinstall runs `pip install voice-tunnel==<version>`, so
      # publishing to npm before PyPI has the version produces a package that installs cleanly
      # and then fails for every user. npm has no meaningful unpublish after 72 hours; PyPI has
      # none at all. Check first.
      - name: The PyPI version must already exist
        run: |
          VERSION="${{ inputs.version }}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/voice-tunnel/$VERSION/json")
          if [ "$CODE" != "200" ]; then
            echo "voice-tunnel==$VERSION is not on PyPI (HTTP $CODE)."
            echo "npm postinstall would install a version that does not exist. Publish PyPI first."
            exit 1
          fi
          echo "voice-tunnel==$VERSION is live on PyPI"

      - name: Sync the package version
        working-directory: npm
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          node -e "console.log('publishing', require('./package.json').name, require('./package.json').version)"

      - name: Syntax-check the launcher and the postinstall
        working-directory: npm
        run: |
          node --check bin/voice-tunnel.js
          node --check scripts/postinstall.js

      # NO NODE_AUTH_TOKEN. Publishing authenticates by OIDC against the trusted publisher
      # configured on the package — `id-token: write` above is what makes that possible. The
      # account has 2FA set to auth-and-writes, which a token-based CI publish cannot satisfy;
      # automation tokens used to bypass it and that bypass is what npm is deprecating. No secret
      # exists here to leak, rotate, or forget to delete.
      #
      # This requires the package to ALREADY EXIST — a trusted publisher is configured on a
      # package settings page and npm has no pending-publisher equivalent to PyPI's. The first
      # 0.1.0 publish is therefore a manual, interactive `npm publish` with an OTP. See spec 003.
      - name: Publish
        working-directory: npm
        run: npm publish --access public
