<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>voice-mode</title>
<link rel="icon" href="data:," /><!-- suppress the favicon 404; there is no icon to serve -->
<style>
  :root {
    --bg:#07090c; --fg:#e9eef5; --dim:#7d8899; --ok:#5eead4; --err:#fb7185;
    --card:#0e1319; --edge:#ffffff12; --level:0;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6f8; --fg:#0d1117; --dim:#5b6675; --card:#ffffff; --edge:#0000000f; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg);
    font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.5rem; padding:1.5rem; -webkit-tap-highlight-color:transparent; overflow:hidden;
  }
  h1 { font-size:.72rem; font-weight:600; letter-spacing:.24em; text-transform:uppercase;
       color:var(--dim); margin:0; }

  /* The orb is the whole interface. It has to answer "is it hearing me?" from across a room,
     so every state is a distinct colour AND a distinct motion — colour alone fails outdoors
     and for colour-blind users. */
  #orbwrap { position:relative; display:grid; place-items:center;
             width:min(58vw,240px); aspect-ratio:1; }
  #ring {
    position:absolute; inset:0; border-radius:50%; pointer-events:none;
    /* scale is driven live by microphone RMS — this is the "when I speak" feedback */
    transform:scale(calc(1 + var(--level) * 0.45));
    background:radial-gradient(circle, transparent 58%, color-mix(in srgb, var(--ok) 45%, transparent) 72%, transparent 76%);
    opacity:calc(0.15 + var(--level) * 0.85);
    transition:opacity .09s linear, transform .09s linear;
  }
  #orb {
    position:relative; width:76%; aspect-ratio:1; border-radius:50%; border:none;
    cursor:pointer; color:var(--fg); font-size:1rem; font-weight:600; letter-spacing:.01em;
    background:radial-gradient(circle at 38% 30%, #223044, #0c1118 72%);
    box-shadow:0 0 0 1px var(--edge), 0 20px 60px #000a;
    transition:transform .14s cubic-bezier(.34,1.56,.64,1), background .3s ease;
  }
  #orb:active { transform:scale(.96); }
  #orb.live   { background:radial-gradient(circle at 38% 30%, #1d3a3a, #0a1414 72%); }
  #orb.speaking {
    background:radial-gradient(circle at 38% 30%, #2b3f5c, #0d1420 72%);
    animation:breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.045)} }
  @media (prefers-reduced-motion:reduce) {
    #orb.speaking { animation:none; }
    #ring { transition:none; }
  }

  #state { font-size:.88rem; color:var(--dim); min-height:1.4em; text-align:center;
           letter-spacing:.01em; }
  #state.err { color:var(--err); }
  #lag { font-size:.72rem; color:#fbbf24; letter-spacing:.02em; min-height:1em;
         font-variant-numeric:tabular-nums; }
  #lag.ok { color:var(--dim); }
  #orb.thinking { animation:pulse 1.15s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.62} }
  @media (prefers-reduced-motion:reduce) { #orb.thinking { animation:none; } }

  #log { width:min(100%,600px); max-height:34vh; overflow-y:auto; background:var(--card);
         border-radius:16px; padding:.5rem .25rem; font-size:.92rem;
         box-shadow:0 0 0 1px var(--edge); }
  #log:empty { display:none; }
  .row { padding:.5rem .9rem; display:flex; gap:.7rem; align-items:baseline; }
  .row + .row { border-top:1px solid var(--edge); }
  .row .tag { flex:0 0 auto; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
              color:var(--dim); font-weight:600; padding-top:.15rem; }
  .row.addressed .tag { color:var(--ok); }
  .row.claude { color:var(--dim); font-style:italic; }
  .row.claude .tag { color:#93b4ff; font-style:normal; }
</style>
</head>
<body>
  <h1>voice&#8209;mode</h1>
  <div id="orbwrap"><div id="ring"></div><button id="orb">Tap to start</button></div>
  <div id="state">idle</div>
  <div id="lag"></div>
  <div id="log" role="log" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const $orb = document.getElementById("orb");
  const $state = document.getElementById("state");
  const $lag = document.getElementById("lag");
  const $log = document.getElementById("log");

  const token = new URLSearchParams(location.search).get("token") || "";
  let ws = null, ctx = null, micStream = null, node = null, source = null;
  let wakeLock = null, running = false, pendingClip = null;

  // Exposed so the e2e harness can assert on real state rather than scraping the DOM.
  // `peakRms` is not decoration: without it, "the mic is delivering silence" and "the server
  // dropped my audio" look identical from outside, and that ambiguity costs hours.
  const diag = window.__vm = {
    connected:false, framesSent:0, peakRms:0, turns:[], played:[], errors:[]
  };

  const setState = (t, cls) => { $state.textContent = t; $state.className = cls || ""; };

  function addRow(tag, text, cls) {
    const d = document.createElement("div");
    d.className = "row" + (cls ? " " + cls : "");
    const s = document.createElement("span");
    s.className = "tag"; s.textContent = tag;
    const t = document.createElement("span");
    t.textContent = text;
    d.appendChild(s); d.appendChild(t);
    $log.appendChild(d); $log.scrollTop = $log.scrollHeight;
  }

  // Live level -> CSS variable, smoothed and painted once per frame rather than per audio
  // callback. Writing a style on every 4096-sample block (~12/s) is wasteful and jittery;
  // rAF gives smooth motion decoupled from the audio rate.
  let level = 0, levelTarget = 0;
  (function paint() {
    // Fast attack, slow release — matches how a level meter should feel: it jumps to your
    // voice instantly but decays gently instead of strobing on every syllable gap.
    level += (levelTarget - level) * (levelTarget > level ? 0.5 : 0.08);
    document.documentElement.style.setProperty("--level", level.toFixed(3));
    requestAnimationFrame(paint);
  })();

  // --- Screen Wake Lock -----------------------------------------------------
  // Replaces installing a Caffeine-type app: the page keeps the screen alive itself.
  // The lock is auto-released whenever the document goes inactive, so it MUST be
  // re-acquired on visibilitychange or the screen sleeps on the first glance away.
  async function acquireWakeLock() {
    if (!("wakeLock" in navigator)) return;
    try { wakeLock = await navigator.wakeLock.request("screen"); }
    catch (e) { diag.errors.push("wakeLock: " + e.message); }
  }
  document.addEventListener("visibilitychange", async () => {
    if (running && wakeLock !== null && document.visibilityState === "visible") {
      await acquireWakeLock();
    }
  });

  // --- capture --------------------------------------------------------------
  function floatToPCM16(f32) {
    const out = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  async function start() {
    if (running) return stop();
    setState("requesting microphone…");
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true }
      });
    } catch (e) {
      // On a LAN IP navigator.mediaDevices is undefined and this is a TypeError. That is not
      // a bug to fix here — it is the secure-context rule. See ai-docs/reference/browser.md.
      const msg = (navigator.mediaDevices ? e.message : "insecure origin — needs HTTPS or localhost");
      diag.errors.push("getUserMedia: " + msg);
      setState("microphone unavailable: " + msg, "err");
      return;
    }

    // Created inside the click handler so the autoplay policy unlocks playback too.
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") await ctx.resume();

    await openSocket(ctx.sampleRate);

    source = ctx.createMediaStreamSource(micStream);
    // ScriptProcessorNode is deprecated but universally present, including headless Chrome.
    // For one local user at 4096 frames the main-thread cost is irrelevant, and it removes a
    // whole class of AudioWorklet module-loading failure from the critical path.
    // MUST declare 1 output channel, not 0. A ScriptProcessorNode with zero outputs is never
    // pulled by the graph, so onaudioprocess simply never fires and the mic silently produces
    // nothing. Its output is muted through a zero-gain node instead.
    node = ctx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = (ev) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const ch = ev.inputBuffer.getChannelData(0);
      let sum = 0;
      for (let i = 0; i < ch.length; i++) sum += ch[i] * ch[i];
      const r = Math.sqrt(sum / ch.length);
      if (r > diag.peakRms) diag.peakRms = r;
      // Normalise against a typical speaking level (~0.15 RMS) so the ring uses its full
      // range on ordinary speech instead of only reacting to shouting.
      levelTarget = Math.min(1, r / 0.15);
      ws.send(floatToPCM16(ch).buffer);
      diag.framesSent++;
    };
    source.connect(node);
    const sink = ctx.createGain(); sink.gain.value = 0;   // pull the graph without audible echo
    node.connect(sink); sink.connect(ctx.destination);

    running = true;
    await acquireWakeLock();
    $orb.textContent = "Listening";
    $orb.classList.add("live");
    setState('say "hey claude…"');
  }

  async function stop() {
    running = false;
    try { if (node) node.disconnect(); } catch {}
    try { if (source) source.disconnect(); } catch {}
    try { if (micStream) micStream.getTracks().forEach(t => t.stop()); } catch {}
    try { if (ws) ws.close(); } catch {}
    try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {}
    $orb.textContent = "Tap to start";
    $orb.classList.remove("live", "speaking");
    setState("stopped");
  }

  function openSocket(sampleRate) {
    return new Promise((resolve) => {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(token)}`);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        diag.connected = true;
        ws.send(JSON.stringify({ type:"hello", sample_rate: sampleRate }));
        resolve();
      };
      ws.onclose = () => { diag.connected = false; if (running) setState("disconnected", "err"); };
      ws.onerror = () => { diag.errors.push("websocket error"); resolve(); };
      ws.onmessage = onMessage;
    });
  }

  async function onMessage(ev) {
    if (typeof ev.data === "string") {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === "turn") {
        diag.turns.push(msg);
        addRow(msg.addressed ? "you" : "heard", msg.text, msg.addressed ? "addressed" : "");
      } else if (msg.type === "audio_header") {
        pendingClip = msg;                       // the bytes follow in the next frame
      } else if (msg.type === "ready") {
        setState('connected — say "hey claude…"');
      } else if (msg.type === "agent_state") {
        // Silence is ambiguous. Naming the state is what separates "it did not hear me" from
        // "it heard me and is working" from "it is holding back so as not to cut me off".
        const label = {
          idle:         'listening — say "hey claude…"',
          transcribing: "① transcribing what you said…",
          thinking:     "③ claude is thinking…",
          synthesizing: "④ generating speech…",
          waiting:      "⏸ ready to reply — letting you finish",
          speaking:     "⑤ claude is speaking",
        }[msg.state];
        if (label) setState(label);
        const busy = ["transcribing", "thinking", "synthesizing", "waiting"].includes(msg.state);
        $orb.classList.toggle("thinking", busy);
      } else if (msg.type === "consumed") {
        diag.consumed = msg.cursor;
        // The gap between what you have said and what the agent has actually read — the
        // read-lag gauge, same idea as mc view's "consumed through #N" divider.
        $lag.textContent = msg.pending > 0
          ? `② ${msg.pending} turn${msg.pending === 1 ? "" : "s"} logged, not yet read by claude`
          : (msg.cursor >= 0 ? `② claude has read through turn #${msg.cursor}` : "");
        $lag.classList.toggle("ok", msg.pending === 0 && msg.cursor >= 0);
      }
      return;
    }
    if (pendingClip) { await playClip(pendingClip, ev.data); pendingClip = null; }
  }

  async function playClip(header, buf) {
    try {
      const pcm = new Int16Array(buf);
      const f32 = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) f32[i] = pcm[i] / 32768;
      const audio = ctx.createBuffer(1, f32.length, header.sample_rate);
      audio.getChannelData(0).set(f32);
      const src = ctx.createBufferSource();
      src.buffer = audio; src.connect(ctx.destination);
      $orb.classList.add("speaking");
      $orb.textContent = "Speaking";
      setState("");
      addRow("claude", header.text || "", "claude");
      await new Promise((res) => { src.onended = res; src.start(); });
      $orb.classList.remove("speaking");
      $orb.textContent = running ? "Listening" : "Tap to start";
      if (running) setState('say "hey claude…"');
      diag.played.push(header.id);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type:"played", id: header.id }));
      }
    } catch (e) {
      diag.errors.push("playback: " + e.message);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type:"client_error", message:"playback: " + e.message }));
      }
    }
  }

  $orb.addEventListener("click", start);
  if (!token) setState("no token in URL — append ?token=…", "err");
})();
</script>
</body>
</html>
